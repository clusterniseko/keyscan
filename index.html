   12. CHECK-IN / CHECK-OUT ENTRY POINTS
   ========================================================================== */
VIEWS.checkin  = () => VIEWS.scan({ctx:"checkin"});
VIEWS.checkout = () => VIEWS.scan({ctx:"checkout"});

/* ==========================================================================
   12a. DEPARTURES — rooms leaving the hotel, so nothing stays behind
   ========================================================================== */
function departingRooms(){
  return DB.rooms.filter(r=>r.departure && r.status!=="checked_out" && storagesOfRoom(r.id).length)
    .map(r=>({r, d:daysTo(r.departure), sts:storagesOfRoom(r.id)}))
    .sort((a,b)=>a.d-b.d);
}
VIEWS.departures = () => {
  const rows=departingRooms();
  const band = d => d<0?["Overdue","hot"] : d===0?["Leaving today",""] : d===1?["Tomorrow",""] : ["In "+d+" days",""];
  return {title:"Departures", sub:rows.length+" rooms with equipment",
  body: rows.length? rows.map(({r,d,sts})=>{
    const [lbl,hot]=band(d), s=sts[0], items=sts.reduce((a,x)=>a+eqCount(x.id),0);
    return `<div class="panel" style="margin-bottom:10px;border-left:4px solid ${d<0?"var(--st-attention)":d===0?"var(--st-preparing)":"var(--line)"}">
      <div class="row between" style="flex-wrap:wrap;gap:8px">
        <b class="num" style="font-size:26px">Room ${esc(r.room_number)}</b>
        <span class="chip ${hot?"solid s-attention":""}">${lbl} · ${fmtDay(r.departure)}</span>
      </div>
      <div class="kv"><span>Guest</span><b>${esc(r.guest_name||"—")}</b></div>
      <div class="kv"><span>Storage</span><b>${sts.map(x=>esc(x.storage_number)).join(", ")}</b></div>
      <div class="kv"><span>Still stored</span><b>${items} item${items===1?"":"s"}</b></div>
      <div class="kv"><span>Key cards</span><b>${cardsOfRoom(r.id).length}</b></div>
      <div class="btn-grid" style="margin-top:12px">
        <button class="btn ghost" data-act="nav" data-view="storage" data-id="${s.id}">Open storage</button>
        <button class="btn go" data-act="final-out" data-id="${s.id}">Check out &amp; release</button>
      </div></div>`;
  }).join("") : `<div class="empty"><span class="ic">📅</span>No departures with equipment in the hall.<br>Add a departure date when you register a card and rooms will show up here.</div>`};
};

/* ==========================================================================
   12b. HALL SETUP — create the physical storage locations
   ========================================================================== */
VIEWS.setup = () => {
  const sections=[...new Set(DB.storages.map(s=>s.section))];
  const admin = SESSION.role==="admin";
  return {title:"Hall setup", sub:DB.storages.length+" locations",
  body:`
    ${admin?"":`<div class="alert hot"><span>🔒</span><span><b>Admins only</b><p>Sign in as an admin to change the hall layout.</p></span></div>`}
    <div class="panel">
      <div class="eyebrow">Create a rack row</div>
      <p class="muted tiny" style="margin:6px 0 14px">Generate a whole range at once — for example S-101 to S-112 in the main hall.</p>
      <label class="f"><span>Area name</span><input class="input" id="hArea" placeholder="Area A · Main hall" ${admin?"":"disabled"}></label>
      <label class="f"><span>Prefix</span><input class="input" id="hPfx" value="S-" autocapitalize="characters" ${admin?"":"disabled"}></label>
      <div class="btn-grid" style="gap:10px">
        <label class="f" style="margin:0"><span>From</span><input class="input" id="hFrom" inputmode="numeric" placeholder="101" ${admin?"":"disabled"}></label>
        <label class="f" style="margin:0"><span>To</span><input class="input" id="hTo" inputmode="numeric" placeholder="112" ${admin?"":"disabled"}></label>
      </div>
      <button class="btn primary" style="margin-top:14px" data-act="make-range" ${admin?"":"disabled"}>Create locations</button>
      <div class="hint">Numbers already in use are skipped. To add a single one, put the same number in both fields.</div>
    </div>

    <h2 class="sec">Areas ${sections.length?`· ${sections.length}`:""}</h2>
    ${sections.length? sections.map(sec=>{
      const rows=DB.storages.filter(s=>s.section===sec), busy=rows.filter(s=>s.status!=="available").length;
      return `<div class="item">
        <span class="body"><b>${esc(sec)}</b><small>${rows.length} locations · ${busy} in use</small></span>
        ${admin?`<button class="btn sm danger" data-act="drop-area" data-sec="${esc(sec)}">Delete</button>`:""}</div>`;
    }).join("") : `<div class="empty"><span class="ic">🏗️</span>No locations yet.<br>Create your first rack row above.</div>`}

    <h2 class="sec">Data</h2>
    <div class="btn-grid">
      <button class="btn ghost" data-act="load-demo" ${admin?"":"disabled"}>Load demo hall</button>
      <button class="btn danger" data-act="wipe-all" ${admin?"":"disabled"}>Erase everything</button>
    </div>
    <div class="hint">Erasing keeps the staff accounts and removes every room, card, storage and item.</div>`,
  after(){ if(SESSION.role==="admin") setTimeout(()=>$("#hArea")?.focus(),80); }};
};
function makeRange(){
  const area=$("#hArea").value.trim()||"Unassigned area";
  const pfx=$("#hPfx").value.trim().toUpperCase();
  const from=parseInt($("#hFrom").value,10), to=parseInt($("#hTo").value,10);
  if(isNaN(from)||isNaN(to)||to<from){ toast("Check the From / To numbers","err"); return; }
  if(to-from>199){ toast("Maximum 200 locations at a time","err"); return; }
  let made=0;
  for(let i=from;i<=to;i++){
    const num=pfx+i; if(storByNumber(num)) continue;
    DB.storages.push({id:uid(),storage_number:num,section:area,status:"available",room_id:null,created_at:now(),updated_at:now()});
    made++;
  }
  if(!made){ toast("Those locations already exist","info"); return; }
  log("Locations created",{notes:`${made} × ${pfx}${from}–${pfx}${to} in ${area}`});
  save(); toast(made+" locations created"); render();
}
function dropArea(sec){
  const rows=DB.storages.filter(s=>s.section===sec), busy=rows.filter(s=>s.status!=="available");
  if(busy.length){ toast(`${busy.length} locations are in use — clear them first`,"err"); return; }
  openSheet(`<h3 style="color:var(--st-attention)">Delete ${esc(sec)}</h3>
    <p class="sub">Removes ${rows.length} empty locations. Nothing else is affected.</p>
    <div class="btn-grid"><button class="btn" data-act="close-sheet">Cancel</button>
      <button class="btn danger" data-act="do-drop-area" data-sec="${esc(sec)}">Delete area</button></div>`);
}

/* ==========================================================================
   13. SEARCH
   ========================================================================== */
VIEWS.search = (p) => ({title:"Quick search", sub:"Card · room · storage · item",
  body:`<div class="searchbar">🔎<input id="qAll" placeholder="305, S-127, A7F83K29X51, skis…" autocomplete="off" value="${esc(p.q||"")}"></div>
    <div id="results" style="margin-top:14px"></div>`,
  after(){ const i=$("#qAll"); i.focus();
    const run=()=>{ $("#results").innerHTML=searchHTML(i.value.trim()); };
    i.addEventListener("input",run); run(); }});
function searchHTML(q){
  if(!q) return `<div class="empty"><span class="ic">🔎</span>Type a room, storage, card code, guest name, item or status.</div>`;
  const L=q.toLowerCase(), N=normCode(q), out=[];
  const cards=DB.cards.filter(c=>c.card_code.includes(N)&&N.length>2);
  const rooms=DB.rooms.filter(r=>r.room_number.toLowerCase().includes(L)||(r.guest_name||"").toLowerCase().includes(L));
  const sts=DB.storages.filter(s=>s.storage_number.toLowerCase().includes(L)||STATUS[s.status].label.toLowerCase().includes(L)
    ||eqOf(s.id).some(e=>CATS[e.category].label.toLowerCase().includes(L)||(e.type||"").toLowerCase().includes(L)));
  if(cards.length) out.push(`<h2 class="sec">Key cards · ${cards.length}</h2><div class="list">${cards.map(c=>`
    <button class="item" data-act="nav" data-view="${c.storage_id?"storage":"room"}" data-id="${c.storage_id||c.room_id}">
      <span class="body"><b class="mono" style="font-size:15px">${esc(c.card_code)}</b>
      <small>Room ${esc(room(c.room_id)?.room_number||"—")} → ${esc(stor(c.storage_id)?.storage_number||"no storage")}</small></span><span class="arr">›</span></button>`).join("")}</div>`);
  if(rooms.length) out.push(`<h2 class="sec">Rooms · ${rooms.length}</h2><div class="list">${rooms.map(roomRow).join("")}</div>`);
  if(sts.length) out.push(`<h2 class="sec">Storages · ${sts.length}</h2><div class="list">${sts.map(storageRow).join("")}</div>`);
  return out.join("")||`<div class="empty"><span class="ic">🤷</span>No match for “${esc(q)}”.<br>Try a room number or the card code.</div>`;
}

/* ==========================================================================
   14. HISTORY + ACCOUNT
   ========================================================================== */
VIEWS.history = (p={}) => {
  let staff = p.staff ? +p.staff : null;
  const count = id => DB.history.filter(h=>h.user_id===id).length;
  return {title:"Activity history", sub:DB.history.length+" records",
  body:`<div class="searchbar" style="margin-bottom:10px">🔎<input id="qH" placeholder="Room, storage, card code or action" autocomplete="off"></div>
    <div class="rolebar" id="sBar">
      <button data-u="" class="${staff?"":"on"}">Everyone</button>
      ${DB.users.map(u=>`<button data-u="${u.id}" class="${staff===u.id?"on":""}">${esc(u.name.split(" ")[0])} · ${count(u.id)}</button>`).join("")}
    </div>
    <div class="hist" id="hList" style="margin-top:14px"></div>`,
  after(){
    const i=$("#qH");
    const draw=()=>{ const q=i.value.trim().toLowerCase();
      const rows=DB.history.filter(h=>{
        if(staff && h.user_id!==staff) return false;
        if(!q) return true;
        const s=[h.action,user(h.user_id)?.name,room(h.room_id)?.room_number,stor(h.storage_id)?.storage_number,card(h.key_card_id)?.card_code,h.notes,h.prev,h.next].join(" ").toLowerCase();
        return s.includes(q); }).slice(0,150);
      $("#hList").innerHTML=rows.map(histEvent).join("")||`<div class="empty"><span class="ic">🕒</span>No records match this filter.</div>`;
    };
    i.addEventListener("input",draw);
    $$("#sBar button").forEach(b=>b.addEventListener("click",()=>{
      $$("#sBar button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
      staff = b.dataset.u ? +b.dataset.u : null; draw(); }));
    draw();
  }};
};

VIEWS.users = () => {
  if(SESSION.role!=="admin") return {title:"Staff", body:`<div class="empty">Admins only.</div>`};
  const acts = id => DB.history.filter(h=>h.user_id===id).length;
  return {title:"Staff accounts", sub:DB.users.length+" users",
  body:`<div class="list">${DB.users.map(u=>`<button class="item" data-act="staff-log" data-id="${u.id}">
      <span class="body"><b>${esc(u.name)}</b><small>${esc(u.email)} · PIN ${esc(u.pin)} · ${acts(u.id)} actions</small></span>
      <span class="chip ${u.role==="admin"?"solid s-occupied":""}">${u.role==="admin"?"Admin":"Valet staff"}</span><span class="arr">›</span></button>`).join("")}</div>
    <div class="hint">Tap a name to see everything that person did.</div>
    <h2 class="sec">Add a staff member</h2>
    <div class="panel">
      <label class="f"><span>Name</span><input class="input" id="uName" placeholder="Anna Rossi"></label>
      <label class="f"><span>Email</span><input class="input" id="uMail" placeholder="anna@hotel.com" inputmode="email"></label>
      <label class="f"><span>4-digit PIN</span><input class="input" id="uPin" inputmode="numeric" maxlength="4" placeholder="4821"></label>
      <label class="f"><span>Role</span><select class="input" id="uRole"><option value="staff">Ski Valet staff</option><option value="admin">Admin</option></select></label>
      <button class="btn primary" data-act="add-user">Add staff member</button>
    </div>`};
};
function addUser(){
  const name=$("#uName").value.trim(), mail=$("#uMail").value.trim(), pin=$("#uPin").value.trim(), role=$("#uRole").value;
  if(!name||!/^\d{4}$/.test(pin)){ toast("Name and a 4-digit PIN are required","err"); return; }
  DB.users.push({id:uid(),name,email:mail,role,pin,created_at:now()});
  log("Staff member added",{notes:name+" · "+role}); save(); toast("Staff member added"); render();
}
function openAccount(){
  openSheet(`<h3>${esc(SESSION.name)}</h3><p class="sub">${SESSION.role==="admin"?"Admin":"Ski Valet staff"} · ${esc(SESSION.email)}</p>
    <div class="list">
      ${SESSION.role==="admin"?`<button class="item" data-act="nav-sheet" data-view="users"><span class="body"><b>Staff accounts</b><small>Add or review users</small></span><span class="arr">›</span></button>`:""}
      <button class="item" data-act="nav-sheet" data-view="history"><span class="body"><b>Activity history</b><small>Full audit trail</small></span><span class="arr">›</span></button>
      ${SESSION.role==="admin"?`<a class="item" href="admin.html" style="text-decoration:none;color:inherit"><span class="body"><b>Admin console</b><small>Fix records, trace equipment, backups</small></span><span class="arr">›</span></a>`:""}
      ${SESSION.role==="admin"?`<button class="item" data-act="nav-sheet" data-view="setup"><span class="body"><b>Hall setup</b><small>Locations, demo data, reset</small></span><span class="arr">›</span></button>`:""}
      <button class="item" data-act="signout"><span class="body"><b style="color:var(--st-attention)">Sign out</b><small>Lock the app</small></span></button>
    </div>`);
}

/* ==========================================================================
   15. SHEETS
   ========================================================================== */
function openSheet(html){ const m=$("#modal"); m.innerHTML=`<div class="sheet">${html}</div>`; m.classList.remove("hidden");
  m.onclick=e=>{ if(e.target===m) closeSheet(); }; }
function closeSheet(){ const m=$("#modal"); m.classList.add("hidden"); m.innerHTML=""; }

/* ==========================================================================
   16. EVENT DELEGATION
   ========================================================================== */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id?+el.dataset.id:null;
  switch(a){
    /* login */
    case "pick-user": loginUser=user(+el.dataset.id); pin=""; $("#shell").innerHTML=viewLogin(); break;
    case "pin": if(pin.length<4){ pin+=el.dataset.n; $("#shell").innerHTML=viewLogin(); if(pin.length===4) setTimeout(tryLogin,120);} break;
    case "pin-del": pin=pin.slice(0,-1); $("#shell").innerHTML=viewLogin(); break;
    case "pin-clear": pin=""; $("#shell").innerHTML=viewLogin(); break;
    /* nav */
    case "back": back(); break;
    case "home": home(); break;
    case "nav": go(el.dataset.view, id?{id}:{}); break;
    case "nav-sheet": closeSheet(); go(el.dataset.view,{}); break;
    case "account": openAccount(); break;
    case "signout": closeSheet(); SESSION=null; loginUser=null; pin=""; nav=[]; render(); break;
    case "make-range": makeRange(); break;
    case "drop-area": dropArea(el.dataset.sec); break;
    case "do-drop-area": { const sec=el.dataset.sec;
      DB.storages=DB.storages.filter(s=>!(s.section===sec&&s.status==="available"));
      log("Area deleted",{notes:sec}); save(); closeSheet(); toast("Area deleted"); render(); break; }
    case "load-demo": openSheet(`<h3>Load the demo hall</h3>
      <p class="sub">Replaces everything currently stored with the sample rooms, cards and equipment.</p>
      <div class="btn-grid"><button class="btn" data-act="close-sheet">Cancel</button>
        <button class="btn primary" data-act="do-load-demo">Load demo</button></div>`); break;
    case "do-load-demo": DB=seedDemo(); save(); closeSheet(); toast("Demo hall loaded","info"); home(); break;
    case "wipe-all": openSheet(`<h3 style="color:var(--st-attention)">Erase everything</h3>
      <p class="sub">Every room, key card, storage location and item is removed. Staff accounts stay.</p>
      <div class="btn-grid"><button class="btn" data-act="close-sheet">Cancel</button>
        <button class="btn danger" data-act="do-wipe">Erase everything</button></div>`); break;
    case "do-wipe": { const u=DB.users; DB=emptyDB(); DB.users=u; save(); closeSheet(); toast("Hall is empty now","info"); home(); break; }
    /* scan */
    case "scan": go("scan",{ctx:el.dataset.ctx||"identify",room_id:el.dataset.room?+el.dataset.room:null,storage_id:el.dataset.storage?+el.dataset.storage:null}); break;
    case "nfc-start": startNFC(); break;
    case "native-scan": askNativeScan(); break;
    case "submit-code": submitCode(); break;
    case "demo-scan": demoScan(); break;
    case "paste-code": pasteCode(); break;
    case "done-adding": closeSheet(); replaceView("room",{id:+el.dataset.id}); break;
    case "do-reassign": doReassign(+el.dataset.card,+el.dataset.room, el.dataset.storage?+el.dataset.storage:null); break;
    /* register */
    case "pick-storage": $("#fStorage").value=el.dataset.n; break;
    case "reuse-room": $("#fRoom").value=el.dataset.n; if(el.dataset.g) $("#fGuest").value=el.dataset.g;
      $("#fStorage").focus(); toast("Room "+el.dataset.n+" filled in","info"); break;
    case "save-card": saveNewCard(el.dataset.code, el.dataset.next); break;
    /* equipment */
    case "add-eq": openEqSheet(id); break;
    case "quick-eq": openCheckinSheet(id); break;
    case "eq-save": saveEq(el.dataset.storage, el.dataset.id?+el.dataset.id:null); break;
    case "eq-delete": { const eq=DB.equipment.find(x=>x.id===id); DB.equipment=DB.equipment.filter(x=>x.id!==id);
      log("Equipment removed",{storage_id:eq.storage_id,notes:CATS[eq.category].label}); save(); closeSheet(); toast("Equipment removed"); render(); break; }
    case "eq-plus": { const eq=DB.equipment.find(x=>x.id===id); eq.quantity++; eq.updated_at=now(); save(); render(); break; }
    case "eq-minus": { const eq=DB.equipment.find(x=>x.id===id);
      if(eq.quantity>1){ eq.quantity--; eq.updated_at=now(); } else { DB.equipment=DB.equipment.filter(x=>x.id!==id);
        log("Equipment removed",{storage_id:eq.storage_id,notes:CATS[eq.category].label}); }
      save(); render(); break; }
    case "q-toggle": qToggle(el.dataset.k,+el.dataset.d); break;
    /* workflows */
    case "checkin-here": openCheckinSheet(id); break;
    case "do-checkin": doCheckin(id); break;
    case "checkout-eq": confirmCheckout(id); break;
    case "final-out": confirmFinalOut(id); break;
    case "do-final-out": doFinalOut(id, el.dataset.next); break;
    case "do-checkout": doCheckout(id); break;
    case "return-eq": confirmReturn(id); break;
    case "do-return": doReturn(id, el.dataset.next); break;
    case "set-ready": { const s=stor(id); setStorageStatus(s,"ready","Prepared for guest");
      log("Marked ready for guest",{storage_id:s.id,room_id:s.room_id}); save(); toast("Ready for guest"); render(); break; }
    case "set-status": openStatusSheet(id); break;
    case "pick-status": { const s=stor(id); setStorageStatus(s,el.dataset.s,"Manual change"); save(); closeSheet(); toast("Status updated"); render(); break; }
    case "assign-room": openAssignRoom(id); break;
    case "do-assign-room": doAssignRoom(id); break;
    case "assign-free": { const free=DB.storages.find(s=>s.status==="available"); if(!free){ toast("No free storage","err"); break; }
      openAssignRoomFromRoom(+el.dataset.room); break; }
    case "move-storage": openMoveSheet(id); break;
    case "do-move": doMove(id); break;
    case "release-storage": releaseStorage(id); break;
    case "do-release": doRelease(id); break;
    case "unlink-card": { const c=card(id);
      openSheet(`<h3>Remove key card</h3><p class="sub">Card <b class="mono">${esc(c.card_code)}</b> will stop opening this storage.</p>
        <div class="btn-grid"><button class="btn" data-act="close-sheet">Cancel</button>
        <button class="btn danger" data-act="do-unlink" data-id="${c.id}">Remove card</button></div>`); break; }
    case "do-unlink": { const c=card(id); log("Key card removed",{key_card_id:c.id,room_id:c.room_id,storage_id:c.storage_id});
      DB.cards=DB.cards.filter(x=>x.id!==id); save(); closeSheet(); toast("Key card removed"); render(); break; }
    case "staff-log": go("history",{staff:id}); break;
    case "add-user": addUser(); break;
    case "close-sheet": closeSheet(); break;
  }
});
function openAssignRoomFromRoom(roomId){
  const r=room(roomId), free=DB.storages.filter(s=>s.status==="available");
  openSheet(`<h3>Assign a storage</h3><p class="sub">Room ${esc(r.room_number)}</p>
    <div class="pill-list">${free.slice(0,30).map(s=>`<button class="pill" data-act="do-assign-free" data-room="${r.id}" data-s="${s.id}">${esc(s.storage_number)}</button>`).join("")}</div>`);
}
document.addEventListener("click",e=>{
  const el=e.target.closest('[data-act="do-assign-free"]'); if(!el) return;
  const s=stor(+el.dataset.s), r=room(+el.dataset.room);
  s.room_id=r.id; setStorageStatus(s,"preparing","Assigned to room "+r.room_number);
  cardsOfRoom(r.id).forEach(c=>{ if(!c.storage_id) c.storage_id=s.id; });
  log("Storage assigned",{storage_id:s.id,room_id:r.id,next:s.storage_number});
  save(); closeSheet(); toast(s.storage_number+" assigned"); replaceView("storage",{id:s.id});
});

/* ==========================================================================
   17. BOOT
   ========================================================================== */
/* The admin console (admin.html) edits the same record — pick up its saves. */
window.addEventListener("storage", e=>{
  if(e.key!==KEY || !e.newValue) return;
  try{ DB = JSON.parse(e.newValue); }catch(_){ return; }
  ["rooms","storages","cards","equipment","history"].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k]=[]; });
  bumpUid();
  if(SESSION){ SESSION = user(SESSION.id) || null; if(!SESSION){ nav=[]; closeSheet(); } }
  if($("#modal").classList.contains("hidden")) render();
});
(async function boot(){
  DB = await Persist.load();
  if(!DB || !DB.users || !DB.users.length){ DB = emptyDB(); Persist.save(DB); }
  ["rooms","storages","cards","equipment","history"].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k]=[]; });
  DB.users.forEach(u=>{ if(!u.pin) u.pin="1111"; });
  bumpUid();
  nav=[{view:"dash",params:{}}];
  const handed = consumeUrlCard();
  render();
  if(handed && SESSION){ scanCtx={ctx:"identify"}; go("scan",{ctx:"identify"}); handleCard(handed); }
  else if(handed){ pendingHandOff = handed; }
})();
</script>
