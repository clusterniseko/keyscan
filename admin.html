<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1621">
<meta name="robots" content="noindex">
<title>Ski Valet · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SKI VALET ADMIN — same tokens as the valet app (index.html)
   ============================================================ */
:root{
  --night:#0E1621; --slab:#16222F; --slab2:#1D2C3B; --line:#27394B;
  --frost:#E7EEF5; --mist:#90A4B8; --dim:#63798F;
  --signal:#FF6A2B; --signal-d:#E2551A; --glacier:#5EC8F2;
  --st-available:#64748B; --st-preparing:#F0A93B; --st-occupied:#5EC8F2;
  --st-ready:#35C36A; --st-guest:#A98BF5; --st-attention:#FF4D4D; --st-closed:#3C4A5A;
  --r:14px; --r-s:10px;
  --display:"Barlow Condensed", "Oswald", Impact, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--night);color:var(--frost);font-family:var(--body);font-size:15px;line-height:1.45}
body{min-height:100dvh}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--glacier)}
.hidden{display:none !important}
:focus-visible{outline:3px solid var(--glacier);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:rgba(14,22,33,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand b{display:block;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.6px;text-transform:uppercase;line-height:1}
.brand span{display:block;font-size:11px;color:var(--signal);letter-spacing:1.6px;text-transform:uppercase}
.topbar .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mist)}
.layout{display:flex;max-width:1400px;margin:0 auto}
nav.side{width:210px;flex:none;padding:14px 10px;position:sticky;top:65px;align-self:flex-start;height:calc(100dvh - 65px);overflow:auto}
nav.side button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  font-family:var(--display);font-size:17px;letter-spacing:.8px;text-transform:uppercase;color:var(--mist);text-align:left}
nav.side button:hover{background:var(--slab)}
nav.side button.on{background:var(--slab2);color:var(--frost);box-shadow:inset 3px 0 0 var(--signal)}
nav.side .cnt{margin-left:auto;font-size:13px;color:var(--dim)}
nav.side .cnt.bad{color:var(--st-attention)}
main{flex:1;min-width:0;padding:18px 16px 60px}
@media (max-width:820px){
  .layout{flex-direction:column}
  nav.side{width:auto;height:auto;position:static;align-self:stretch;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
  nav.side button{width:auto;flex:none;padding:8px 12px;font-size:15px}
  nav.side button.on{box-shadow:inset 0 -3px 0 var(--signal)}
  .who,.hide-sm{display:none}
  .brand b{font-size:19px}
}

/* ---------- type / blocks ---------- */
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.8px;text-transform:uppercase;margin:0 0 4px}
.lead{color:var(--mist);margin:0 0 16px;font-size:14px}
h2.sec{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:1.6px;font-size:14px;color:var(--mist);
  margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.panel{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--mist)} .dim{color:var(--dim)} .tiny{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--slab);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:var(--r);padding:12px 14px;text-align:left}
.stat b{display:block;font-family:var(--display);font-size:32px;line-height:1}
.stat span{font-size:12px;color:var(--mist);text-transform:uppercase;letter-spacing:.8px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--r-s);
  background:var(--slab2);border:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:1px;
  text-transform:uppercase;color:var(--frost);white-space:nowrap}
.btn:hover{background:#243549}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#160B04}
.btn.go{background:var(--st-ready);border-color:var(--st-ready);color:#06210F}
.btn.danger{background:transparent;border-color:#5A2530;color:#FF8080}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:0 10px;font-size:14px}
.btn:disabled{opacity:.4;pointer-events:none}
.input{width:100%;min-height:40px;background:var(--night);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 12px;outline:none}
.input:focus{border-color:var(--glacier)}
textarea.input{min-height:120px;resize:vertical}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;min-height:60dvh;white-space:pre}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;color:var(--mist);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.searchbar{display:flex;gap:8px;align-items:center;background:var(--slab);border:1px solid var(--line);border-radius:var(--r-s);padding:0 12px}
.searchbar input{flex:1;background:none;border:0;outline:none;min-height:42px;font-size:16px;font-weight:600;min-width:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .searchbar{flex:1;min-width:220px}
.toolbar select{width:auto}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--display);font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:13px;color:var(--mist);
  background:var(--slab);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(255,255,255,.02)}
td.act{white-space:nowrap;text-align:right}
td.act .btn+.btn{margin-left:4px}
.warn{color:var(--st-attention)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-family:var(--display);font-weight:600;
  text-transform:uppercase;letter-spacing:1px;font-size:12px;background:var(--slab2);border:1px solid var(--line);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.s-available{color:var(--st-available)} .s-preparing{color:var(--st-preparing)} .s-occupied{color:var(--st-occupied)}
.s-ready{color:var(--st-ready)} .s-guest_using{color:var(--st-guest)} .s-attention{color:var(--st-attention)} .s-closed{color:#7A8898}
.s-active{color:var(--st-ready)} .s-released{color:var(--st-available)} .s-staying{color:var(--st-occupied)} .s-checked_out{color:var(--st-available)}
.s-bad{color:var(--st-attention)}
.lnk{color:var(--glacier);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--mist)}

/* ---------- issues / trace ---------- */
.issue{display:flex;gap:12px;align-items:flex-start;background:var(--slab);border:1px solid var(--line);border-left:4px solid var(--st-preparing);
  border-radius:var(--r-s);padding:10px 12px}
.issue.hot{border-left-color:var(--st-attention)}
.issue+.issue{margin-top:8px}
.issue b{font-family:var(--display);font-size:16px;letter-spacing:.8px;text-transform:uppercase;display:block}
.issue p{margin:2px 0 0;font-size:13px;color:var(--mist)}
.issue .grow{min-width:0}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.node{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:120px}
.node small{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.node b{font-family:var(--display);font-size:19px;letter-spacing:.6px}
.node.missing{border-style:dashed;border-color:var(--st-attention)}
.node.missing b{color:var(--st-attention)}
.arrow{color:var(--dim);font-size:20px}
.hist{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.hev{position:relative;padding:0 0 12px}
.hev::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--slab2);border:2px solid var(--glacier)}
.hev .t{font-family:var(--display);letter-spacing:1px;font-size:12px;color:var(--dim);text-transform:uppercase}
.hev b{font-family:var(--display);font-size:16px;letter-spacing:.5px}
.hev p{margin:1px 0 0;font-size:13px;color:var(--mist)}
.hev.adm::before{border-color:var(--signal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:980px){ .grid2{grid-template-columns:1fr} }

/* ---------- login ---------- */
.login{max-width:380px;margin:10dvh auto 0;padding:20px}
.login .a{font-family:var(--display);color:var(--signal);letter-spacing:2px;text-transform:uppercase;font-size:13px}
.login .b{font-family:var(--display);font-weight:700;font-size:44px;text-transform:uppercase;line-height:1}
.login .c{color:var(--mist);margin-bottom:24px}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(5,9,14,.72);padding:16px}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--slab);border:1px solid var(--line);border-radius:18px;padding:20px}
.sheet h3{font-family:var(--display);font-size:24px;letter-spacing:1px;text-transform:uppercase;margin:0 0 4px}
.sheet .sub{color:var(--mist);font-size:14px;margin:0 0 16px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--st-ready);color:#06210F;border-radius:12px;padding:11px 16px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast.err{background:var(--st-attention);color:#fff}
.toast.info{background:var(--glacier);color:#052637}
.banner{background:#2A1A10;border:1px solid #5A3520;color:#FFC7A8;border-radius:var(--r-s);padding:10px 12px;font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   1. STORAGE — reads and writes the exact same record the valet app uses.
      Every admin write takes a snapshot first so it can be undone.
   ========================================================================== */
const KEY = "skivalet_db_v1";
const SNAP_KEY = "skivalet_admin_snapshots_v1";
const SESSION_KEY = "skivalet_admin_session";
const MAX_SNAPS = 15;

const Store = {
  async load(){
    try{ if(window.storage){ const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
    return null;
  },
  write(db){
    const s=JSON.stringify(db);
    try{ if(window.storage) window.storage.set(KEY,s).catch(()=>{}); }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){ toast("Could not save: "+e.message,"err"); }
  }
};
const Snaps = {
  all(){ try{ return JSON.parse(localStorage.getItem(SNAP_KEY)||"[]"); }catch(e){ return []; } },
  push(label,db){
    const list=Snaps.all(); list.unshift({ts:Date.now(),label,by:SESSION?SESSION.name:"—",data:JSON.stringify(db)});
    list.length=Math.min(list.length,MAX_SNAPS);
    try{ localStorage.setItem(SNAP_KEY,JSON.stringify(list)); }
    catch(e){ list.length=Math.max(1,Math.floor(list.length/2)); try{ localStorage.setItem(SNAP_KEY,JSON.stringify(list)); }catch(_){} }
  },
  drop(ts){ try{ localStorage.setItem(SNAP_KEY,JSON.stringify(Snaps.all().filter(s=>s.ts!==ts))); }catch(e){} }
};

/* Apply a change: snapshot → mutate → audit log → save → redraw. */
function commit(label, fn, logEntry){
  Snaps.push(label, DB);
  const res = fn();
  if(res===false){ DB=JSON.parse(Snaps.all()[0].data); Snaps.drop(Snaps.all()[0].ts); return false; }
  const entry = typeof logEntry==="function" ? logEntry() : logEntry;
  if(entry!==null) log(entry?.action||label, entry||{});
  Store.write(DB); render();
  return true;
}

/* ==========================================================================
   2. DOMAIN (mirrors index.html)
   ========================================================================== */
const STATUS = {
  available:"Available", preparing:"Preparing", occupied:"Stored", ready:"Ready",
  guest_using:"Guest using", attention:"Needs attention", closed:"Closed"
};
const CARD_STATUS = {active:"Active", released:"Released"};
const ROOM_STATUS = {staying:"Staying", checked_out:"Checked out"};
const CATS = {
  skis:"Skis", boots:"Ski boots", poles:"Poles", snowboard:"Snowboard",
  sbboots:"Snowboard boots", helmet:"Helmet", goggles:"Goggles", other:"Other"
};
const EQ_STATUS = {stored:"Stored"};
const COLLECTIONS = ["rooms","storages","cards","equipment","users","history"];

let DB=null, SESSION=null, view="overview", params={}, loginUser=null;
const now=()=>Date.now();
function nextId(){
  let m=Date.now()%1e7;
  COLLECTIONS.forEach(k=>(DB[k]||[]).forEach(x=>{ if(typeof x.id==="number" && x.id>m) m=x.id; }));
  return m+1;
}
const room = id => id==null?null:DB.rooms.find(r=>r.id===id);
const stor = id => id==null?null:DB.storages.find(s=>s.id===id);
const card = id => id==null?null:DB.cards.find(c=>c.id===id);
const user = id => id==null?null:DB.users.find(u=>u.id===id);
const eqItem = id => DB.equipment.find(e=>e.id===id);
const eqOf = id => DB.equipment.filter(e=>e.storage_id===id);
const eqCount = id => eqOf(id).reduce((a,e)=>a+(+e.quantity||0),0);
const cardsOfStorage = id => DB.cards.filter(c=>c.storage_id===id);
const cardsOfRoom = id => DB.cards.filter(c=>c.room_id===id);
const storagesOfRoom = id => DB.storages.filter(s=>s.room_id===id);
function normCode(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }

function log(action,o={}){
  DB.history.unshift({id:nextId(),user_id:SESSION?SESSION.id:null,action:"[Admin] "+action,
    room_id:o.room_id??null,storage_id:o.storage_id??null,key_card_id:o.key_card_id??null,
    equipment_id:o.equipment_id??null,timestamp:now(),notes:o.notes||"",prev:o.prev||null,next:o.next||null});
  if(DB.history.length>600) DB.history.length=600;
}
function normalise(db){
  if(!db || typeof db!=="object") db={};
  COLLECTIONS.forEach(k=>{ if(!Array.isArray(db[k])) db[k]=[]; });
  return db;
}

/* ==========================================================================
   3. UTIL
   ========================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDT(ts){ if(!ts) return "—"; const d=new Date(ts);
  return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function ago(ts){ if(!ts) return "—"; const m=Math.round((now()-ts)/6e4); if(m<1) return "just now"; if(m<60) return m+" min ago";
  const h=Math.floor(m/60); if(h<24) return h+"h ago"; return Math.floor(h/24)+"d ago"; }
function toast(msg,kind){ const t=document.createElement("div"); t.className="toast"+(kind?" "+kind:""); t.textContent=msg;
  $("#toast").appendChild(t); setTimeout(()=>t.remove(),2800); }
function chip(key,label){ return `<span class="chip s-${esc(key)}"><i class="dot"></i>${esc(label||key)}</span>`; }
function download(name,text,type){ const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:type||"application/json"})); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
const roomLabel = id => { if(id==null) return `<span class="dim">—</span>`; const r=room(id);
  return r?`<span class="lnk" data-act="trace" data-q="${esc(r.room_number)}">Room ${esc(r.room_number)}</span>`:`<span class="warn">missing #${esc(id)}</span>`; };
const storLabel = id => { if(id==null) return `<span class="dim">—</span>`; const s=stor(id);
  return s?`<span class="lnk" data-act="trace" data-q="${esc(s.storage_number)}">${esc(s.storage_number)}</span>`:`<span class="warn">missing #${esc(id)}</span>`; };

/* ==========================================================================
   4. INTEGRITY CHECK — finds the broken links that make a search fail.
      Each issue may carry a fix(); "Fix all" runs every safe fix.
   ========================================================================== */
function checkIntegrity(){
  const out=[];
  const add=(hot,t,p,fix,go)=>out.push({hot,t,p,fix,go});

  // duplicate ids inside a collection
  COLLECTIONS.forEach(k=>{ const seen=new Map();
    DB[k].forEach(x=>{ if(seen.has(x.id)) add(true,`Duplicate id in ${k}`,`Two ${k} records share id ${x.id}. Links to this id are ambiguous.`,
      ()=>{ x.id=nextId(); }); else seen.set(x.id,x); }); });

  // duplicate card codes / storage numbers / room numbers
  const dup=(arr,keyFn)=>{ const m={}; arr.forEach(x=>{ const k=keyFn(x); if(!k) return; (m[k]=m[k]||[]).push(x); });
    return Object.entries(m).filter(([,v])=>v.length>1); };
  dup(DB.cards,c=>normCode(c.card_code)).forEach(([code,list])=>add(true,"Duplicate card code",
    `Card ${code} exists ${list.length} times — the scanner only ever finds the first one.`,null,{view:"cards",q:code}));
  dup(DB.storages,s=>String(s.storage_number||"").toLowerCase()).forEach(([n,list])=>add(true,"Duplicate storage number",
    `${list[0].storage_number} exists ${list.length} times.`,null,{view:"storages",q:list[0].storage_number}));
  dup(DB.rooms,r=>String(r.room_number||"").toLowerCase()).forEach(([n,list])=>add(false,"Duplicate room number",
    `Room ${list[0].room_number} exists ${list.length} times.`,null,{view:"rooms",q:list[0].room_number}));

  DB.cards.forEach(c=>{
    if(!c.card_code) add(true,"Card without code",`Card record #${c.id} has an empty code and can never be scanned.`,()=>{ DB.cards=DB.cards.filter(x=>x!==c); });
    else if(normCode(c.card_code)!==c.card_code) add(false,"Card code not normalised",`"${c.card_code}" is stored with lowercase or symbols; scans look for ${normCode(c.card_code)}.`,()=>{ c.card_code=normCode(c.card_code); });
    if(c.room_id!=null && !room(c.room_id)) add(true,"Card points to a deleted room",`Card ${c.card_code} → room #${c.room_id}, which does not exist.`,()=>{ c.room_id=null; });
    if(c.storage_id!=null && !stor(c.storage_id)) add(true,"Card points to a deleted storage",`Card ${c.card_code} → storage #${c.storage_id}, which does not exist.`,()=>{ c.storage_id=null; });
    const s=stor(c.storage_id);
    if(s && room(c.room_id) && s.room_id!==c.room_id) add(false,"Card room ≠ storage room",
      `Card ${c.card_code} says room ${room(c.room_id).room_number} but ${s.storage_number} belongs to ${s.room_id?"room "+(room(s.room_id)?.room_number||"#"+s.room_id):"no room"}.`,
      s.room_id&&room(s.room_id)?()=>{ c.room_id=s.room_id; }:()=>{ s.room_id=c.room_id; });
    if(c.status==="active" && c.room_id==null && c.storage_id==null) add(false,"Active card linked to nothing",
      `Card ${c.card_code} is active but has no room and no storage.`,()=>{ c.status="released"; c.released_at=now(); });
    if(c.status==="released" && (c.storage_id!=null)) add(false,"Released card still opens a storage",
      `Card ${c.card_code} is released but still linked to ${stor(c.storage_id)?.storage_number||"#"+c.storage_id}.`,()=>{ c.status="active"; });
    if(c.status && !CARD_STATUS[c.status]) add(false,"Unknown card status",`Card ${c.card_code} has status "${c.status}".`,()=>{ c.status=c.storage_id||c.room_id?"active":"released"; });
  });

  DB.equipment.forEach(e=>{
    if(!stor(e.storage_id)) add(true,"Equipment in a deleted storage",
      `${CATS[e.category]||e.category} ×${e.quantity} (#${e.id}) points to storage #${e.storage_id}, which does not exist.`,null,{view:"equipment",q:String(e.id)});
    if(!CATS[e.category]) add(false,"Unknown equipment category",`Item #${e.id} has category "${e.category}".`,()=>{ e.category="other"; });
    if(!(+e.quantity>=1)) add(false,"Invalid quantity",`Item #${e.id} has quantity "${e.quantity}".`,()=>{ e.quantity=1; });
  });

  DB.storages.forEach(s=>{
    if(!STATUS[s.status]) add(true,"Unknown storage status",`${s.storage_number} has status "${s.status}" — the app will crash on it.`,()=>{ s.status="attention"; });
    if(s.room_id!=null && !room(s.room_id)) add(true,"Storage points to a deleted room",`${s.storage_number} → room #${s.room_id}, which does not exist.`,()=>{ s.room_id=null; });
    const items=eqCount(s.id);
    if(s.status==="available" && items>0) add(false,"Available storage holds equipment",`${s.storage_number} is marked Available but holds ${items} items.`,()=>{ s.status="occupied"; });
    if(s.status==="available" && s.room_id!=null && room(s.room_id)) add(false,"Available storage has a room",`${s.storage_number} is Available but still linked to room ${room(s.room_id).room_number}.`,()=>{ s.status="preparing"; });
    if(["occupied","ready","guest_using"].includes(s.status) && s.room_id==null && !items && !cardsOfStorage(s.id).length)
      add(false,"Empty storage marked in use",`${s.storage_number} is "${STATUS[s.status]}" with no room, cards or equipment.`,()=>{ s.status="available"; });
    if(!s.room_id && items) add(false,"Equipment without a room",`${s.storage_number} holds ${items} items but no room is assigned — guests can't find it by room.`,null,{view:"trace",q:s.storage_number});
    if(!s.section) add(false,"Storage without area",`${s.storage_number} has no area; it won't appear on the map.`,()=>{ s.section="Unassigned area"; });
  });

  DB.rooms.forEach(r=>{
    if(r.status==="checked_out" && storagesOfRoom(r.id).length) add(false,"Checked-out room still owns storage",
      `Room ${r.room_number} is checked out but still has ${storagesOfRoom(r.id).map(s=>s.storage_number).join(", ")}.`,()=>{ r.status="staying"; });
    if(!r.room_number) add(false,"Room without number",`Room record #${r.id} has no number.`,null,{view:"rooms",q:String(r.id)});
  });

  if(!DB.users.some(u=>u.role==="admin")) add(true,"No admin account","Nobody can open this panel or manage staff.",null,{view:"users"});
  DB.users.forEach(u=>{ if(!/^\d{4}$/.test(String(u.pin||""))) add(true,"Invalid PIN",`${u.name} cannot sign in (PIN "${u.pin||""}").`,null,{view:"users"}); });
  return out;
}

/* ---------- trace ---------- */
function histEvent(h){
  const bits=[];
  if(h.room_id!=null) bits.push("Room "+(room(h.room_id)?.room_number||"#"+h.room_id+" (deleted)"));
  if(h.storage_id!=null) bits.push(stor(h.storage_id)?.storage_number||"storage #"+h.storage_id+" (deleted)");
  if(h.key_card_id!=null) bits.push("Card "+(card(h.key_card_id)?.card_code||"#"+h.key_card_id+" (deleted)"));
  if(h.prev&&h.next) bits.push(h.prev+" → "+h.next); else if(h.next) bits.push("→ "+h.next);
  if(h.notes) bits.push(h.notes);
  return `<div class="hev ${String(h.action).startsWith("[Admin]")?"adm":""}"><div class="t">${fmtDT(h.timestamp)} · ${esc(user(h.user_id)?.name||"System")}</div>
    <b>${esc(h.action)}</b><p>${esc(bits.join(" · "))}</p></div>`;
}
function traceStorage(s, why){
  const r=room(s.room_id), cards=cardsOfStorage(s.id), eq=eqOf(s.id);
  const roomCards = r ? cardsOfRoom(r.id).filter(c=>c.storage_id!==s.id) : [];
  const ids={s:s.id,r:s.room_id,c:new Set([...cards,...roomCards].map(c=>c.id))};
  const hist=DB.history.filter(h=>h.storage_id===ids.s||(ids.r!=null&&h.room_id===ids.r)||ids.c.has(h.key_card_id)).slice(0,12);
  return `<div class="panel" style="margin-bottom:12px">
    <div class="row"><span class="eyebrow dim tiny grow">${esc(why)}</span>
      <button class="btn sm" data-act="edit" data-col="storages" data-id="${s.id}">Edit storage</button>
      ${r?`<button class="btn sm" data-act="edit" data-col="rooms" data-id="${r.id}">Edit room</button>`:""}</div>
    <div class="chain">
      ${cards.length?cards.map(c=>`<div class="node"><small>Key card · ${esc(c.status)}</small><b class="mono">${esc(c.card_code)}</b></div>`).join("")
        :`<div class="node missing"><small>Key card</small><b>none</b></div>`}
      <span class="arrow">→</span>
      <div class="node ${s.room_id!=null&&!r?"missing":""}"><small>Room</small><b>${r?esc(r.room_number)+(r.guest_name?" · "+esc(r.guest_name):""):s.room_id!=null?"deleted #"+s.room_id:"—"}</b></div>
      <span class="arrow">→</span>
      <div class="node"><small>Storage · ${esc(s.section||"")}</small><b>${esc(s.storage_number)}</b> ${chip(s.status,STATUS[s.status]||s.status)}</div>
      <span class="arrow">→</span>
      <div class="node"><small>Equipment</small><b>${eq.length?eq.map(e=>`${esc(CATS[e.category]||e.category)} ×${esc(e.quantity)}`).join(", "):"empty"}</b></div>
    </div>
    ${roomCards.length?`<div class="issue"><div class="grow"><b>Room cards not linked to this storage</b>
      <p>${roomCards.map(c=>`${esc(c.card_code)} → ${c.storage_id?esc(stor(c.storage_id)?.storage_number||"deleted #"+c.storage_id):"no storage"}`).join(" · ")}</p></div>
      <button class="btn sm" data-act="link-room-cards" data-id="${s.id}">Link them here</button></div>`:""}
    <div class="hist" style="margin-top:12px">${hist.map(histEvent).join("")||`<div class="dim tiny">No history for this chain.</div>`}</div>
  </div>`;
}
V.trace = (p) => {
  const q=(p.q||"").trim();
  return {body:`
    <h1>Trace equipment</h1>
    <p class="lead">Search by card code, room, guest, storage or item. Shows the full chain card → room → storage → equipment, what is broken in it, and the history — including records that were already deleted or released.</p>
    <div class="searchbar">🔎<input id="tQ" value="${esc(q)}" placeholder="A7F83K29X51 · 305 · Weber · S-127 · skis 170" autocomplete="off"></div>
    <div id="tOut" style="margin-top:16px"></div>`,
  after(){
    const i=$("#tQ"); i.focus(); i.setSelectionRange(i.value.length,i.value.length);
    const draw=()=>{ params.q=i.value; $("#tOut").innerHTML=traceHTML(i.value.trim()); };
    let t; i.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(draw,150); }); draw();
  }};
};
function traceHTML(q){
  if(!q) return `<div class="dim" style="text-align:center;padding:30px">Type something to search.</div>`;
  const L=q.toLowerCase(), N=normCode(q), out=[], shown=new Set();
  const cards=N.length>2?DB.cards.filter(c=>normCode(c.card_code).includes(N)):[];
  const rooms=DB.rooms.filter(r=>String(r.room_number).toLowerCase()===L||(L.length>1&&(r.guest_name||"").toLowerCase().includes(L))||(L.length>1&&String(r.room_number).toLowerCase().includes(L)));
  const sts=DB.storages.filter(s=>String(s.storage_number).toLowerCase().includes(L)||normCode(s.storage_number)===N);
  const eqs=DB.equipment.filter(e=>[CATS[e.category],e.category,e.type,e.size,e.description].join(" ").toLowerCase().includes(L));

  // cards first — that's what the valet scanned
  cards.forEach(c=>{
    if(c.storage_id!=null && stor(c.storage_id)){ const s=stor(c.storage_id); if(!shown.has(s.id)){ shown.add(s.id); out.push(traceStorage(s,`Card ${c.card_code} opens this storage`)); } return; }
    const lr=room(c.last_room_id), ls=stor(c.last_storage_id);
    out.push(`<div class="panel" style="margin-bottom:12px">
      <div class="row"><b class="mono grow" style="font-size:18px">${esc(c.card_code)}</b>${chip(c.status||"bad",CARD_STATUS[c.status]||c.status)}
        <button class="btn sm" data-act="edit" data-col="cards" data-id="${c.id}">Edit card</button></div>
      <div class="chain">
        <div class="node"><small>Key card</small><b class="mono">${esc(c.card_code)}</b></div><span class="arrow">→</span>
        <div class="node ${c.room_id!=null&&!room(c.room_id)?"missing":""}"><small>Room</small><b>${c.room_id==null?"—":room(c.room_id)?esc(room(c.room_id).room_number):"deleted #"+c.room_id}</b></div><span class="arrow">→</span>
        <div class="node missing"><small>Storage</small><b>${c.storage_id==null?"none":"deleted #"+c.storage_id}</b></div>
      </div>
      <p class="muted tiny" style="margin:0">${c.status==="released"
        ?`Released ${ago(c.released_at)}${lr||ls?` — last used by ${lr?"room "+esc(lr.room_number):""}${ls?" in "+esc(ls.storage_number):""}`:""}. Scanning it in the app starts a new registration.`
        :"This card is not linked to any existing storage, so a scan cannot show equipment. Edit the card to link a storage."}</p>
      <div class="hist" style="margin-top:10px">${DB.history.filter(h=>h.key_card_id===c.id).slice(0,8).map(histEvent).join("")}</div>
    </div>`);
  });
  rooms.forEach(r=>{
    const sts=storagesOfRoom(r.id);
    sts.forEach(s=>{ if(!shown.has(s.id)){ shown.add(s.id); out.push(traceStorage(s,`Room ${r.room_number}${r.guest_name?" · "+r.guest_name:""}`)); } });
    if(!sts.length) out.push(`<div class="panel" style="margin-bottom:12px"><div class="row"><b class="grow" style="font-family:var(--display);font-size:20px">Room ${esc(r.room_number)} ${r.guest_name?"· "+esc(r.guest_name):""}</b>
      ${chip(r.status||"staying",ROOM_STATUS[r.status]||r.status)}<button class="btn sm" data-act="edit" data-col="rooms" data-id="${r.id}">Edit room</button></div>
      <p class="muted tiny">No storage is linked to this room. Cards: ${cardsOfRoom(r.id).map(c=>esc(c.card_code)).join(", ")||"none"}.</p>
      <div class="hist">${DB.history.filter(h=>h.room_id===r.id).slice(0,8).map(histEvent).join("")||`<div class="dim tiny">No history.</div>`}</div></div>`);
  });
  sts.forEach(s=>{ if(!shown.has(s.id)){ shown.add(s.id); out.push(traceStorage(s,"Storage number match")); } });
  eqs.forEach(e=>{ const s=stor(e.storage_id);
    if(s){ if(!shown.has(s.id)){ shown.add(s.id); out.push(traceStorage(s,`Holds ${CATS[e.category]||e.category}${e.size?" "+e.size:""}`)); } }
    else out.push(`<div class="issue hot"><div class="grow"><b>Orphan item #${e.id}</b><p>${esc(CATS[e.category]||e.category)} ×${esc(e.quantity)} — its storage #${esc(e.storage_id)} no longer exists.</p></div>
      <button class="btn sm" data-act="edit" data-col="equipment" data-id="${e.id}">Move to a storage</button></div>`);
  });
  // history mentions — finds records that were deleted or released
  const hm=DB.history.filter(h=>[h.action,h.notes,h.prev,h.next].join(" ").toLowerCase().includes(L)
    ||(N.length>2&&normCode(card(h.key_card_id)?.card_code||"").includes(N))).slice(0,25);
  if(hm.length) out.push(`<h2 class="sec">History mentions · ${hm.length}</h2><div class="hist">${hm.map(histEvent).join("")}</div>`);
  return out.join("")||`<div class="dim" style="text-align:center;padding:30px">No record or history entry matches “${esc(q)}”.</div>`;
}

    filter:{k:"status",opts:CARD_STATUS},
    sort:(a,b)=>(b.updated_at||0)-(a.updated_at||0),
    unique:(v,rec)=>DB.cards.some(c=>c!==rec&&normCode(c.card_code)===normCode(v.card_code))&&`Card ${normCode(v.card_code)} already exists`,
    check(v){ const s=stor(v.storage_id); if(s&&v.room_id!=null&&s.room_id!=null&&s.room_id!==v.room_id)
      return `${s.storage_number} belongs to room ${room(s.room_id)?.room_number}. Pick that room or change the storage's room first.`; },
    del(c){ return {warn:"The card will no longer be recognised when scanned.",run(){ DB.cards=DB.cards.filter(x=>x!==c); }}; }
  },
  equipment:{ title:"Equipment", one:"item", label:e=>(CATS[e.category]||e.category)+" #"+e.id,
    fields:[
      {k:"storage_id",l:"Storage",type:"select",opts:storOptsReq,num:true,req:true},
      {k:"category",l:"Category",type:"select",opts:()=>opt(CATS),def:"skis"},
      {k:"quantity",l:"Quantity",type:"number",def:1,req:true},
      {k:"size",l:"Size"},
      {k:"type",l:"Type / brand"},
      {k:"description",l:"Description"}],
    cols:[["#",e=>`<span class="dim">${e.id}</span>`],["Item",e=>`<b>${esc(CATS[e.category]||e.category)}</b>`],["Qty",e=>esc(e.quantity)],
      ["Size",e=>esc(e.size||"—")],["Type",e=>esc([e.type,e.description].filter(Boolean).join(" · ")||"—")],
      ["Storage",e=>storLabel(e.storage_id)],["Room",e=>roomLabel(stor(e.storage_id)?.room_id)],["Updated",e=>ago(e.updated_at)]],
    text:e=>[e.id,CATS[e.category],e.category,e.size,e.type,e.description,stor(e.storage_id)?.storage_number,room(stor(e.storage_id)?.room_id)?.room_number].join(" "),
    filter:{k:"category",opts:CATS},
    sort:(a,b)=>String(stor(a.storage_id)?.storage_number||"~").localeCompare(String(stor(b.storage_id)?.storage_number||"~"),undefined,{numeric:true}),
    check(v){ if(!(v.quantity>=1)) return "Quantity must be at least 1"; },
    del(e){ return {run(){ DB.equipment=DB.equipment.filter(x=>x!==e); }}; }
  },
  users:{ title:"Staff", one:"staff member", label:u=>u.name,
    fields:[
      {k:"name",l:"Name",req:true},{k:"email",l:"Email"},
      {k:"pin",l:"4-digit PIN",req:true},
      {k:"role",l:"Role",type:"select",opts:()=>[{v:"staff",l:"Ski Valet staff"},{v:"admin",l:"Admin"}],def:"staff"}],
    cols:[["Name",u=>`<b>${esc(u.name)}</b>`],["Email",u=>esc(u.email||"—")],["Role",u=>chip(u.role==="admin"?"occupied":"available",u.role==="admin"?"Admin":"Staff")],
      ["PIN",u=>`<span class="mono">${esc(u.pin)}</span>`],["Actions",u=>`<span class="lnk" data-act="go" data-view="history" data-q="${esc(u.name)}">${DB.history.filter(h=>h.user_id===u.id).length}</span>`]],
    text:u=>[u.name,u.email,u.role].join(" "),
    sort:(a,b)=>String(a.name).localeCompare(b.name),
    check(v,rec){ if(!/^\d{4}$/.test(v.pin)) return "PIN must be exactly 4 digits";
      if(rec&&rec.role==="admin"&&v.role!=="admin"&&DB.users.filter(u=>u.role==="admin").length<2) return "Keep at least one admin"; },
    del(u){ if(u.id===SESSION.id) return {block:"You can't delete the account you are signed in with."};
      if(u.role==="admin"&&DB.users.filter(x=>x.role==="admin").length<2) return {block:"This is the last admin."};
      return {warn:"History entries stay, but will show “System” instead of the name.",run(){ DB.users=DB.users.filter(x=>x!==u); }}; }
  }
};

function tableView(col){

  return (p)=>{
    const q=p.q||"", f=p.f||"";
    return {body:`
      <h1>${S.title}</h1>
      <p class="lead">${DB[col].length} records. Click a linked room or storage to trace it. Edits are logged in the history and can be undone from a snapshot.</p>
      <div class="toolbar">
        <div class="searchbar">🔎<input id="tblQ" value="${esc(q)}" placeholder="Filter ${S.title.toLowerCase()}…" autocomplete="off"></div>
        ${S.filter?`<select class="input" id="tblF"><option value="">All</option>${Object.entries(S.filter.opts).map(([v,l])=>`<option value="${v}" ${f===v?"selected":""}>${esc(l)}</option>`).join("")}</select>`:""}
        <button class="btn primary" data-act="new" data-col="${col}">+ New ${S.one}</button>
        <button class="btn ghost" data-act="csv" data-col="${col}">CSV</button>
      </div>
      <div class="tbl-wrap"><table><thead><tr>${S.cols.map(c=>`<th>${c[0]}</th>`).join("")}<th></th></tr></thead><tbody id="tblBody"></tbody></table></div>
      <div class="pager" id="tblPager"></div>`,
    after(){
      const draw=()=>{
        const q=$("#tblQ").value.trim().toLowerCase(), f=$("#tblF")?$("#tblF").value:"";
        params.q=$("#tblQ").value; params.f=f;
        const rows=[...DB[col]].filter(r=>(!f||r[S.filter.k]===f)&&(!q||S.text(r).toLowerCase().includes(q))).sort(S.sort);
        const LIM=300;
        $("#tblBody").innerHTML=rows.slice(0,LIM).map(r=>`<tr>${S.cols.map(c=>`<td>${c[1](r)}</td>`).join("")}
          <td class="act"><button class="btn sm" data-act="edit" data-col="${col}" data-id="${r.id}">Edit</button><button class="btn sm danger" data-act="del" data-col="${col}" data-id="${r.id}">✕</button></td></tr>`).join("")
          ||`<tr><td colspan="${S.cols.length+1}" class="dim" style="text-align:center;padding:24px">Nothing matches.</td></tr>`;
        $("#tblPager").textContent=rows.length>LIM?`Showing ${LIM} of ${rows.length} — refine the filter`:`${rows.length} shown`;
      };
      $("#tblQ").addEventListener("input",draw); $("#tblF")&&$("#tblF").addEventListener("change",draw); draw();
    }};
  };
}
["rooms","storages","cards","equipment","users"].forEach(c=>V[c]=tableView(c));

function fieldHTML(f,val){
  const v=val??f.def??"";
  if(f.type==="select") return `<select class="input" name="${f.k}">${f.opts().map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(v)?"selected":""}>${esc(o.l)}</option>`).join("")}</select>`;
  const dl=f.list?`list="dl_${f.k}"`:"";
  return `<input class="input" name="${f.k}" type="${f.type||"text"}" value="${esc(v)}" ${dl} autocomplete="off" ${f.type==="number"?'min="1"':""}>`
    +(f.list?`<datalist id="dl_${f.k}">${f.list().map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`:"");
}
function openForm(col,id){
  const S=SCHEMA[col], rec=id!=null?DB[col].find(x=>x.id===id):null;
  if(id!=null&&!rec){ toast("Record not found","err"); return; }
  openSheet(`<h3>${rec?"Edit":"New"} ${S.one}</h3>
    <p class="sub">${rec?`${esc(S.label(rec))} · id ${rec.id}${rec.created_at?" · created "+fmtDT(rec.created_at):""}`:"Creates the record directly in the valet data."}</p>
    <form id="frm" onsubmit="return false">${S.fields.map(f=>`<label class="f"><span>${f.l}${f.req?" *":""}</span>${fieldHTML(f,rec?rec[f.k]:undefined)}</label>`).join("")}</form>
    <div class="foot">
      ${rec?`<button class="btn ghost" data-act="raw" data-col="${col}" data-id="${rec.id}">Raw JSON</button>`:""}
      <span class="grow"></span>
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn primary" data-act="save" data-col="${col}" data-id="${rec?rec.id:""}">Save</button></div>`);
  setTimeout(()=>$("#frm .input")?.focus(),50);
}
function readForm(S){
  const v={};
  S.fields.forEach(f=>{ let x=$(`#frm [name="${f.k}"]`).value;
    if(f.type!=="select") x=x.trim();
    if(f.upper) x=x.toUpperCase();
    if(f.norm) x=normCode(x);
    if(f.num) x=x===""?null:+x;
    if(f.type==="number") x=parseInt(x,10);
    v[f.k]=x; });
  return v;
}
function saveForm(col,id){
  const S=SCHEMA[col], rec=id?DB[col].find(x=>x.id===+id):null, v=readForm(S);
  const miss=S.fields.find(f=>f.req&&(v[f.k]===""||v[f.k]==null||Number.isNaN(v[f.k])));
  if(miss){ toast(miss.l+" is required","err"); return; }
  const err=(S.unique&&S.unique(v,rec))||(S.check&&S.check(v,rec));
  if(err){ toast(err,"err"); return; }
  const diff=rec?S.fields.filter(f=>String(rec[f.k]??"")!==String(v[f.k]??"")).map(f=>`${f.l}: ${rec[f.k]??"—"} → ${v[f.k]??"—"}`):[];
  if(rec&&!diff.length){ closeSheet(); return; }
  let target=rec;
  commit(rec?`Edit ${S.label(rec)}`:`New ${S.one}`,()=>{
    if(rec){ Object.assign(rec,v); if("updated_at" in rec||col!=="users") rec.updated_at=now(); }
    else { target={id:nextId(),...v,created_at:now()};
      if(col!=="users") target.updated_at=now();
      if(col==="equipment") target.status="stored";
      if(col==="cards") target.last_scanned_at=null;
      DB[col].push(target); }
    // keep the app's invariants: a card linked to a storage follows its room
    if(col==="cards"&&target.storage_id!=null&&target.room_id==null&&stor(target.storage_id)?.room_id!=null) target.room_id=stor(target.storage_id).room_id;
    if(col==="cards"&&target.status==="released"&&!rec?.released_at) target.released_at=now();
    if(col==="storages"&&target.room_id!=null&&target.status==="available") target.status="preparing";
    if(col==="equipment"){ const s=stor(target.storage_id); if(s&&s.status==="available"){ s.status="occupied"; s.updated_at=now(); } }
  },()=>({action:rec?`${S.one[0].toUpperCase()+S.one.slice(1)} edited`:`${S.one[0].toUpperCase()+S.one.slice(1)} created`,
     ...refsOf(col,target||v),notes:rec?diff.join(" · "):S.label(target)}));
  closeSheet(); toast("Saved");
}
function refsOf(col,r){
  if(!r) return {};
  if(col==="rooms") return {room_id:r.id??null};
  if(col==="storages") return {storage_id:r.id??null,room_id:r.room_id??null};
  if(col==="cards") return {key_card_id:r.id??null,room_id:r.room_id??null,storage_id:r.storage_id??null};
  if(col==="equipment") return {equipment_id:r.id??null,storage_id:r.storage_id??null,room_id:stor(r.storage_id)?.room_id??null};
  return {};
}
function askDelete(col,id){
  const S=SCHEMA[col], rec=DB[col].find(x=>x.id===id); if(!rec) return;
  const d=S.del(rec);
  if(d.block){ toast(d.block,"err"); return; }
  openSheet(`<h3 style="color:var(--st-attention)">Delete ${esc(S.label(rec))}</h3>
    <p class="sub">${esc(d.warn||"This record will be removed.")} A snapshot is taken first, so it can be restored.</p>
    <div class="foot"><button class="btn" data-act="close">Cancel</button>
      <button class="btn danger" data-act="do-del" data-col="${col}" data-id="${id}">Delete</button></div>`);
}
function doDelete(col,id){
  const S=SCHEMA[col], rec=DB[col].find(x=>x.id===id); if(!rec) return;
  const d=S.del(rec), label=S.label(rec), refs=refsOf(col,rec);
  commit(`Delete ${label}`,()=>d.run(),{action:`${S.one[0].toUpperCase()+S.one.slice(1)} deleted`,...refs,notes:label});
  closeSheet(); toast("Deleted");
}
function openRaw(col,id){
  const rec=DB[col].find(x=>x.id===id);
  openSheet(`<h3>Raw record</h3><p class="sub">${col} · id ${id}. Edit any field — must stay valid JSON and keep the same id.</p>
    <textarea class="input code" id="rawRec" style="min-height:40dvh" spellcheck="false">${esc(JSON.stringify(rec,null,2))}</textarea>
    <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-raw" data-col="${col}" data-id="${id}">Save record</button></div>`);
}
function saveRaw(col,id){
  let v; try{ v=JSON.parse($("#rawRec").value); }catch(e){ toast("Invalid JSON: "+e.message,"err"); return; }
  if(!v||typeof v!=="object"||Array.isArray(v)||v.id!==id){ toast("Must be an object with id "+id,"err"); return; }
  const rec=DB[col].find(x=>x.id===id);
  commit(`Raw edit ${col} #${id}`,()=>{ Object.keys(rec).forEach(k=>delete rec[k]); Object.assign(rec,v); },
    {action:"Raw record edited",...refsOf(col,v),notes:`${col} #${id}`});
  closeSheet(); toast("Record saved");
}
function toCSV(col){
  const rows=DB[col]; if(!rows.length){ toast("Nothing to export","info"); return; }
  const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const cell=v=>{ const s=v==null?"":typeof v==="object"?JSON.stringify(v):String(v); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  download(`skivalet-${col}-${stamp()}.csv`,[keys.join(","),...rows.map(r=>keys.map(k=>cell(r[k])).join(","))].join("\n"),"text/csv");
}

  return {body:`
    <h1>Backup &amp; data</h1>
    <p class="lead">The valet app keeps its data in this browser (<span class="mono">localStorage["${KEY}"]</span>). Download a backup before large repairs; restore it on any device running the app.</p>

      <div class="panel">
        <h2 class="sec" style="margin-top:0">Undo snapshots · ${snaps.length}</h2>
        <p class="muted tiny" style="margin-top:0">Taken automatically before every admin change (latest ${MAX_SNAPS}). Restoring also snapshots the current state.</p>
        ${snaps.map(s=>`<div class="issue" style="border-left-color:var(--glacier)"><div class="grow"><b>${esc(s.label)}</b>
          <p>${fmtDT(s.ts)} · ${esc(s.by)} · before this change</p></div>
          <button class="btn sm" data-act="snap-restore" data-ts="${s.ts}">Restore</button>
          <button class="btn sm ghost" data-act="snap-dl" data-ts="${s.ts}">⬇</button></div>`).join("")||`<div class="dim tiny">No snapshots yet.</div>`}
      </div>
    </div>
    <h2 class="sec">Raw database editor</h2>
    <p class="muted tiny">Last resort: edit the full JSON directly. It is validated before saving.</p>
    <textarea class="input code" id="rawDB" spellcheck="false">${esc(JSON.stringify(DB,null,2))}</textarea>
    <div class="row" style="margin-top:10px;justify-content:flex-end">
      <button class="btn ghost" data-act="raw-reload">Discard edits</button>
      <button class="btn primary" data-act="raw-save">Validate &amp; save</button></div>

  after(){ $("#impFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>importJSON(rd.result,f.name); rd.readAsText(f); }); }};

function validateDB(o){
  if(!o||typeof o!=="object"||Array.isArray(o)) return "Top level must be an object";
  for(const k of COLLECTIONS) if(o[k]!==undefined&&!Array.isArray(o[k])) return `"${k}" must be an array`;
  if(!Array.isArray(o.users)||!o.users.length) return "At least one user is required";
  for(const k of COLLECTIONS) for(const x of (o[k]||[])) if(!x||typeof x!=="object"||x.id==null) return `Every ${k} record needs an id`;
  if(!o.users.some(u=>u.role==="admin")) return "At least one admin is required";
  return null;
}
function replaceDB(next,label,notes){
  const err=validateDB(next); if(err){ toast(err,"err"); return false; }
  Snaps.push(label,DB);
  DB=normalise(next);
  const me=user(SESSION.id);
  if(!me||me.role!=="admin"){ SESSION=DB.users.find(u=>u.role==="admin"); }
  else SESSION=me;
  log(label,{notes}); Store.write(DB); render(); return true;
}
function importJSON(text,name){
  let o; try{ o=JSON.parse(text); }catch(e){ toast("Not valid JSON","err"); return; }
  if(o&&o.skivalet_backup&&o.data) o=o.data;
  const err=validateDB(o); if(err){ toast(err,"err"); return; }
  openSheet(`<h3>Restore backup</h3><p class="sub">${esc(name)}</p>
    <div class="panel tiny">${COLLECTIONS.map(k=>`<div class="row"><span class="grow muted">${k}</span><b>${(o[k]||[]).length}</b><span class="dim">now ${DB[k].length}</span></div>`).join("")}</div>
    <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="doImp">Replace current data</button></div>`);
  $("#doImp").onclick=()=>{ if(replaceDB(o,"Backup restored",name)){ closeSheet(); toast("Backup restored"); } };
}

}

/* ==========================================================================
   7. EVENTS
   ========================================================================== */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, col=el.dataset.col, id=el.dataset.id?+el.dataset.id:null;
  switch(a){
    case "login": doLogin(); break;
    case "recover-admin": { const name=$("#rName").value.trim()||"Recovery admin", pin=$("#rPin").value.trim();
      if(!/^\d{4}$/.test(pin)){ toast("PIN must be 4 digits","err"); break; }
      const u={id:nextId(),name,email:"",role:"admin",pin,created_at:now()}; DB.users.push(u); SESSION=u;
      try{ sessionStorage.setItem(SESSION_KEY,String(u.id)); }catch(_){}
      log("Recovery admin created",{notes:name}); Store.write(DB); go("overview"); break; }
    case "signout": SESSION=null; try{ sessionStorage.removeItem(SESSION_KEY); }catch(_){} render(); break;
    case "go": go(el.dataset.view, el.dataset.q?{q:el.dataset.q}:{}); break;
    case "trace": closeSheet(); go("trace",{q:el.dataset.q}); break;
    case "close": closeSheet(); break;
    case "fix": { const i=checkIntegrity()[+el.dataset.n]; if(!i||!i.fix) break;
      commit("Fix: "+i.t,()=>i.fix(),{action:"Data repaired",notes:i.t+" — "+i.p}); toast("Fixed"); break; }
    case "fix-all": { let n=0, guard=0;
      commit("Fix all automatic issues",()=>{ let list;
        // re-check after each pass — one fix can reveal or clear another
        while((list=checkIntegrity().filter(i=>i.fix)).length && guard++<20){ list.forEach(i=>{ i.fix(); n++; }); } },
        {action:"Data repaired",notes:"Automatic repair"});
      toast(n+" fix"+(n===1?"":"es")+" applied"); break; }
    case "link-room-cards": { const s=stor(id);
      commit(`Link room cards to ${s.storage_number}`,()=>{ cardsOfRoom(s.room_id).forEach(c=>{ c.storage_id=s.id; c.status="active"; c.updated_at=now(); }); },
        {action:"Key cards linked",storage_id:s.id,room_id:s.room_id,notes:"All room cards now open "+s.storage_number}); toast("Cards linked"); break; }
    case "new": openForm(col,null); break;
    case "edit": openForm(col,id); break;
    case "save": saveForm(col,el.dataset.id); break;
    case "del": askDelete(col,id); break;
    case "do-del": doDelete(col,id); break;
    case "raw": openRaw(col,id); break;
    case "save-raw": saveRaw(col,id); break;
    case "csv": toCSV(col); break;
    case "export": download(`skivalet-backup-${stamp()}.json`,JSON.stringify({skivalet_backup:1,exported_at:new Date().toISOString(),data:DB},null,2)); break;
    case "snap-restore": { const s=Snaps.all().find(x=>x.ts===+el.dataset.ts); if(!s) break;
      confirmSheet("Restore snapshot",`Go back to the state before “${esc(s.label)}” (${fmtDT(s.ts)}). Changes made after it, in the app or here, are lost — the current state is snapshotted first.`,
        "Restore",()=>{ if(replaceDB(JSON.parse(s.data),"Snapshot restored",s.label)) toast("Snapshot restored"); }); break; }
    case "snap-dl": { const s=Snaps.all().find(x=>x.ts===+el.dataset.ts); if(s) download(`skivalet-snapshot-${s.ts}.json`,s.data); break; }
    case "raw-reload": render(); break;
    case "raw-save": { let o; try{ o=JSON.parse($("#rawDB").value); }catch(err){ toast("Invalid JSON: "+err.message,"err"); break; }
      if(replaceDB(o,"Raw database edit","Full JSON edited")) toast("Database saved"); break; }
    case "clear-history": confirmSheet("Clear history","Removes every audit record. Rooms, storages, cards and equipment stay.","Clear history",
      ()=>{ commit("Clear history",()=>{ DB.history=[]; },{action:"History cleared"}); toast("History cleared"); }); break;
    case "wipe": confirmSheet("Erase all hall data","Every room, key card, storage and item is removed. Staff accounts stay.","Erase everything",
      ()=>{ commit("Erase all hall data",()=>{ DB.rooms=[]; DB.storages=[]; DB.cards=[]; DB.equipment=[]; },{action:"Hall erased"}); toast("Hall erased","info"); }); break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeSheet();
  if(e.key==="Enter"&&e.target.id==="lPin") doLogin();
  if(e.key==="Enter"&&e.target.closest&&e.target.closest("#frm")){ const b=$('[data-act="save"]'); b&&b.click(); }
});

/* Another tab (the valet app) saved — reload so nothing is overwritten. */
window.addEventListener("storage",e=>{
  if(e.key!==KEY||!e.newValue) return;
  try{ DB=normalise(JSON.parse(e.newValue)); }catch(_){ return; }
  if(SESSION) SESSION=user(SESSION.id)||null;
  // don't clobber a form or raw editor the admin is typing in
  if(!$("#modal").classList.contains("hidden")||(view==="data"&&document.activeElement?.id==="rawDB")){ toast("Data changed in the valet app","info"); return; }
  render();
});

/* ==========================================================================
   8. BOOT
   ========================================================================== */
(async function boot(){
  DB=normalise(await Store.load());
  if(!DB.users.length){
    // no valet data on this device yet — same defaults as the app's empty hall
    DB.users=[
      {id:1,name:"Maria Kovač",email:"maria@hotel.com",role:"admin",pin:"1111",created_at:now()},
      {id:2,name:"John Bauer", email:"john@hotel.com", role:"staff",pin:"2222",created_at:now()},
      {id:3,name:"Lukas Meier",email:"lukas@hotel.com",role:"staff",pin:"3333",created_at:now()}];
  }
  try{ const sid=+sessionStorage.getItem(SESSION_KEY); const u=user(sid); if(u&&u.role==="admin") SESSION=u; }catch(e){}
  render();
})();
</script>
