<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1621">
<meta name="robots" content="noindex">
<title>Ski Valet · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SKI VALET ADMIN — same tokens as the valet app (index.html)
   ============================================================ */
:root{
  --night:#0E1621; --slab:#16222F; --slab2:#1D2C3B; --line:#27394B;
  --frost:#E7EEF5; --mist:#90A4B8; --dim:#63798F;
  --signal:#FF6A2B; --signal-d:#E2551A; --glacier:#5EC8F2;
  --st-available:#64748B; --st-preparing:#F0A93B; --st-occupied:#5EC8F2;
  --st-ready:#35C36A; --st-guest:#A98BF5; --st-attention:#FF4D4D; --st-closed:#3C4A5A;
  --r:14px; --r-s:10px;
  --display:"Barlow Condensed", "Oswald", Impact, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--night);color:var(--frost);font-family:var(--body);font-size:15px;line-height:1.45}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--glacier)}
.hidden{display:none !important}
:focus-visible{outline:3px solid var(--glacier);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:rgba(14,22,33,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand b{display:block;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.6px;text-transform:uppercase;line-height:1}
.brand span{display:block;font-size:11px;color:var(--signal);letter-spacing:1.6px;text-transform:uppercase}
.topbar .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mist)}
.layout{display:flex;max-width:1400px;margin:0 auto}
nav.side{width:210px;flex:none;padding:14px 10px;position:sticky;top:65px;align-self:flex-start;height:calc(100vh - 65px);height:calc(100dvh - 65px);overflow:auto}
nav.side button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  font-family:var(--display);font-size:17px;letter-spacing:.8px;text-transform:uppercase;color:var(--mist);text-align:left}
nav.side button:hover{background:var(--slab)}
nav.side button.on{background:var(--slab2);color:var(--frost);box-shadow:inset 3px 0 0 var(--signal)}
nav.side .cnt{margin-left:auto;font-size:13px;color:var(--dim)}
nav.side .cnt.bad{color:var(--st-attention)}
main{flex:1;min-width:0;padding:18px 16px 60px}
@media (max-width:820px){
  .layout{flex-direction:column}
  nav.side{width:auto;height:auto;position:static;align-self:stretch;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
  nav.side button{width:auto;flex:none;padding:8px 12px;font-size:15px}
  nav.side button.on{box-shadow:inset 0 -3px 0 var(--signal)}
  .who,.hide-sm{display:none}
  .brand b{font-size:19px}
}

/* ---------- type / blocks ---------- */
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.8px;text-transform:uppercase;margin:0 0 4px}
.lead{color:var(--mist);margin:0 0 16px;font-size:14px}
h2.sec{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:1.6px;font-size:14px;color:var(--mist);
  margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.panel{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--mist)} .dim{color:var(--dim)} .tiny{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mist);margin:4px 0 16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.map-area{margin-bottom:22px}
.map-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.map-head h3{margin:0;font-family:var(--display);font-size:20px;letter-spacing:.6px;text-transform:uppercase}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cell{position:relative;overflow:hidden;min-height:84px;border-radius:10px;background:var(--slab);border:1px solid var(--c,var(--line));
  color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px 6px}
.cell::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c,var(--st-available))}
.cell:hover{background:#243549}
.cell .n{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.5px}
.cell .k{font-size:10px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase}
.cell.add{border-style:dashed;border-color:var(--line);color:var(--mist);font-size:26px}
.cell.add::before{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--slab);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:var(--r);padding:12px 14px;text-align:left}
.stat b{display:block;font-family:var(--display);font-size:32px;line-height:1}
.stat span{font-size:12px;color:var(--mist);text-transform:uppercase;letter-spacing:.8px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--r-s);
  background:var(--slab2);border:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:1px;
  text-transform:uppercase;color:var(--frost);white-space:nowrap}
.btn:hover{background:#243549}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#160B04}
.btn.go{background:var(--st-ready);border-color:var(--st-ready);color:#06210F}
.btn.danger{background:transparent;border-color:#5A2530;color:#FF8080}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:0 10px;font-size:14px}
.btn:disabled{opacity:.4;pointer-events:none}
.input{width:100%;min-height:40px;background:var(--night);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 12px;outline:none}
.input:focus{border-color:var(--glacier)}
textarea.input{min-height:120px;resize:vertical}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;min-height:60vh;min-height:60dvh;white-space:pre}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;color:var(--mist);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.searchbar{display:flex;gap:8px;align-items:center;background:var(--slab);border:1px solid var(--line);border-radius:var(--r-s);padding:0 12px}
.searchbar input{flex:1;background:none;border:0;outline:none;min-height:42px;font-size:16px;font-weight:600;min-width:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .searchbar{flex:1;min-width:220px}
.toolbar select{width:auto}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--display);font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:13px;color:var(--mist);
  background:var(--slab);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(255,255,255,.02)}
tr.clk{cursor:pointer} tr.clk:hover td{background:rgba(255,255,255,.05)}
.sheet.wide{max-width:820px}
td.act{white-space:nowrap;text-align:right}
td.act .btn+.btn{margin-left:4px}
.warn{color:var(--st-attention)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-family:var(--display);font-weight:600;
  text-transform:uppercase;letter-spacing:1px;font-size:12px;background:var(--slab2);border:1px solid var(--line);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.s-available{color:var(--st-available)} .s-preparing{color:var(--st-preparing)} .s-occupied{color:var(--st-occupied)}
.s-ready{color:var(--st-ready)} .s-guest_using{color:var(--st-guest)} .s-attention{color:var(--st-attention)} .s-closed{color:#7A8898}
.s-active{color:var(--st-ready)} .s-released{color:var(--st-available)} .s-staying{color:var(--st-occupied)} .s-checked_out{color:var(--st-available)}
.s-bad{color:var(--st-attention)}
.lnk{color:var(--glacier);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--mist)}

/* ---------- issues / trace ---------- */
.issue{display:flex;gap:12px;align-items:flex-start;background:var(--slab);border:1px solid var(--line);border-left:4px solid var(--st-preparing);
  border-radius:var(--r-s);padding:10px 12px}
.issue.hot{border-left-color:var(--st-attention)}
.issue+.issue{margin-top:8px}
.issue b{font-family:var(--display);font-size:16px;letter-spacing:.8px;text-transform:uppercase;display:block}
.issue p{margin:2px 0 0;font-size:13px;color:var(--mist)}
.issue .grow{min-width:0}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.node{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:120px}
.node small{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.node b{font-family:var(--display);font-size:19px;letter-spacing:.6px}
.node.missing{border-style:dashed;border-color:var(--st-attention)}
.node.missing b{color:var(--st-attention)}
.arrow{color:var(--dim);font-size:20px}
.hist{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.hev{position:relative;padding:0 0 12px}
.hev::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--slab2);border:2px solid var(--glacier)}
.hev .t{font-family:var(--display);letter-spacing:1px;font-size:12px;color:var(--dim);text-transform:uppercase}
.hev b{font-family:var(--display);font-size:16px;letter-spacing:.5px}
.hev p{margin:1px 0 0;font-size:13px;color:var(--mist)}
.hev.adm::before{border-color:var(--signal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:980px){ .grid2{grid-template-columns:1fr} }

/* ---------- login ---------- */
.login{max-width:380px;margin:10vh auto 0;padding:20px}
.login .a{font-family:var(--display);color:var(--signal);letter-spacing:2px;text-transform:uppercase;font-size:13px}
.login .b{font-family:var(--display);font-weight:700;font-size:44px;text-transform:uppercase;line-height:1}
.login .c{color:var(--mist);margin-bottom:24px}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(5,9,14,.72);padding:16px}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--slab);border:1px solid var(--line);border-radius:18px;padding:20px}
.sheet h3{font-family:var(--display);font-size:24px;letter-spacing:1px;text-transform:uppercase;margin:0 0 4px}
.sheet .sub{color:var(--mist);font-size:14px;margin:0 0 16px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--st-ready);color:#06210F;border-radius:12px;padding:11px 16px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast.err{background:var(--st-attention);color:#fff}
.toast.info{background:var(--glacier);color:#052637}
.banner{background:#2A1A10;border:1px solid #5A3520;color:#FFC7A8;border-radius:var(--r-s);padding:10px 12px;font-size:13px;margin-bottom:14px}

/* ---------- visual refinement ---------- */
:root{--night:#09131f;--slab:#132333;--slab2:#1a3042;--line:#2b4357;--frost:#f1f7fc;--mist:#a8bdcf;--dim:#71899e;--r:16px;--r-s:11px}
html,body{background:radial-gradient(900px 520px at 5% -10%,#1b3c52 0%,transparent 60%),var(--night)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(120deg,rgba(94,200,242,.035),transparent 35%,rgba(255,106,43,.04))}
.topbar{box-shadow:0 8px 24px rgba(3,10,17,.22);border-color:rgba(112,151,178,.3)}
nav.side{border-right:1px solid rgba(112,151,178,.18)}
nav.side button{transition:background .16s ease,color .16s ease,transform .16s ease}
nav.side button.on{background:linear-gradient(90deg,rgba(255,106,43,.16),rgba(26,48,66,.8));box-shadow:inset 3px 0 0 var(--signal)}
.panel,.stat,.cell,.issue,.node,.searchbar,.tbl-wrap{border-color:rgba(112,151,178,.3)}
.panel{background:linear-gradient(145deg,rgba(27,48,66,.98),rgba(17,34,48,.98));box-shadow:0 10px 24px rgba(2,10,17,.14)}

@media(hover:hover){.btn:hover{transform:translateY(-1px);border-color:#49677e;box-shadow:0 8px 18px rgba(0,0,0,.2)}.btn.primary:hover{background:#ff7a42}.cell:hover,.stat:hover{transform:translateY(-2px);border-color:#49677e;box-shadow:0 12px 22px rgba(0,0,0,.18)}nav.side button:hover{transform:translateX(2px)}}
.input{background:rgba(5,15,24,.58);border-color:rgba(112,151,178,.35);transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}.input:focus{background:#0b1926;box-shadow:0 0 0 4px rgba(94,200,242,.12)}
.searchbar{background:rgba(19,35,51,.9);box-shadow:0 7px 16px rgba(2,10,17,.1)}
.tbl-wrap{box-shadow:0 10px 24px rgba(2,10,17,.13)}th{background:#1a3042}tr.clk:hover td,tr:hover td{background:rgba(94,200,242,.055)}
.sheet{box-shadow:0 18px 48px rgba(0,0,0,.42);border-color:rgba(112,151,178,.42)}.modal{background:rgba(3,10,16,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media(min-width:1100px){.layout{padding:12px}.topbar{margin:10px 12px 0;border:1px solid rgba(112,151,178,.3);border-radius:16px}.layout{max-width:1424px}main{padding:26px 28px 72px}nav.side{top:77px;height:calc(100vh - 89px);border-radius:16px;background:rgba(19,35,51,.5)}}
/* ---------- analytics ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:rgba(5,15,24,.4)}
.seg button{padding:7px 14px;font-family:var(--display);letter-spacing:1px;text-transform:uppercase;font-size:14px;color:var(--mist)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--signal);color:#160B04;font-weight:700}

.an-chart{overflow-x:auto;padding-bottom:4px}
.an-chart svg{display:block}
.an-chart text{fill:var(--dim);font-size:11px;font-family:var(--body)}
.an-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mist);margin:0 0 10px}
.an-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.heat .hc{height:20px;border-radius:3px;background:var(--glacier)}
.heat .hl{display:flex;align-items:center;font-family:var(--display);letter-spacing:1px;text-transform:uppercase;font-size:11px}
.heat .hh{text-align:center}

.insight:last-child{border-bottom:0}

</style>

<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>

<script src="sync.js"></script>
<script>
"use strict";
/* ==========================================================================
   1. STORAGE — PostgreSQL on the server is the single source of truth, shared
      with the valet app (sync.js). Every admin write asks the server to take a
      snapshot first, so it can be undone from Backup & data.
   ========================================================================== */
const MAX_SNAPS = 15;
function save(){ SkiSync.save(); }

/* Apply a change: mutate → audit log → push (server snapshots the state before it) → redraw. */
function commit(label, fn, logEntry){
  const before = JSON.stringify(DB);
  const res = fn();
  if(res===false){ DB=JSON.parse(before); SESSION=user(SESSION.id)||SESSION; return false; }
  const entry = typeof logEntry==="function" ? logEntry() : logEntry;
  if(entry!==null) log(entry?.action||label, entry||{});
  SkiSync.save(label); SNAPS=null; render();
  return true;
}

/* ==========================================================================
   2. DOMAIN (mirrors index.html)
   ========================================================================== */
const STATUS = {
  available:"Available", preparing:"Preparing", occupied:"Stored", ready:"Ready",
  guest_using:"Guest using", attention:"Needs attention", closed:"Closed"
};
const CARD_STATUS = {active:"Active", released:"Released"};
const ROOM_STATUS = {staying:"Staying", checked_out:"Checked out"};
const CATS = {
  skis:"Skis", boots:"Ski boots", poles:"Poles", snowboard:"Snowboard",
  sbboots:"Snowboard boots", helmet:"Helmet", goggles:"Goggles", other:"Other"
};
const EQ_STATUS = {stored:"Stored"};
const COLLECTIONS = ["rooms","storages","cards","equipment","users","history"];

let DB=null, SESSION=null, view="overview", params={}, loginUser=null;
const now=()=>Date.now();
const nextId = () => newId();          // unique across devices (sync.js)
const room = id => id==null?null:DB.rooms.find(r=>r.id===id);
const stor = id => id==null?null:DB.storages.find(s=>s.id===id);
const card = id => id==null?null:DB.cards.find(c=>c.id===id);
const user = id => id==null?null:DB.users.find(u=>u.id===id);
const eqItem = id => DB.equipment.find(e=>e.id===id);
const eqOf = id => DB.equipment.filter(e=>e.storage_id===id);
const eqCount = id => eqOf(id).reduce((a,e)=>a+(+e.quantity||0),0);
const cardsOfStorage = id => DB.cards.filter(c=>c.storage_id===id);
const cardsOfRoom = id => DB.cards.filter(c=>c.room_id===id);
const storagesOfRoom = id => DB.storages.filter(s=>s.room_id===id);
function normCode(s){ return String(s??"").toUpperCase().replace(/[^A-Z0-9]/g,""); }

function log(action,o={}){
  DB.history.unshift({id:nextId(),user_id:SESSION?SESSION.id:null,action:"[Admin] "+action,
    room_id:o.room_id??null,storage_id:o.storage_id??null,key_card_id:o.key_card_id??null,
    equipment_id:o.equipment_id??null,timestamp:now(),notes:o.notes||"",prev:o.prev||null,next:o.next||null});
  if(DB.history.length>5000) DB.history.length=5000;     // display cap only; the server keeps everything
}
function normalise(db){
  if(!db || typeof db!=="object" || Array.isArray(db)) db={};
  COLLECTIONS.forEach(k=>{ if(!Array.isArray(db[k])) db[k]=[]; });
  return db;
}
/* Access model (same as index.html): ONE shared staff PIN and ONE admin login
   (username + password), both checked by the server and stored there as hashes. */
const validPin = p => /^\d{4}$/.test(String(p??""));
const adminAcc = () => DB.users.find(u=>u.shared==="admin");
const staffAcc = () => DB.users.find(u=>u.shared==="staff");
const members  = () => DB.users.filter(u=>!u.shared&&!u.retired&&!u.archived).sort((a,b)=>String(a.name).localeCompare(b.name));
const archived = () => DB.users.filter(u=>!u.shared&&u.archived);
const nameTaken = (name,except) => members().some(u=>u!==except&&String(u.name).trim().toLowerCase()===name.trim().toLowerCase());
function credError(user,pw,pw2){
  if(!/^[A-Za-z0-9._-]{3,32}$/.test(user)) return "Username: 3–32 letters, numbers, . _ -";
  if(pw.length<8) return "Password must be at least 8 characters";
  if(pw!==pw2) return "The passwords do not match";
  return null;
}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDT(ts){ if(!ts) return "—"; const d=new Date(ts);
  return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function ago(ts){ if(!ts) return "—"; const m=Math.round((now()-ts)/6e4); if(m<1) return "just now"; if(m<60) return m+" min ago";
  const h=Math.floor(m/60); if(h<24) return h+"h ago"; return Math.floor(h/24)+"d ago"; }
function toast(msg,kind){ const t=document.createElement("div"); t.className="toast"+(kind?" "+kind:""); t.textContent=msg;
  $("#toast").appendChild(t); setTimeout(()=>t.remove(),2800); }
function chip(key,label){ return `<span class="chip s-${esc(key)}"><i class="dot"></i>${esc(label||key)}</span>`; }
function download(name,text,type){ const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:type||"application/json"})); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
const roomLabel = id => { if(id==null) return `<span class="dim">—</span>`; const r=room(id);
  return r?`<span class="lnk" data-act="trace" data-q="${esc(r.room_number)}">Room ${esc(r.room_number)}</span>`:`<span class="warn">missing #${esc(id)}</span>`; };
const storLabel = id => { if(id==null) return `<span class="dim">—</span>`; const s=stor(id);
  return s?`<span class="lnk" data-act="trace" data-q="${esc(s.storage_number)}">${esc(s.storage_number)}</span>`:`<span class="warn">missing #${esc(id)}</span>`; };

/* ==========================================================================
   4. INTEGRITY CHECK — finds the broken links that make a search fail.
      Each issue may carry a fix(); "Fix all" runs every safe fix.
   ========================================================================== */
function checkIntegrity(){
  const out=[];
  const add=(hot,t,p,fix,go)=>out.push({hot,t,p,fix,go});

  // duplicate ids inside a collection
  COLLECTIONS.forEach(k=>{ const seen=new Map();
    DB[k].forEach(x=>{ if(seen.has(x.id)) add(true,`Duplicate id in ${k}`,`Two ${k} records share id ${x.id}. Links to this id are ambiguous.`,
      ()=>{ x.id=nextId(); }); else seen.set(x.id,x); }); });

  // duplicate card codes / storage numbers / room numbers
  const dup=(arr,keyFn)=>{ const m={}; arr.forEach(x=>{ const k=keyFn(x); if(!k) return; (m[k]=m[k]||[]).push(x); });
    return Object.entries(m).filter(([,v])=>v.length>1); };
  dup(DB.cards,c=>normCode(c.card_code)).forEach(([code,list])=>add(true,"Duplicate card code",
    `Card ${code} exists ${list.length} times — the scanner only ever finds the first one.`,null,{view:"cards",q:code}));
  dup(DB.storages,s=>normCode(s.storage_number)).forEach(([n,list])=>add(true,"Duplicate storage number",
    `${list[0].storage_number} exists ${list.length} times.`,null,{view:"storages",q:list[0].storage_number}));
  dup(DB.rooms,r=>String(r.room_number??"").trim().toLowerCase()).forEach(([n,list])=>add(false,"Duplicate room number",
    `Room ${list[0].room_number} exists ${list.length} times.`,null,{view:"rooms",q:list[0].room_number}));

  DB.cards.forEach(c=>{
    if(!c.card_code) add(true,"Card without code",`Card record #${c.id} has an empty code and can never be scanned.`,()=>{ DB.cards=DB.cards.filter(x=>x!==c); });
    else if(normCode(c.card_code)!==c.card_code) add(false,"Card code not normalised",`"${c.card_code}" is stored with lowercase or symbols; scans look for ${normCode(c.card_code)}.`,()=>{ c.card_code=normCode(c.card_code); });
    if(c.room_id!=null && !room(c.room_id)) add(true,"Card points to a deleted room",`Card ${c.card_code} → room #${c.room_id}, which does not exist.`,()=>{ c.room_id=null; });
    if(c.storage_id!=null && !stor(c.storage_id)) add(true,"Card points to a deleted storage",`Card ${c.card_code} → storage #${c.storage_id}, which does not exist.`,()=>{ c.storage_id=null; });
    const s=stor(c.storage_id);
    if(s && room(c.room_id) && s.room_id!==c.room_id) add(false,"Card room ≠ storage room",
      `Card ${c.card_code} says room ${room(c.room_id).room_number} but ${s.storage_number} belongs to ${s.room_id?"room "+(room(s.room_id)?.room_number||"#"+s.room_id):"no room"}.`,
      s.room_id&&room(s.room_id)?()=>{ c.room_id=s.room_id; }:()=>{ s.room_id=c.room_id; });
    if(c.status==="active" && c.room_id==null && c.storage_id==null) add(false,"Active card linked to nothing",
      `Card ${c.card_code} is active but has no room and no storage.`,()=>{ c.status="released"; c.released_at=now(); });
    if(c.status==="released" && c.storage_id==null && c.room_id!=null && room(c.room_id)) add(false,"Released card still linked to a room",
      `Card ${c.card_code} is released but still points to room ${room(c.room_id).room_number}.`,()=>{ c.last_room_id=c.room_id; c.room_id=null; c.updated_at=now(); });
    if(c.status==="released" && (c.storage_id!=null)) add(false,"Released card still opens a storage",
      `Card ${c.card_code} is released but still linked to ${stor(c.storage_id)?.storage_number||"#"+c.storage_id}.`,()=>{ c.status="active"; });
    if(c.status && !CARD_STATUS[c.status]) add(false,"Unknown card status",`Card ${c.card_code} has status "${c.status}".`,()=>{ c.status=c.storage_id||c.room_id?"active":"released"; });
  });

  DB.equipment.forEach(e=>{
    if(!stor(e.storage_id)) add(true,"Equipment in a deleted storage",
      `${CATS[e.category]||e.category} ×${e.quantity} (#${e.id}) points to storage #${e.storage_id}, which does not exist.`,null,{view:"equipment",q:String(e.id)});
    if(!CATS[e.category]) add(false,"Unknown equipment category",`Item #${e.id} has category "${e.category}".`,()=>{ e.category="other"; });
    if(!(+e.quantity>=1)) add(false,"Invalid quantity",`Item #${e.id} has quantity "${e.quantity}".`,()=>{ e.quantity=1; });
  });

  DB.storages.forEach(s=>{
    if(!STATUS[s.status]) add(true,"Unknown storage status",`${s.storage_number} has status "${s.status}" — the app will crash on it.`,()=>{ s.status="attention"; });
    if(s.room_id!=null && !room(s.room_id)) add(true,"Storage points to a deleted room",`${s.storage_number} → room #${s.room_id}, which does not exist.`,()=>{ s.room_id=null; });
    const items=eqCount(s.id);
    if(s.status==="available" && items>0) add(false,"Available storage holds equipment",`${s.storage_number} is marked Available but holds ${items} items.`,()=>{ s.status="occupied"; });
    if(s.status==="available" && s.room_id!=null && room(s.room_id)) add(false,"Available storage has a room",`${s.storage_number} is Available but still linked to room ${room(s.room_id).room_number}.`,()=>{ s.status="preparing"; });
    if(["occupied","ready","guest_using"].includes(s.status) && s.room_id==null && !items && !cardsOfStorage(s.id).length)
      add(false,"Empty storage marked in use",`${s.storage_number} is "${STATUS[s.status]}" with no room, cards or equipment.`,()=>{ s.status="available"; });
    if(!s.room_id && items) add(false,"Equipment without a room",`${s.storage_number} holds ${items} items but no room is assigned — guests can't find it by room.`,null,{view:"trace",q:s.storage_number});
    if(!s.section) add(false,"Storage without area",`${s.storage_number} has no area; it won't appear on the map.`,()=>{ s.section="Unassigned area"; });
  });

  DB.rooms.forEach(r=>{
    if(r.status==="checked_out" && storagesOfRoom(r.id).length) add(false,"Checked-out room still owns storage",
      `Room ${r.room_number} is checked out but still has ${storagesOfRoom(r.id).map(s=>s.storage_number).join(", ")}.`,()=>{ r.status="staying"; });
    if(r.room_number==null||String(r.room_number).trim()==="") add(false,"Room without number",`Room record #${r.id} has no number.`,null,{view:"rooms",q:String(r.id)});
  });

  if(!staffAcc()?.pin_set) add(true,"Staff PIN not set","Valets cannot sign in to the app.",null,{view:"users"});
  return out;
}

const V = {};
const NAV = [
  ["overview","Overview"],["trace","Trace / find"],["rooms","Rooms"],["storages","Storages"],["map","Storage map"],
  ["cards","Key cards"],["equipment","Equipment"],["users","Staff & access"],["history","History"],["analytics","Analytics"],["data","Backup & data"]
];
function go(v,p={}){ view=v; params=p; render(); window.scrollTo(0,0); }
function render(){
  if(!SESSION){ $("#app").innerHTML=viewLogin(); return; }
  const issues=checkIntegrity().length;
  const counts={rooms:DB.rooms.length,storages:DB.storages.length,cards:DB.cards.length,equipment:DB.equipment.length,history:DB.history.length};
  const fn=V[view]||V.overview;
  const out=fn(params);
  $("#app").innerHTML=`
    <header class="topbar">
      <div class="brand"><b>Ski Valet</b><span>Admin console</span></div>
      <div class="sp"></div>
      <a class="btn sm ghost hide-sm" href="index.html">Open valet app</a>
      <div class="who">${esc(SESSION.name)}</div>
      <button class="btn sm" data-act="signout">Sign out</button>
    </header>
    <div class="layout">
      <nav class="side">${NAV.map(([k,l])=>`<button class="${view===k?"on":""}" data-act="go" data-view="${k}">${l}
        ${k==="overview"&&issues?`<span class="cnt bad">${issues}</span>`:counts[k]!=null?`<span class="cnt">${counts[k]}</span>`:""}</button>`).join("")}</nav>
      <main>${out.body}</main>
    </div>`;
  if(out.after) out.after();
}

/* ---------- login ---------- */
let busy=false;
function viewLogin(){
  return `<div class="login">
    <div class="a">Ski Valet</div><div class="b">Admin</div><div class="c">Back-office for fixing storage records</div>
    <label class="f"><span>Username</span><input class="input" id="lUser" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus></label>
    <label class="f"><span>Password</span><input class="input" id="lPass" type="password" autocomplete="current-password"></label>
    <button class="btn primary" style="width:100%" data-act="login">Sign in</button>
    <p class="dim tiny" style="margin-top:14px">Same admin login as the valet app.</p>
  </div>`;
}
async function doLogin(){
  if(!$("#lUser")||busy) return; busy=true;
  const u=$("#lUser").value, p=$("#lPass").value;
  try{
    const r=await API("/api/login/admin",{username:u,password:p});
    await SkiSync.start();
    SESSION=user(r.user.id)||r.user;
    log("Admin console opened",{}); save(); go("overview");
  }catch(e){ toast(e.message,"err"); const f=$("#lPass"); if(f) f.value=""; }
  finally{ busy=false; }
}
async function signOut(){
  closeSheet(); SESSION=null; AN={key:null,rows:null,from:0,oldest:null,total:null,truncated:false,err:null,loading:null}; AN_H=null;
  if(SkiSync.pending()){ try{ await SkiSync.save(); }catch(_){} }
  SkiSync.stop(); DB=normalise(null);
  try{ await API("/api/logout",{}); }catch(_){}
  render();
}

    <div class="searchbar" style="margin-bottom:16px">🔎<input id="ovQ" placeholder="Find equipment: card code, room, guest, storage or item…" autocomplete="off"></div>

      ${S(DB.rooms.length,"Rooms","var(--signal)","rooms")}

      ||`<div class="panel muted" style="text-align:center">No broken links. Every card, storage and item points to something that exists.</div>`}
    <h2 class="sec">Latest activity</h2>

/* ---------- trace ---------- */
function histEvent(h){
  const bits=[];
  if(h.room_id!=null) bits.push("Room "+(room(h.room_id)?.room_number||"#"+h.room_id+" (deleted)"));
  if(h.storage_id!=null) bits.push(stor(h.storage_id)?.storage_number||"storage #"+h.storage_id+" (deleted)");
  if(h.key_card_id!=null) bits.push("Card "+(card(h.key_card_id)?.card_code||"#"+h.key_card_id+" (deleted)"));
  if(h.prev&&h.next) bits.push(h.prev+" → "+h.next); else if(h.next) bits.push("→ "+h.next);
  if(h.notes) bits.push(h.notes);
  return `<div class="hev ${String(h.action).startsWith("[Admin]")?"adm":""}"><div class="t">${fmtDT(h.timestamp)} · ${esc(user(h.user_id)?.name||"System")}</div>
    <b>${esc(h.action)}</b><p>${esc(bits.join(" · "))}</p></div>`;
}
function traceStorage(s, why){
  const r=room(s.room_id), cards=cardsOfStorage(s.id), eq=eqOf(s.id);
  const roomCards = r ? cardsOfRoom(r.id).filter(c=>c.storage_id!==s.id) : [];
  const ids={s:s.id,r:s.room_id,c:new Set([...cards,...roomCards].map(c=>c.id))};
  const hist=DB.history.filter(h=>h.storage_id===ids.s||(ids.r!=null&&h.room_id===ids.r)||ids.c.has(h.key_card_id)).slice(0,12);
  return `<div class="panel" style="margin-bottom:12px">
    <div class="row"><span class="eyebrow dim tiny grow">${esc(why)}</span>
      <button class="btn sm" data-act="edit" data-col="storages" data-id="${s.id}">Edit storage</button>
      ${r?`<button class="btn sm" data-act="edit" data-col="rooms" data-id="${r.id}">Edit room</button>`:""}</div>
    <div class="chain">
      ${cards.length?cards.map(c=>`<div class="node"><small>Key card · ${esc(c.status)}</small><b class="mono">${esc(c.card_code)}</b></div>`).join("")
        :`<div class="node missing"><small>Key card</small><b>none</b></div>`}
      <span class="arrow">→</span>
      <div class="node ${s.room_id!=null&&!r?"missing":""}"><small>Room</small><b>${r?esc(r.room_number)+(r.guest_name?" · "+esc(r.guest_name):""):s.room_id!=null?"deleted #"+s.room_id:"—"}</b></div>
      <span class="arrow">→</span>
      <div class="node"><small>Storage · ${esc(s.section||"")}</small><b>${esc(s.storage_number)}</b> ${chip(s.status,STATUS[s.status]||s.status)}</div>
      <span class="arrow">→</span>
      <div class="node"><small>Equipment</small><b>${eq.length?eq.map(e=>`${esc(CATS[e.category]||e.category)} ×${esc(e.quantity)}`).join(", "):"empty"}</b></div>
    </div>
    ${roomCards.length?`<div class="issue"><div class="grow"><b>Room cards not linked to this storage</b>
      <p>${roomCards.map(c=>`${esc(c.card_code)} → ${c.storage_id?esc(stor(c.storage_id)?.storage_number||"deleted #"+c.storage_id):"no storage"}`).join(" · ")}</p></div>
      <button class="btn sm" data-act="link-room-cards" data-id="${s.id}">Link them here</button></div>`:""}
    <div class="hist" style="margin-top:12px">${hist.map(histEvent).join("")||`<div class="dim tiny">No history for this chain.</div>`}</div>
  </div>`;
}
/* Click any row → everything behind it, without hunting for the room/storage link. */
function openDetail(col,id){
  const rec=DB[col]&&DB[col].find(x=>x.id===id); if(!rec) return;
  const H = list => `<div class="hist">${list.slice(0,15).map(histEvent).join("")||`<div class="dim tiny">No history.</div>`}</div>`;
  const kv = (k,v) => `<div class="row"><span class="grow muted">${k}</span><b>${v}</b></div>`;
  let title="", sub="", body="";
  if(col==="storages"){
    title=rec.storage_number; sub=`${esc(rec.section||"Unassigned area")} · ${STATUS[rec.status]||esc(rec.status)}`;
    body=traceStorage(rec,"Storage");
  } else if(col==="rooms"){
    const sts=storagesOfRoom(rec.id), cs=cardsOfRoom(rec.id);
    title="Room "+rec.room_number; sub=`${esc(rec.guest_name||"No guest name")} · ${ROOM_STATUS[rec.status]||esc(rec.status||"staying")}`;
    body=`<div class="panel tiny" style="margin-bottom:12px">
        ${kv("Departure",esc(rec.departure||"—"))}${kv("Key cards",cs.map(c=>`<span class="mono">${esc(c.card_code)}</span>`).join(", ")||"—")}
        ${kv("Storages",sts.map(s=>esc(s.storage_number)).join(", ")||"—")}${kv("Items",sts.reduce((a,s)=>a+eqCount(s.id),0))}</div>
      ${sts.map(s=>traceStorage(s,"Storage "+s.storage_number)).join("")
        ||`<div class="panel" style="margin-bottom:12px"><p class="muted tiny" style="margin:0 0 10px">No storage is linked to this room.</p>${H(DB.history.filter(h=>h.room_id===rec.id))}</div>`}`;
  } else if(col==="cards"){
    const st=stor(rec.storage_id), r=room(rec.room_id);
    title="Card "+rec.card_code; sub=`${CARD_STATUS[rec.status]||esc(rec.status)} · ${r?"Room "+esc(r.room_number):"no room"}`;
    body=st?traceStorage(st,`Card ${rec.card_code} opens this storage`)
      :`<div class="panel" style="margin-bottom:12px">${kv("Room",r?esc(r.room_number):rec.room_id!=null?`<span class="warn">deleted #${esc(rec.room_id)}</span>`:"—")}
        ${kv("Storage",rec.storage_id!=null?`<span class="warn">deleted #${esc(rec.storage_id)}</span>`:"none")}
        ${rec.status==="released"?kv("Released",ago(rec.released_at)):""}<div style="margin-top:10px">${H(DB.history.filter(h=>h.key_card_id===rec.id))}</div></div>`;
  } else if(col==="equipment"){
    const st=stor(rec.storage_id);
    title=(CATS[rec.category]||rec.category)+" ×"+rec.quantity; sub=[rec.size,rec.type,rec.description].filter(Boolean).map(esc).join(" · ")||"No size or type";
    body=st?traceStorage(st,"Stored in "+st.storage_number)
      :`<div class="issue hot"><div class="grow"><b>Orphan item</b><p>Its storage #${esc(rec.storage_id)} no longer exists.</p></div></div>`;
  } else if(col==="users"){
    const mine=DB.history.filter(h=>h.user_id===rec.id);
    title=rec.name; sub=`${rec.shared?(rec.shared==="admin"?"Admin login":"Shared staff account"):rec.archived?"Removed staff member":"Staff member"} · ${mine.length} actions`;
    body=`<div class="panel">${H(mine)}</div>`;
  }
  const canEdit=SCHEMA[col]&&!(col==="users");
  openSheet(`<h3>${esc(title)}</h3><p class="sub">${sub}</p>${body}
    <div class="foot">
      ${canEdit?`<button class="btn danger" data-act="del" data-col="${col}" data-id="${id}">Delete</button>`:""}
      <span class="grow"></span><button class="btn" data-act="close">Close</button>
      ${canEdit?`<button class="btn primary" data-act="edit" data-col="${col}" data-id="${id}">Edit</button>`:""}
      ${col==="users"&&!rec.shared?`<button class="btn primary" data-act="edit-member" data-id="${id}">Edit</button>`:""}</div>`,true);
}
V.trace = (p) => {
  const q=(p.q||"").trim();
  return {body:`
    <h1>Trace equipment</h1>
    <p class="lead">Search by card code, room, guest, storage or item. Shows the full chain card → room → storage → equipment, what is broken in it, and the history — including records that were already deleted or released.</p>
    <div class="searchbar">🔎<input id="tQ" value="${esc(q)}" placeholder="Card code, room, guest, storage or item" autocomplete="off"></div>
    <div id="tOut" style="margin-top:16px"></div>`,
  after(){
    const i=$("#tQ"); i.focus(); i.setSelectionRange(i.value.length,i.value.length);
    const draw=()=>{ params.q=i.value; $("#tOut").innerHTML=traceHTML(i.value.trim()); };
    let t; i.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(draw,150); }); draw();
  }};
};
function traceHTML(q){
  if(!q) return `<div class="dim" style="text-align:center;padding:30px">Type something to search.</div>`;
  const L=q.toLowerCase(), N=normCode(q), out=[], shown=new Set();
  const cards=N.length>2?DB.cards.filter(c=>normCode(c.card_code).includes(N)):[];
  const rooms=DB.rooms.filter(r=>String(r.room_number).toLowerCase()===L||(L.length>1&&(r.guest_name||"").toLowerCase().includes(L))||(L.length>1&&String(r.room_number).toLowerCase().includes(L)));
  const sts=DB.storages.filter(s=>String(s.storage_number).toLowerCase().includes(L)||normCode(s.storage_number)===N);
  const eqs=DB.equipment.filter(e=>[CATS[e.category],e.category,e.type,e.size,e.description].join(" ").toLowerCase().includes(L));

  // cards first — that's what the valet scanned
  cards.forEach(c=>{
    if(c.storage_id!=null && stor(c.storage_id)){ const s=stor(c.storage_id); if(!shown.has(s.id)){ shown.add(s.id); out.push(traceStorage(s,`Card ${c.card_code} opens this storage`)); } return; }
    const lr=room(c.last_room_id), ls=stor(c.last_storage_id);
    out.push(`<div class="panel" style="margin-bottom:12px">
      <div class="row"><b class="mono grow" style="font-size:18px">${esc(c.card_code)}</b>${chip(c.status||"bad",CARD_STATUS[c.status]||c.status)}
        <button class="btn sm" data-act="edit" data-col="cards" data-id="${c.id}">Edit card</button></div>
      <div class="chain">
        <div class="node"><small>Key card</small><b class="mono">${esc(c.card_code)}</b></div><span class="arrow">→</span>
        <div class="node ${c.room_id!=null&&!room(c.room_id)?"missing":""}"><small>Room</small><b>${c.room_id==null?"—":room(c.room_id)?esc(room(c.room_id).room_number):"deleted #"+c.room_id}</b></div><span class="arrow">→</span>
        <div class="node missing"><small>Storage</small><b>${c.storage_id==null?"none":"deleted #"+c.storage_id}</b></div>
      </div>
      <p class="muted tiny" style="margin:0">${c.status==="released"
        ?`Released ${ago(c.released_at)}${lr||ls?` — last used by ${lr?"room "+esc(lr.room_number):""}${ls?" in "+esc(ls.storage_number):""}`:""}. Scanning it in the app starts a new registration.`
        :"This card is not linked to any existing storage, so a scan cannot show equipment. Edit the card to link a storage."}</p>
      <div class="hist" style="margin-top:10px">${DB.history.filter(h=>h.key_card_id===c.id).slice(0,8).map(histEvent).join("")}</div>
    </div>`);
  });
  rooms.forEach(r=>{
    const sts=storagesOfRoom(r.id);
    sts.forEach(s=>{ if(!shown.has(s.id)){ shown.add(s.id); out.push(traceStorage(s,`Room ${r.room_number}${r.guest_name?" · "+r.guest_name:""}`)); } });
    if(!sts.length) out.push(`<div class="panel" style="margin-bottom:12px"><div class="row"><b class="grow" style="font-family:var(--display);font-size:20px">Room ${esc(r.room_number)} ${r.guest_name?"· "+esc(r.guest_name):""}</b>
      ${chip(r.status||"staying",ROOM_STATUS[r.status]||r.status)}<button class="btn sm" data-act="edit" data-col="rooms" data-id="${r.id}">Edit room</button></div>
      <p class="muted tiny">No storage is linked to this room. Cards: ${cardsOfRoom(r.id).map(c=>esc(c.card_code)).join(", ")||"none"}.</p>
      <div class="hist">${DB.history.filter(h=>h.room_id===r.id).slice(0,8).map(histEvent).join("")||`<div class="dim tiny">No history.</div>`}</div></div>`);
  });
  sts.forEach(s=>{ if(!shown.has(s.id)){ shown.add(s.id); out.push(traceStorage(s,"Storage number match")); } });
  eqs.forEach(e=>{ const s=stor(e.storage_id);
    if(s){ if(!shown.has(s.id)){ shown.add(s.id); out.push(traceStorage(s,`Holds ${CATS[e.category]||e.category}${e.size?" "+e.size:""}`)); } }
    else out.push(`<div class="issue hot"><div class="grow"><b>Orphan item #${e.id}</b><p>${esc(CATS[e.category]||e.category)} ×${esc(e.quantity)} — its storage #${esc(e.storage_id)} no longer exists.</p></div>
      <button class="btn sm" data-act="edit" data-col="equipment" data-id="${e.id}">Move to a storage</button></div>`);
  });
  // history mentions — finds records that were deleted or released
  const hm=DB.history.filter(h=>[h.action,h.notes,h.prev,h.next].join(" ").toLowerCase().includes(L)
    ||(N.length>2&&normCode(card(h.key_card_id)?.card_code||"").includes(N))).slice(0,25);
  if(hm.length) out.push(`<h2 class="sec">History mentions · ${hm.length}</h2><div class="hist">${hm.map(histEvent).join("")}</div>`);
  return out.join("")||`<div class="dim" style="text-align:center;padding:30px">No record or history entry matches “${esc(q)}”.</div>`;
}

    del(s){ const eq=eqOf(s.id), cs=cardsOfStorage(s.id);

    cols:[["Code",c=>`<b class="mono">${esc(c.card_code)}</b>`],["Status",c=>chip(c.status||"bad",CARD_STATUS[c.status]||c.status)],

function tableView(col){
  const S=SCHEMA[col];
  return (p)=>{
    const q=p.q||"", f=p.f||"";
    return {body:`
      <h1>${S.title}</h1>
      <p class="lead">${DB[col].length} records. Click a linked room or storage to trace it. Edits are logged in the history and can be undone from a snapshot.</p>
      <div class="toolbar">
        <div class="searchbar">🔎<input id="tblQ" value="${esc(q)}" placeholder="Filter ${S.title.toLowerCase()}…" autocomplete="off"></div>
        ${S.filter?`<select class="input" id="tblF"><option value="">All</option>${Object.entries(S.filter.opts).map(([v,l])=>`<option value="${v}" ${f===v?"selected":""}>${esc(l)}</option>`).join("")}</select>`:""}
        <button class="btn primary" data-act="new" data-col="${col}">+ New ${S.one}</button>
        <button class="btn ghost" data-act="csv" data-col="${col}">CSV</button>
      </div>
      <div class="tbl-wrap"><table><thead><tr>${S.cols.map(c=>`<th>${c[0]}</th>`).join("")}<th></th></tr></thead><tbody id="tblBody"></tbody></table></div>
      <div class="pager" id="tblPager"></div>`,
    after(){
      const draw=()=>{
        const q=$("#tblQ").value.trim().toLowerCase(), f=$("#tblF")?$("#tblF").value:"";
        params.q=$("#tblQ").value; params.f=f;
        const rows=[...DB[col]].filter(r=>(!f||r[S.filter.k]===f)&&(!q||S.text(r).toLowerCase().includes(q))).sort(S.sort);
        const LIM=300;
        $("#tblBody").innerHTML=rows.slice(0,LIM).map(r=>`<tr class="clk" data-act="detail" data-col="${col}" data-id="${r.id}">${S.cols.map(c=>`<td>${c[1](r)}</td>`).join("")}
          <td class="act"><button class="btn sm" data-act="edit" data-col="${col}" data-id="${r.id}">Edit</button><button class="btn sm danger" data-act="del" data-col="${col}" data-id="${r.id}">✕</button></td></tr>`).join("")
          ||`<tr><td colspan="${S.cols.length+1}" class="dim" style="text-align:center;padding:24px">Nothing matches.</td></tr>`;
        $("#tblPager").textContent=rows.length>LIM?`Showing ${LIM} of ${rows.length} — refine the filter`:`${rows.length} shown`;
      };
      $("#tblQ").addEventListener("input",draw); $("#tblF")&&$("#tblF").addEventListener("change",draw); draw();
    }};
  };
}
["rooms","storages","cards","equipment"].forEach(c=>V[c]=tableView(c));

  const areas=[...new Set(DB.storages.map(areaOf))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));

    :`<div class="panel dim">No storage locations yet. Use “Add range” to create a whole rack row.</div>`}`};

function mapRangeGo(){
  const area=$("#mrArea").value.trim()||"Unassigned area", pfx=$("#mrPfx").value.trim().toUpperCase();
  const from=parseInt($("#mrFrom").value,10), to=parseInt($("#mrTo").value,10);
  if(isNaN(from)||isNaN(to)||from<0||to<from){ toast("Check the From / To numbers","err"); return; }
  if(to-from>199){ toast("Maximum 200 locations at a time","err"); return; }
  const nums=[]; for(let i=from;i<=to;i++){ const n=pfx+i; if(!DB.storages.some(s=>normCode(s.storage_number)===normCode(n))) nums.push(n); }
  if(!nums.length){ toast("All of those numbers already exist","info"); return; }
  commit("Storage range created",()=>{ nums.forEach(n=>DB.storages.push({id:nextId(),storage_number:n,section:area,status:"available",room_id:null,created_at:now(),updated_at:now()})); },
    {action:"Storage range created",notes:`${area}: ${nums[0]} – ${nums[nums.length-1]} (${nums.length})`});
  closeSheet(); toast(nums.length+" locations created");
}
function mapRename(area){
  openSheet(`<h3>Rename area</h3><p class="sub">${esc(area)} · every location in it moves to the new name. Using an existing name merges the areas.</p>
    <label class="f"><span>New name</span><input class="input" id="mrName" value="${esc(area)}" autocomplete="off"></label>
    <div class="foot"><span class="grow"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="map-rename-go" data-area="${esc(area)}">Save</button></div>`);
  setTimeout(()=>$("#mrName")?.select(),50);
}
function mapRenameGo(area){
  const name=$("#mrName").value.trim(); if(!name){ toast("Enter a name","err"); return; }
  if(name===area){ closeSheet(); return; }
  commit("Area renamed",()=>{ DB.storages.filter(s=>areaOf(s)===area).forEach(s=>{ s.section=name; s.updated_at=now(); }); },{action:"Area renamed",notes:`${area} → ${name}`});
  closeSheet(); toast("Area renamed");
}
function mapDropFree(area){
  const rows=DB.storages.filter(s=>areaOf(s)===area&&s.status==="available"&&s.room_id==null&&!eqCount(s.id)&&!cardsOfStorage(s.id).length);
  if(!rows.length) return;
  confirmSheet(`Delete ${rows.length} free location${rows.length===1?"":"s"}`,`In ${esc(area)}: ${rows.map(s=>esc(s.storage_number)).join(", ")}. Locations in use are kept.`,"Delete",
    ()=>{ const ids=new Set(rows.map(s=>s.id)); commit("Free locations deleted",()=>{ DB.storages=DB.storages.filter(s=>!ids.has(s.id)); },{action:"Free locations deleted",notes:`${area}: ${rows.length}`}); toast(rows.length+" deleted","info"); });
}

async function setPin(){
  const v=$("#pin_staff").value.trim(), st=staffAcc();
  if(!validPin(v)){ toast("PIN must be exactly 4 digits","err"); return; }
  try{ await API("/api/admin/pin",{pin:v}); }catch(e){ toast(e.message,"err"); return; }
  if(st) st.pin_set=true;
  log("Staff PIN changed",{}); save(); render();
  toast("Staff PIN updated");
}
function addMember(){
  const name=$("#mName").value.trim(), email=$("#mMail").value.trim();
  if(!name){ toast("Enter a name","err"); return; }
  if(nameTaken(name)){ toast("That name already exists","err"); return; }
  commit("Staff member added",()=>{ DB.users.push({id:nextId(),name,email,role:"staff",created_at:now()}); },{action:"Staff member added",notes:name});
  toast(name+" added");
}
function editMember(id){
  const u=user(id); if(!u) return;
  openSheet(`<h3>Edit staff member</h3><p class="sub">id ${u.id} · ${acts0(u.id)} actions in history</p>
    <label class="f"><span>Name *</span><input class="input" id="emName" value="${esc(u.name)}"></label>
    <label class="f"><span>Email</span><input class="input" id="emMail" value="${esc(u.email||"")}"></label>
    <div class="foot"><span class="grow"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-member" data-id="${u.id}">Save</button></div>`);
}
const acts0 = id => DB.history.filter(h=>h.user_id===id).length;
function saveMember(id){
  const u=user(id), name=$("#emName").value.trim(), email=$("#emMail").value.trim(); if(!u) return;
  if(!name){ toast("Enter a name","err"); return; }
  if(nameTaken(name,u)){ toast("That name already exists","err"); return; }
  const old=u.name;
  commit("Staff member edited",()=>{ u.name=name; u.email=email; u.updated_at=now(); },{action:"Staff member edited",notes:old===name?name:`${old} → ${name}`});
  closeSheet(); toast("Saved");
}
function removeMember(id){
  const u=user(id); if(!u||u.shared) return;
  confirmSheet("Remove "+esc(u.name),"They will no longer appear at sign-in. Their history stays and they can be restored.","Remove",
    ()=>{ commit("Staff member removed",()=>{ u.archived=true; u.updated_at=now(); },{action:"Staff member removed",notes:u.name}); toast(u.name+" removed","info"); });
}
function restoreMember(id){
  const u=user(id); if(!u) return;
  if(nameTaken(u.name)){ toast("An active member already has that name","err"); return; }
  commit("Staff member restored",()=>{ delete u.archived; u.updated_at=now(); },{action:"Staff member restored",notes:u.name});
}
async function setAdminLogin(){
  const cur=$("#acCur").value, user=$("#acUser").value.trim(), p1=$("#acPass").value, p2=$("#acPass2").value;
  const err=credError(user,p1,p2); if(err){ toast(err,"err"); return; }
  try{ await API("/api/admin/login",{current:cur,username:user,password:p1,password2:p2}); }catch(e){ toast(e.message,"err"); return; }
  log("Admin login changed",{notes:user}); save(); render();
  toast("Admin login updated");
}

function fieldHTML(f,val){
  const v=val??f.def??"";
  if(f.type==="select") return `<select class="input" name="${f.k}">${f.opts().map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(v)?"selected":""}>${esc(o.l)}</option>`).join("")}</select>`;
  const dl=f.list?`list="dl_${f.k}"`:"";
  return `<input class="input" name="${f.k}" type="${f.type||"text"}" value="${esc(v)}" ${dl} autocomplete="off" ${f.type==="number"?'min="1"':""}>`
    +(f.list?`<datalist id="dl_${f.k}">${f.list().map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`:"");
}
function openForm(col,id){
  const S=SCHEMA[col], rec=id!=null?DB[col].find(x=>x.id===id):null;
  if(id!=null&&!rec){ toast("Record not found","err"); return; }
  openSheet(`<h3>${rec?"Edit":"New"} ${S.one}</h3>
    <p class="sub">${rec?`${esc(S.label(rec))} · id ${rec.id}${rec.created_at?" · created "+fmtDT(rec.created_at):""}`:"Creates the record directly in the valet data."}</p>
    <form id="frm" onsubmit="return false">${S.fields.map(f=>`<label class="f"><span>${f.l}${f.req?" *":""}</span>${fieldHTML(f,rec?rec[f.k]:undefined)}</label>`).join("")}</form>
    <div class="foot">
      ${rec?`<button class="btn ghost" data-act="raw" data-col="${col}" data-id="${rec.id}">Raw JSON</button>`:""}
      <span class="grow"></span>
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn primary" data-act="save" data-col="${col}" data-id="${rec?rec.id:""}">Save</button></div>`);
  setTimeout(()=>$("#frm .input")?.focus(),50);
}
function readForm(S){
  const v={};
  S.fields.forEach(f=>{ let x=$(`#frm [name="${f.k}"]`).value;
    if(f.type!=="select") x=x.trim();
    if(f.upper) x=x.toUpperCase();
    if(f.norm) x=normCode(x);
    if(f.num) x=x===""?null:+x;
    if(f.type==="number") x=parseInt(x,10);
    v[f.k]=x; });
  return v;
}
function saveForm(col,id){
  const S=SCHEMA[col], rec=id?DB[col].find(x=>x.id===+id):null, v=readForm(S);
  const miss=S.fields.find(f=>f.req&&(v[f.k]===""||v[f.k]==null||Number.isNaN(v[f.k])));
  if(miss){ toast(miss.l+" is required","err"); return; }
  const err=(S.unique&&S.unique(v,rec))||(S.check&&S.check(v,rec));
  if(err){ toast(err,"err"); return; }
  const diff=rec?S.fields.filter(f=>String(rec[f.k]??"")!==String(v[f.k]??"")).map(f=>`${f.l}: ${rec[f.k]??"—"} → ${v[f.k]??"—"}`):[];
  if(rec&&!diff.length){ closeSheet(); return; }
  let target=rec;
  commit(rec?`Edit ${S.label(rec)}`:`New ${S.one}`,()=>{
    if(rec){ Object.assign(rec,v); if("updated_at" in rec||col!=="users") rec.updated_at=now(); }
    else { target={id:nextId(),...v,created_at:now()};
      if(col!=="users") target.updated_at=now();
      if(col==="equipment") target.status="stored";
      if(col==="cards") target.last_scanned_at=null;
      DB[col].push(target); }
    // keep the app's invariants: a card linked to a storage follows its room
    if(col==="cards"&&target.storage_id!=null&&target.room_id==null&&stor(target.storage_id)?.room_id!=null) target.room_id=stor(target.storage_id).room_id;
    if(col==="cards"&&target.status==="released"){
      // the app only reuses a released card when it is linked to nothing
      if(target.room_id!=null) target.last_room_id=target.room_id;
      if(target.storage_id!=null) target.last_storage_id=target.storage_id;
      target.room_id=null; target.storage_id=null;
      if(!rec||rec.status!=="released"||!target.released_at) target.released_at=now(); }
    if(col==="cards"&&target.status==="active") target.released_at=null;
    if(col==="storages"&&target.room_id!=null&&target.status==="available") target.status="preparing";
    if(col==="equipment"){ const s=stor(target.storage_id); if(s&&s.status==="available"){ s.status="occupied"; s.updated_at=now(); } }
    if(col==="rooms"&&target.status==="staying"&&!rec) target.updated_at=now();
  },()=>({action:rec?`${S.one[0].toUpperCase()+S.one.slice(1)} edited`:`${S.one[0].toUpperCase()+S.one.slice(1)} created`,
     ...refsOf(col,target||v),notes:rec?diff.join(" · "):S.label(target)}));
  closeSheet(); toast("Saved");
}
function refsOf(col,r){
  if(!r) return {};
  if(col==="rooms") return {room_id:r.id??null};
  if(col==="storages") return {storage_id:r.id??null,room_id:r.room_id??null};
  if(col==="cards") return {key_card_id:r.id??null,room_id:r.room_id??null,storage_id:r.storage_id??null};
  if(col==="equipment") return {equipment_id:r.id??null,storage_id:r.storage_id??null,room_id:stor(r.storage_id)?.room_id??null};
  return {};
}
function askDelete(col,id){
  const S=SCHEMA[col], rec=DB[col].find(x=>x.id===id); if(!rec) return;
  const d=S.del(rec);
  if(d.block){ toast(d.block,"err"); return; }
  openSheet(`<h3 style="color:var(--st-attention)">Delete ${esc(S.label(rec))}</h3>
    <p class="sub">${esc(d.warn||"This record will be removed.")} A snapshot is taken first, so it can be restored.</p>
    <div class="foot"><button class="btn" data-act="close">Cancel</button>
      <button class="btn danger" data-act="do-del" data-col="${col}" data-id="${id}">Delete</button></div>`);
}
function doDelete(col,id){
  const S=SCHEMA[col], rec=DB[col].find(x=>x.id===id); if(!rec) return;
  const d=S.del(rec), label=S.label(rec), refs=refsOf(col,rec);
  commit(`Delete ${label}`,()=>d.run(),{action:`${S.one[0].toUpperCase()+S.one.slice(1)} deleted`,...refs,notes:label});
  closeSheet(); toast("Deleted");
}
function openRaw(col,id){
  const rec=DB[col].find(x=>x.id===id);
  openSheet(`<h3>Raw record</h3><p class="sub">${col} · id ${id}. Edit any field — must stay valid JSON and keep the same id.</p>
    <textarea class="input code" id="rawRec" style="min-height:40vh" spellcheck="false">${esc(JSON.stringify(rec,null,2))}</textarea>
    <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-raw" data-col="${col}" data-id="${id}">Save record</button></div>`);
}
function saveRaw(col,id){
  let v; try{ v=JSON.parse($("#rawRec").value); }catch(e){ toast("Invalid JSON: "+e.message,"err"); return; }
  if(!v||typeof v!=="object"||Array.isArray(v)||v.id!==id){ toast("Must be an object with id "+id,"err"); return; }
  const rec=DB[col].find(x=>x.id===id);
  commit(`Raw edit ${col} #${id}`,()=>{ Object.keys(rec).forEach(k=>delete rec[k]); Object.assign(rec,v); },
    {action:"Raw record edited",...refsOf(col,v),notes:`${col} #${id}`});
  closeSheet(); toast("Record saved");
}
function toCSV(col){
  const rows=DB[col]; if(!rows.length){ toast("Nothing to export","info"); return; }
  const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const cell=v=>{ const s=v==null?"":typeof v==="object"?JSON.stringify(v):String(v); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  download(`skivalet-${col}-${stamp()}.csv`,[keys.join(","),...rows.map(r=>keys.map(k=>cell(r[k])).join(","))].join("\n"),"text/csv");
}

/* ---------- analytics ----------
   Everything is computed from the audit trail the valet app already writes, plus
   the current hall state — no extra tracking is needed in index.html.
   The console's normal sync only holds the latest 5,000 history rows, so the page
   fetches the full window from /api/admin/analytics and merges in live rows that
   arrive through SkiSync afterwards. If that call fails it falls back to DB.history. */
const AN_KIND = {
  "Equipment checked in":"checkin", "Equipment checked out":"handout",
  "Equipment returned":"return",     "Checked out & released":"depart",
  "Key card registered":"arrive",    "Key card reused":"arrive",
  "Key card scanned":"scan",         "Signed in":"signin",
  "Storage cleared":"clear"
};
const AN_FLOW = [["checkin","Check-ins","var(--glacier)"],["handout","Hand-outs","var(--st-guest)"],
                 ["return","Returns","var(--st-ready)"],["depart","Departures","var(--signal)"]];
const AN_OPS = new Set(["checkin","handout","return","depart","arrive","scan"]);   // "movements" at the desk
const AN_RANGES = [["today","Today"],["7","7 days"],["30","30 days"],["all","Season"]];
const DAYMS = 864e5, WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const anKind = h => AN_KIND[h.action] || null;
const sod = ts => { const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
const pad2 = n => String(n).padStart(2,"0");
const dKey = ts => { const d=new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const wdIdx = ts => (new Date(ts).getDay()+6)%7;          // Monday = 0
const anMean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const anMedian = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), i=s.length>>1; return s.length%2?s[i]:(s[i-1]+s[i])/2; };
/* "Skis ×2, Poles ×1 · 2 cards released" → [["Skis",2],["Poles",1]] */
function anItems(notes){
  return String(notes||"").split(" · ")[0].split(",")
    .map(x=>x.trim().match(/^(.+?)\s*×\s*(\d+)$/)).filter(Boolean).map(m=>[m[1],+m[2]]);
}
function fmtDur(ms){
  if(ms==null||!isFinite(ms)) return "—";
  const m=Math.round(ms/6e4); if(m<60) return m+" min";
  if(m<1440) return Math.floor(m/60)+"h "+pad2(m%60)+"m";
  return (m/1440).toFixed(1)+" days";
}
let AN = {key:null, rows:null, from:0, oldest:null, total:null, truncated:false, err:null, loading:null};
let AN_H = null;                                           // merged history for the current render
const AN_LOOKBACK = 21*DAYMS;                              // extra days so stays/trips that began earlier still pair up
const anSrc = () => AN_H || DB.history;
function anHist(r){
  if(AN.key!==r || !AN.rows) return DB.history;
  const ids=new Set(AN.rows.map(h=>h.id));
  const live=DB.history.filter(h=>h.timestamp>=AN.from && !ids.has(h.id));
  return live.length ? live.concat(AN.rows) : AN.rows;
}
async function anLoad(r){
  if(AN.loading===r) return;
  const rg=anRange(r), from = r==="all" ? 0 : Math.min(rg.from, rg.pFrom??rg.from) - AN_LOOKBACK;
  AN.loading=r;
  try{
    const d=await API(`/api/admin/analytics?from=${Math.floor(from)}&to=${now()+6e4}`);
    AN={key:r, from, oldest:d.oldest, total:d.total, truncated:!!d.truncated, err:null, loading:null,
        rows:d.rows.map(([id,timestamp,user_id,action,storage_id,notes])=>({id,timestamp,user_id,action,storage_id,notes:notes||""}))};
  }catch(e){ AN={key:r, rows:null, from:0, oldest:null, total:null, truncated:false, err:e.message, loading:null}; }
  if(SESSION && view==="analytics" && (params.range||"7")===r) render();
}
function anRange(r){
  const t=now(), today=sod(t);
  if(r==="today") return {from:today,to:t,pFrom:today-DAYMS,pTo:t-DAYMS,prevLbl:"yesterday",hourly:true};
  if(r==="all"){ const oldest=AN.key==="all"&&AN.oldest!=null ? AN.oldest : anSrc().reduce((m,h)=>Math.min(m,h.timestamp||t),t);
    return {from:sod(Math.min(oldest,t)),to:t}; }
  const n=+r, from=today-(n-1)*DAYMS;
  return {from,to:t,pFrom:from-n*DAYMS,pTo:from-1,prevLbl:`prev. ${n} days`};
}
function anSummary(from,to){
  const c={checkin:0,handout:0,return:0,depart:0,arrive:0,scan:0,signin:0,items:0,actions:0,ops:0}, staff=new Set();
  const rows=anSrc().filter(h=>h.timestamp>=from&&h.timestamp<=to);
  rows.forEach(h=>{
    const k=anKind(h); if(k&&c[k]!=null) c[k]++;
    if(AN_OPS.has(k)) c.ops++;
    if(k==="checkin") c.items+=anItems(h.notes).reduce((a,[,q])=>a+q,0);
    if(!String(h.action).startsWith("[Admin]")&&h.user_id!=null){ c.actions++; staff.add(h.user_id); }
  });
  c.staff=staff.size; c.rows=rows; return c;
}
/* Pair events per storage over the whole loaded history (oldest → newest):
   stay = first check-in → final check-out; out = hand-out → return. */
function anDurations(){
  const stay=[], out=[], firstIn={}, lastOut={};
  [...anSrc()].sort((a,b)=>a.timestamp-b.timestamp).forEach(h=>{
    const k=anKind(h), s=h.storage_id; if(s==null||!k) return;
    if(k==="checkin"){ if(firstIn[s]==null) firstIn[s]=h.timestamp; }
    else if(k==="handout") lastOut[s]=h.timestamp;
    else if(k==="return"){ if(lastOut[s]!=null) out.push({end:h.timestamp,ms:h.timestamp-lastOut[s]}); lastOut[s]=null; }
    else if(k==="depart"||k==="clear"){
      if(k==="depart"&&firstIn[s]!=null) stay.push({end:h.timestamp,ms:h.timestamp-firstIn[s]});
      firstIn[s]=null; lastOut[s]=null; }
  });
  return {stay,out};
}
function anBuckets(rg){
  const list=[];
  if(rg.hourly){ for(let i=0;i<24;i++) list.push({key:i,label:`${pad2(i)}:00–${pad2(i+1)}:00`,short:pad2(i),vals:{}}); }
  else for(let d=rg.from; d<=rg.to; d+=DAYMS){ const dt=new Date(d);
    list.push({key:dKey(d),label:`${WD[wdIdx(d)]} ${dt.getDate()} ${MON[dt.getMonth()]}`,short:`${dt.getDate()} ${MON[dt.getMonth()]}`,vals:{}}); }
  const idx=Object.fromEntries(list.map((b,i)=>[b.key,i]));
  return {list,at:h=>list[idx[rg.hourly?new Date(h.timestamp).getHours():dKey(h.timestamp)]]};
}
function anBarSVG(list,W){
  const H=210, pl=34, pb=26, pt=12, n=list.length||1;
  const tot=b=>AN_FLOW.reduce((a,[k])=>a+(b.vals[k]||0),0);
  const max=Math.max(4,...list.map(tot)), y=v=>pt+(H-pt-pb)*(1-v/max);
  const step=(W-pl)/n, bw=Math.max(3,Math.min(34,step*.68)), every=Math.max(1,Math.ceil(n/Math.max(1,Math.floor((W-pl)/52))));
  let g=[...new Set([0,Math.round(max/2),max])].map(t=>
    `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--line)" ${t?'stroke-dasharray="2 4"':""}/><text x="${pl-7}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join("");
  list.forEach((b,i)=>{
    const x=pl+i*step+(step-bw)/2; let acc=0;
    const tip=`${b.label} — `+AN_FLOW.map(([k,l])=>`${l}: ${b.vals[k]||0}`).join(", ");
    AN_FLOW.forEach(([k,,c])=>{ const v=b.vals[k]||0; if(!v) return;
      g+=`<rect x="${x}" y="${y(acc+v)}" width="${bw}" height="${Math.max(1,y(acc)-y(acc+v)-1)}" rx="2" style="fill:${c}"/>`; acc+=v; });
    g+=`<rect x="${pl+i*step}" y="${pt}" width="${step}" height="${H-pt-pb}" fill="transparent"><title>${esc(tip)}</title></rect>`;
    if(i%every===0) g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(b.short)}</text>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Activity chart">${g}</svg>`;
}
function anBars(entries,color){
  const max=Math.max(1,...entries.map(e=>e[1]));
  return `<div class="bars">${entries.map(([l,v,sub])=>`<div class="br"><span>${esc(l)}</span>
    <span class="tr"><i style="width:${(v/max*100).toFixed(1)}%;--c:${color}"></i></span><span class="n">${sub??v}</span></div>`).join("")}</div>`;
}
function anCSV(){
  AN_H=anHist(params.range||"7");
  const rg=anRange(params.range||"7"), out=[["date","check_ins","items_checked_in","hand_outs","returns","departures","cards_registered","card_scans","sign_ins","active_staff","staff_actions"]];
  for(let d=sod(rg.from); d<=rg.to; d+=DAYMS){ const c=anSummary(d,d+DAYMS-1);
    out.push([dKey(d),c.checkin,c.items,c.handout,c.return,c.depart,c.arrive,c.scan,c.signin,c.staff,c.actions]); }
  download(`skivalet-analytics-${stamp()}.csv`,out.map(r=>r.join(",")).join("\n"),"text/csv");
}

V.analytics = (p) => {
  const r=p.range||"7"; AN_H=anHist(r);
  const fresh=AN.key===r&&AN.rows, failed=AN.key===r&&AN.err;
  const rg=anRange(r), cur=anSummary(rg.from,rg.to), prev=rg.pFrom!=null?anSummary(rg.pFrom,rg.pTo):null;
  const delta=k=>{ if(!prev) return ""; const a=cur[k], b=prev[k];
    if(!b) return `<span class="dl ${a?"up":""}">${a?"▲ new":"—"} vs ${rg.prevLbl}</span>`;
    const d=Math.round((a-b)/b*100);
    return `<span class="dl ${d>0?"up":d<0?"dn":""}">${d>0?"▲":d<0?"▼":"="} ${Math.abs(d)}% vs ${rg.prevLbl}</span>`; };
  const T=(k,n,l,c)=>`<div class="stat" style="--c:${c}"><b>${n}</b><span>${l}</span>${k?delta(k):""}</div>`;

  /* durations that finished inside the range */
  const D=anDurations(), inR=x=>x.end>=rg.from&&x.end<=rg.to;
  const stays=D.stay.filter(inR).map(x=>x.ms), outs=D.out.filter(inR).map(x=>x.ms);

  /* heatmap weekday × hour, staff, equipment mix */
  const heat=Array.from({length:7},()=>Array(24).fill(0)), staff={}, mix={};
  cur.rows.forEach(h=>{
    const k=anKind(h), adm=String(h.action).startsWith("[Admin]");
    if(AN_OPS.has(k)){ const d=new Date(h.timestamp); heat[wdIdx(h.timestamp)][d.getHours()]++; }
    if(!adm&&h.user_id!=null){ const s=staff[h.user_id]||(staff[h.user_id]={id:h.user_id,total:0,last:0});
      s.total++; if(k) s[k]=(s[k]||0)+1; s.last=Math.max(s.last,h.timestamp); }
    if(h.action==="Equipment checked in"||h.action==="Equipment added") anItems(h.notes).forEach(([l,q])=>mix[l]=(mix[l]||0)+q);
  });
  const hmax=Math.max(1,...heat.flat());
  const hourTot=Array(24).fill(0); heat.forEach(row=>row.forEach((v,i)=>hourTot[i]+=v));
  const peakH=hourTot.indexOf(Math.max(...hourTot));
  const byDay={}; cur.rows.forEach(h=>{ if(AN_OPS.has(anKind(h))) byDay[dKey(h.timestamp)]=(byDay[dKey(h.timestamp)]||0)+1; });
  const busiest=Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  const staffRows=Object.values(staff).sort((a,b)=>b.total-a.total);

  /* live state */
  const inUse=DB.storages.filter(s=>s.status!=="available"&&s.status!=="closed"), open=DB.storages.filter(s=>s.status!=="closed");
  const areas=[...new Set(DB.storages.map(areaOf))].sort().map(a=>{ const all=DB.storages.filter(s=>areaOf(s)===a&&s.status!=="closed"), u=all.filter(s=>s.status!=="available");
    return [a,u.length,`${u.length}/${all.length}`]; });
  const util=open.length?Math.round(inUse.length/open.length*100):0;

  const oldest=fresh&&AN.oldest!=null ? AN.oldest : DB.history.reduce((m,h)=>Math.min(m,h.timestamp||Infinity),Infinity);
  const src = fresh
    ? `${AN.total} records in the database${isFinite(oldest)?`, oldest ${fmtDT(oldest)}`:""}.
       ${AN.truncated?`<span style="color:var(--st-preparing)">This period is very large, so only the newest rows were loaded.</span>`:""}`
    : failed
    ? `<span style="color:var(--st-preparing)">Couldn't load the full history from the server (${esc(AN.err)}) — showing the latest ${DB.history.length} records held by this console.</span>`
    : `<span class="dim">Loading full history from the database…</span>`;
  const ins=(v,l)=>`<div class="insight"><b>${v}</b><span class="muted">${l}</span></div>`;
  const dayLbl=k=>{ const [y,m,d]=k.split("-").map(Number), dt=new Date(y,m-1,d); return `${WD[wdIdx(dt)]} ${d} ${MON[m-1]}`; };

  return {body:`
    <h1>Analytics</h1>
    <p class="lead">How the valet desk is being used — built from the activity history the app already records.
      ${src}</p>
    <div class="toolbar">
      <div class="seg">${AN_RANGES.map(([k,l])=>`<button class="${k===r?"on":""}" data-act="an-range" data-r="${k}">${l}</button>`).join("")}</div>
      <span class="grow"></span>
      <button class="btn ghost" data-act="an-csv">Daily CSV</button>
    </div>

    <div class="stats an4">
      ${T("checkin",cur.checkin,"Check-ins","var(--glacier)")}
      ${T("items",cur.items,"Items checked in","var(--st-occupied)")}
      ${T("handout",cur.handout,"Hand-outs","var(--st-guest)")}
      ${T("return",cur.return,"Returns","var(--st-ready)")}
      ${T("depart",cur.depart,"Departures","var(--signal)")}
      ${T("arrive",cur.arrive,"Cards registered","var(--mist)")}
      ${T("scan",cur.scan,"Card scans","var(--dim)")}
      ${T("staff",cur.staff,"Active staff","var(--st-preparing)")}
    </div>

    <h2 class="sec">Desk activity · ${rg.hourly?"by hour":"by day"}</h2>
    <div class="panel">
      <div class="an-legend">${AN_FLOW.map(([,l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>
      <div class="an-chart" id="anChart"></div>
    </div>

    <div class="grid2">
      <div>
        <h2 class="sec">Key numbers</h2>
        <div class="panel">
          ${ins(busiest?dayLbl(busiest[0]):"—",busiest?`busiest day · ${busiest[1]} movements`:"busiest day")}
          ${ins(cur.ops?`${pad2(peakH)}:00–${pad2(peakH+1)}:00`:"—",cur.ops?`peak hour · ${Math.round(hourTot[peakH]/cur.ops*100)}% of movements`:"peak hour")}
          ${ins(fmtDur(anMedian(stays)),`typical stay, check-in → final check-out${stays.length?` · ${stays.length} stays, avg ${fmtDur(anMean(stays))}`:""}`)}
          ${ins(fmtDur(anMedian(outs)),`typical time out with guest, hand-out → return${outs.length?` · ${outs.length} trips`:""}`)}
          ${ins(cur.checkin?(cur.items/cur.checkin).toFixed(1):"—","items per check-in")}
          ${ins(cur.signin,"staff sign-ins")}
        </div>
      </div>
      <div>
        <h2 class="sec">Right now · ${util}% in use</h2>
        <div class="panel">
          <div class="row" style="margin-bottom:12px;gap:18px">
            <span class="muted tiny"><b style="color:var(--frost)">${inUse.length}</b> of ${open.length} storages in use</span>
            <span class="muted tiny"><b style="color:var(--frost)">${DB.storages.filter(s=>s.status==="guest_using").length}</b> with guests</span>
            <span class="muted tiny"><b style="color:var(--frost)">${DB.equipment.reduce((a,e)=>a+(+e.quantity||0),0)}</b> items stored</span>
          </div>
          ${areas.length?anBars(areas,"var(--glacier)"):`<div class="dim">No storage locations yet.</div>`}
        </div>
      </div>
    </div>

    <h2 class="sec">When the desk is busy · weekday × hour</h2>
    <div class="panel an-chart">
      <div class="heat">
        <span></span>${Array.from({length:24},(_,i)=>`<span class="hh">${i%3===0?pad2(i):""}</span>`).join("")}
        ${heat.map((row,d)=>`<span class="hl">${WD[d]}</span>${row.map((v,h)=>`<span class="hc" title="${WD[d]} ${pad2(h)}:00 · ${v} movement${v===1?"":"s"}"
          style="${v?`opacity:${(.15+.85*v/hmax).toFixed(2)}`:"background:var(--slab2)"}"></span>`).join("")}`).join("")}
      </div>
    </div>

    <div class="grid2">
      <div>
        <h2 class="sec">Staff activity</h2>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Staff</th><th class="num">In</th><th class="num">Out</th><th class="num">Back</th><th class="num">Dep.</th><th class="num">Total</th><th>Last active</th></tr></thead>
          <tbody>${staffRows.map(s=>{ const n=user(s.id)?.name||"#"+s.id;
            return `<tr><td><span class="lnk" data-act="go" data-view="history" data-q="${esc(n)}">${esc(n)}</span></td>
              <td class="num">${s.checkin||0}</td><td class="num">${s.handout||0}</td><td class="num">${s.return||0}</td><td class="num">${s.depart||0}</td>
              <td class="num"><b>${s.total}</b></td><td class="muted">${ago(s.last)}</td></tr>`; }).join("")
            ||`<tr><td colspan="7" class="dim">No staff activity in this period.</td></tr>`}</tbody>
        </table></div>
      </div>
      <div>
        <h2 class="sec">Equipment checked in</h2>
        <div class="panel">${Object.keys(mix).length?anBars(Object.entries(mix).sort((a,b)=>b[1]-a[1]),"var(--st-occupied)"):`<div class="dim">No equipment checked in during this period.</div>`}</div>
      </div>
    </div>`,
  after(){
    if(AN.key!==r && AN.loading!==r) anLoad(r);
    const el=$("#anChart"); if(!el) return;
    const B=anBuckets(rg);
    cur.rows.forEach(h=>{ const k=anKind(h), b=B.at(h); if(b&&AN_FLOW.some(([f])=>f===k)) b.vals[k]=(b.vals[k]||0)+1; });
    el.innerHTML=anBarSVG(B.list,Math.max(el.clientWidth||600,B.list.length*12+40));
  }};
};

function validateDB(o){
  if(!o||typeof o!=="object"||Array.isArray(o)) return "Top level must be an object";
  for(const k of COLLECTIONS) if(o[k]!==undefined&&!Array.isArray(o[k])) return `"${k}" must be an array`;
  for(const k of COLLECTIONS) for(const x of (o[k]||[])) if(!x||typeof x!=="object"||x.id==null) return `Every ${k} record needs an id`;
  return null;
}
async function loadSnaps(){
  if(SkiSync.pending()) await new Promise(r=>setTimeout(r,900));   // let the snapshot of the last change land
  try{ SNAPS=(await API("/api/admin/snapshots")).snapshots; }catch(e){ SNAPS=[]; toast(e.message,"err"); }
  if(view==="data" && document.activeElement?.id!=="rawDB" && $("#modal").classList.contains("hidden")) render();
}
/* Replace everything on the server (backup restore, raw edit). The server takes
   a snapshot first, writes the new data and makes every device reload. */
async function replaceDB(next,label,notes,keepHistory){
  const err=validateDB(next); if(err){ toast(err,"err"); return false; }
  if(SkiSync.pending()){ try{ await SkiSync.save(); }catch(_){} }
  try{ await API("/api/admin/replace",{data:next,label,notes,keep_history:!!keepHistory}); AN.key=null; }
  catch(e){ toast(e.message,"err"); return false; }
  await SkiSync.reload(); SNAPS=null; render(); return true;
}
async function serverAction(path,body,okMsg){
  try{ await API(path,body||{}); await SkiSync.reload(); SNAPS=null; AN.key=null; render(); if(okMsg) toast(okMsg); }
  catch(e){ toast(e.message,"err"); }
}
function importJSON(text,name){
  let o; try{ o=JSON.parse(text); }catch(e){ toast("Not valid JSON","err"); return; }
  if(o&&o.skivalet_backup&&o.data) o=o.data;
  const err=validateDB(o); if(err){ toast(err,"err"); return; }
  openSheet(`<h3>Restore backup</h3><p class="sub">${esc(name)}</p>
    <div class="panel tiny">${COLLECTIONS.map(k=>`<div class="row"><span class="grow muted">${k}</span><b>${(o[k]||[]).length}</b><span class="dim">now ${DB[k].length}</span></div>`).join("")}</div>
    <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="doImp">Replace current data</button></div>`);
  $("#doImp").onclick=async()=>{ closeSheet(); if(await replaceDB(o,"Backup restored",name,false)) toast("Backup restored"); };
}
