document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, col=el.dataset.col, id=el.dataset.id?+el.dataset.id:null;
  switch(a){
    case "login": doLogin(); break;
    case "set-pin": setPin(); break;
    case "set-admin": setAdminLogin(); break;
    case "add-member": addMember(); break;
    case "map-cell": openDetail("storages",id); break;
    case "detail": openDetail(col,id); break;
    case "map-edit": closeSheet(); openForm("storages",id); break;
    case "map-del": closeSheet(); askDelete("storages",id); break;
    case "map-new": mapNew(el.dataset.area); break;
    case "map-range": mapRange(); break;
    case "load-layout": el.disabled=true;
      SkiSync.loadLayout().then(n=>{ toast(n?n+" locations created":"Nothing missing", n?"":"info"); render(); })
        .catch(e=>{ toast(e.message,"err"); el.disabled=false; }); break;
    case "map-range-go": mapRangeGo(); break;
    case "map-rename": mapRename(el.dataset.area); break;
    case "map-rename-go": mapRenameGo(el.dataset.area); break;
    case "map-drop-free": mapDropFree(el.dataset.area); break;
    case "edit-member": editMember(id); break;
    case "save-member": saveMember(id); break;
    case "rm-member": removeMember(id); break;
    case "restore-member": restoreMember(id); break;
    case "signout": signOut(); break;
    case "an-range": go("analytics",{range:el.dataset.r}); break;
    case "an-csv": anCSV(); break;
    case "go": go(el.dataset.view, el.dataset.q?{q:el.dataset.q}:{}); break;
    case "trace": closeSheet(); go("trace",{q:el.dataset.q}); break;
    case "close": closeSheet(); break;
    case "fix": { const i=checkIntegrity()[+el.dataset.n]; if(!i||!i.fix) break;
      commit("Fix: "+i.t,()=>i.fix(),{action:"Data repaired",notes:i.t+" — "+i.p}); toast("Fixed"); break; }
    case "fix-all": { let n=0, guard=0;
      commit("Fix all automatic issues",()=>{ let list;
        // re-check after each pass — one fix can reveal or clear another
        while((list=checkIntegrity().filter(i=>i.fix)).length && guard++<20){ list.forEach(i=>{ i.fix(); n++; }); } },
        {action:"Data repaired",notes:"Automatic repair"});
      toast(n+" fix"+(n===1?"":"es")+" applied"); break; }
    case "link-room-cards": { const s=stor(id);
      commit(`Link room cards to ${s.storage_number}`,()=>{ cardsOfRoom(s.room_id).forEach(c=>{ c.storage_id=s.id; c.status="active"; c.updated_at=now(); }); },
        {action:"Key cards linked",storage_id:s.id,room_id:s.room_id,notes:"All room cards now open "+s.storage_number}); toast("Cards linked"); break; }
    case "new": openForm(col,null); break;
    case "edit": openForm(col,id); break;
    case "save": saveForm(col,el.dataset.id); break;
    case "del": askDelete(col,id); break;
    case "do-del": doDelete(col,id); break;
    case "raw": openRaw(col,id); break;
    case "save-raw": saveRaw(col,id); break;
    case "csv": toCSV(col); break;
    case "export": API("/api/admin/export").then(b=>download(`skivalet-backup-${stamp()}.json`,JSON.stringify(b,null,2))).catch(e=>toast(e.message,"err")); break;
    case "snap-restore": { const s=(SNAPS||[]).find(x=>x.id===+el.dataset.sid); if(!s) break;
      confirmSheet("Restore snapshot",`Go back to the state before “${esc(s.label)}” (${fmtDT(s.ts)}). Changes made after it, in the app or here, are lost — the current state is snapshotted first. History is kept.`,
        "Restore",()=>serverAction(`/api/admin/snapshots/${s.id}/restore`,{},"Snapshot restored")); break; }
    case "snap-dl": { const s=(SNAPS||[]).find(x=>x.id===+el.dataset.sid); if(!s) break;
      API(`/api/admin/snapshots/${s.id}`).then(d=>download(`skivalet-snapshot-${s.ts}.json`,JSON.stringify(d,null,2))).catch(e=>toast(e.message,"err")); break; }
    case "raw-reload": render(); break;
    case "raw-save": { let o; try{ o=JSON.parse($("#rawDB").value); }catch(err){ toast("Invalid JSON: "+err.message,"err"); break; }
      replaceDB(o,"Raw database edit","Full JSON edited",true).then(ok=>{ if(ok) toast("Database saved"); }); break; }
    case "clear-history": confirmSheet("Clear history","Removes every audit record. Rooms, storages, cards and equipment stay.","Clear history",
      ()=>serverAction("/api/admin/clear-history",{},"History cleared")); break;
    case "wipe": confirmSheet("Erase all hall data","Every room, key card, storage and item is removed. Staff accounts stay.","Erase everything",
      ()=>{ commit("Erase all hall data",()=>{ DB.rooms=[]; DB.storages=[]; DB.cards=[]; DB.equipment=[]; },{action:"Hall erased"}); toast("Hall erased","info"); }); break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeSheet();
  if(e.key==="Enter"&&(e.target.id==="lUser"||e.target.id==="lPass")) doLogin();
  if(e.key==="Enter"&&(e.target.id==="mName"||e.target.id==="mMail")) addMember();
  if(e.key==="Enter"&&e.target.closest&&e.target.closest("#frm")){ const b=$('[data-act="save"]'); b&&b.click(); }
});

/* Changes from the valet app / other devices arrive through SkiSync. */
SkiSync.init({
  get: () => DB,
  set: d => { DB = normalise(d); },
  canWriteUsers: () => true,
  onRemote: () => {
    if(!SESSION) return;
    const u=user(SESSION.id); if(!u){ SkiSync._authLost(); return; } SESSION=u;
    // don't clobber a form or raw editor the admin is typing in
    if(!$("#modal").classList.contains("hidden")||(view==="data"&&document.activeElement?.id==="rawDB")) return;
    if(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    render();
  },
  onConflict: msg => { toast(msg,"info"); if(SESSION){ SESSION=user(SESSION.id)||SESSION; closeSheet(); render(); } },
  onAuthLost: () => { const was=!!SESSION; SESSION=null; DB=normalise(null); closeSheet(); render(); if(was) toast("Signed out — please sign in again","info"); }
});

/* ==========================================================================
   8. BOOT
   ========================================================================== */
(async function boot(){
  DB=normalise(null);
  try{
    const me=await API("/api/me");
    if(me.user && me.user.role==="admin"){ await SkiSync.start(); SESSION=user(me.user.id)||null; }
  }catch(e){ toast(e.message,"err"); }
  render();
})();
</script>
