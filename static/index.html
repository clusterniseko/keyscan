    <div class="list">
      ${SESSION.role==="admin"?`<button class="item" data-act="nav-sheet" data-view="users"><span class="body"><b>Access &amp; staff</b><small>Staff PIN, names, admin login</small></span><span class="arr">›</span></button>`:""}
      <button class="item" data-act="nav-sheet" data-view="history"><span class="body"><b>Activity history</b><small>Full audit trail</small></span><span class="arr">›</span></button>
      ${SESSION.role==="admin"?`<a class="item" href="admin.html" style="text-decoration:none;color:inherit"><span class="body"><b>Admin console</b><small>Fix records, trace equipment, backups</small></span><span class="arr">›</span></a>`:""}
      ${SESSION.role==="admin"?`<button class="item" data-act="nav-sheet" data-view="setup"><span class="body"><b>Hall setup</b><small>Storage locations, reset</small></span><span class="arr">›</span></button>`:""}
      <button class="item" data-act="signout"><span class="body"><b style="color:var(--st-attention)">Sign out</b><small>Lock the app</small></span></button>
    </div>`);
}

/* ==========================================================================
   15. SHEETS
   ========================================================================== */
function openSheet(html){ const m=$("#modal"); m.innerHTML=`<div class="sheet">${html}</div>`; m.classList.remove("hidden");
  m.onclick=e=>{ if(e.target===m) closeSheet(); }; }
let staleView=false;
function closeSheet(){ const m=$("#modal"); m.classList.add("hidden"); m.innerHTML="";
  if(staleView){ staleView=false; render(); } }

/* ==========================================================================
   16. EVENT DELEGATION
   ========================================================================== */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id?+el.dataset.id:null;
  switch(a){
    /* login */
    case "admin-login": adminLogin=true; pin=""; render(); setTimeout(()=>$("#alUser")?.focus(),50); break;
    case "staff-login": adminLogin=false; render(); break;
    case "admin-signin": adminSignIn(); break;
    case "pick-name": signInAs(id); break;
    case "pin-cancel": pinOk=false; pin=""; render(); break;
    case "pin": if(!busy&&pin.length<4){ pin+=el.dataset.n; $("#shell").innerHTML=viewLogin(); if(pin.length===4) setTimeout(tryLogin,120);} break;
    case "pin-del": pin=pin.slice(0,-1); $("#shell").innerHTML=viewLogin(); break;
    case "pin-clear": pin=""; $("#shell").innerHTML=viewLogin(); break;
    /* nav */
    case "back": back(); break;
    case "home": home(); break;
    case "nav": go(el.dataset.view, id?{id}:{}); break;
    case "nav-sheet": closeSheet(); go(el.dataset.view,{}); break;
    case "account": openAccount(); break;
    case "signout": signOut(); break;
    case "make-range": makeRange(); break;
    case "load-layout": { if(SESSION.role!=="admin") break; el.disabled=true;
      SkiSync.loadLayout().then(n=>{ toast(n?n+" locations created":"Nothing missing", n?"":"info"); render(); })
        .catch(e=>{ toast(e.message,"err"); el.disabled=false; }); break; }
    case "drop-area": dropArea(el.dataset.sec); break;
    case "do-drop-area": { const sec=el.dataset.sec;
      DB.storages=DB.storages.filter(s=>!((s.section||"Unassigned area")===sec&&s.status==="available"&&s.room_id==null&&!eqCount(s.id)&&!cardsOfStorage(s.id).length));
      log("Area deleted",{notes:sec}); save(); closeSheet(); toast("Area deleted"); render(); break; }
    case "wipe-all": openSheet(`<h3 style="color:var(--st-attention)">Erase everything</h3>
      <p class="sub">Every room, key card, storage location and item is removed. Staff accounts stay.</p>
      <div class="btn-grid"><button class="btn" data-act="close-sheet">Cancel</button>
        <button class="btn danger" data-act="do-wipe">Erase everything</button></div>`); break;
    case "do-wipe": { if(SESSION.role!=="admin") break; DB=normaliseDB(emptyDB(DB.users)); save(); closeSheet(); toast("Hall is empty now","info"); home(); break; }
    /* scan */
    case "scan": go("scan",{ctx:el.dataset.ctx||"identify",room_id:el.dataset.room?+el.dataset.room:null,storage_id:el.dataset.storage?+el.dataset.storage:null}); break;
    case "nfc-start": startNFC(); break;
    case "native-scan": askNativeScan(); break;
    case "submit-code": submitCode(); break;
    case "paste-code": pasteCode(); break;
    case "done-adding": closeSheet(); replaceView("room",{id:+el.dataset.id}); break;
    case "do-reassign": doReassign(+el.dataset.card,+el.dataset.room, el.dataset.storage?+el.dataset.storage:null); break;
    /* register */
    case "pick-storage": { const f=$("#fStorage"); if(f) f.value=el.dataset.n; break; }
    case "reuse-room": $("#fRoom").value=el.dataset.n; if(el.dataset.g) $("#fGuest").value=el.dataset.g;
      $("#fStorage").focus(); toast("Room "+el.dataset.n+" filled in","info"); break;
    case "save-card": saveNewCard(el.dataset.code, el.dataset.next); break;
    /* equipment */
    case "add-eq": openEqSheet(id); break;
    case "quick-eq": openCheckinSheet(id); break;
    case "eq-save": saveEq(el.dataset.storage, el.dataset.id?+el.dataset.id:null); break;
    case "eq-delete": { const eq=DB.equipment.find(x=>x.id===id); if(!eq){ closeSheet(); break; } DB.equipment=DB.equipment.filter(x=>x.id!==id);
      log("Equipment removed",{storage_id:eq.storage_id,notes:catInfo(eq.category).label}); save(); closeSheet(); toast("Equipment removed"); render(); break; }
    case "eq-plus": { const eq=DB.equipment.find(x=>x.id===id); if(!eq){ render(); break; } eq.quantity=(+eq.quantity||0)+1; eq.updated_at=now(); save(); render(); break; }
    case "eq-minus": { const eq=DB.equipment.find(x=>x.id===id); if(!eq){ render(); break; }
      if(+eq.quantity>1){ eq.quantity=+eq.quantity-1; eq.updated_at=now(); } else { DB.equipment=DB.equipment.filter(x=>x.id!==id);
        log("Equipment removed",{storage_id:eq.storage_id,notes:catInfo(eq.category).label}); }
      save(); render(); break; }
    case "q-toggle": qToggle(el.dataset.k,+el.dataset.d); break;
    /* workflows */
    case "checkin-here": openCheckinSheet(id); break;
    case "do-checkin": doCheckin(id); break;
    case "checkout-eq": confirmCheckout(id); break;
    case "final-out": confirmFinalOut(id); break;
    case "do-final-out": doFinalOut(id, el.dataset.next); break;
    case "do-checkout": doCheckout(id); break;
    case "return-eq": confirmReturn(id); break;
    case "do-return": doReturn(id, el.dataset.next); break;
    case "set-ready": { const s=stor(id); if(!s) break; setStorageStatus(s,"ready","Prepared for guest");
      log("Marked ready for guest",{storage_id:s.id,room_id:s.room_id}); save(); toast("Ready for guest"); render(); break; }
    case "set-status": openStatusSheet(id); break;
    case "pick-status": { const s=stor(id); if(!s){ closeSheet(); break; } setStorageStatus(s,el.dataset.s,"Manual change"); save(); closeSheet(); toast("Status updated"); render(); break; }
    case "assign-room": openAssignRoom(id); break;
    case "do-assign-room": doAssignRoom(id); break;
    case "assign-free": { const free=DB.storages.find(s=>s.status==="available"); if(!free){ toast("No free storage","err"); break; }
      openAssignRoomFromRoom(+el.dataset.room); break; }
    case "move-storage": openMoveSheet(id); break;
    case "do-move": doMove(id); break;
    case "release-storage": releaseStorage(id); break;
    case "do-release": doRelease(id); break;
    case "unlink-card": { const c=card(id); if(!c){ render(); break; }
      openSheet(`<h3>Remove key card</h3><p class="sub">Card <b class="mono">${esc(c.card_code)}</b> will stop opening this storage. It is released, so it can be registered again later.</p>
        <div class="btn-grid"><button class="btn" data-act="close-sheet">Cancel</button>
        <button class="btn danger" data-act="do-unlink" data-id="${c.id}">Remove card</button></div>`); break; }
    case "do-unlink": { const c=card(id); if(!c){ closeSheet(); break; }
      const ur=room(c.room_id);
      log("Key card removed",{key_card_id:c.id,room_id:c.room_id,storage_id:c.storage_id,notes:ur?.guest_name||""});
      // released rather than deleted: history keeps pointing at it and the card is reusable
      c.last_room_id=c.room_id; c.last_storage_id=c.storage_id;
      Object.assign(c,{room_id:null,storage_id:null,status:"released",released_at:now(),updated_at:now()});
      freeRoom(ur);
      save(); closeSheet(); toast("Key card removed"); render(); break; }
    case "staff-log": go("history",{staff:id}); break;
    case "rooms-all": replaceView("rooms",{all:!current().params.all}); break;
    case "set-pin": setPin(); break;
    case "set-admin": setAdminLogin(); break;
    case "add-member": addMember(); break;
    case "rm-member": removeMember(id); break;
    case "close-sheet": closeSheet(); break;
  }
});
function openAssignRoomFromRoom(roomId){
  const r=room(roomId), free=DB.storages.filter(s=>s.status==="available"&&s.room_id==null); if(!r) return;
  openSheet(`<h3>Assign a storage</h3><p class="sub">Room ${esc(r.room_number)}</p>
    <div class="pill-list">${free.slice(0,30).map(s=>`<button class="pill" data-act="do-assign-free" data-room="${r.id}" data-s="${s.id}">${esc(s.storage_number)}</button>`).join("")}</div>`);
}
document.addEventListener("click",e=>{
  const el=e.target.closest('[data-act="do-assign-free"]'); if(!el) return;
  const s=stor(+el.dataset.s), r=room(+el.dataset.room);
  if(!s||!r){ closeSheet(); render(); return; }
  if(s.status!=="available"||s.room_id!=null){ toast(`${s.storage_number} is no longer free`,"err"); closeSheet(); render(); return; }
  s.room_id=r.id; s.updated_at=now(); r.status="staying"; setStorageStatus(s,"preparing","Assigned to room "+r.room_number);
  cardsOfRoom(r.id).forEach(c=>{ if(c.storage_id==null){ c.storage_id=s.id; c.updated_at=now(); } });
  log("Storage assigned",{storage_id:s.id,room_id:r.id,next:s.storage_number});
  save(); closeSheet(); toast(s.storage_number+" assigned"); replaceView("storage",{id:s.id});
});

/* ==========================================================================
   17. BOOT
   ========================================================================== */
/* Changes from other devices / the admin console arrive through SkiSync. */
function onRemoteChange(full){
  if(!SESSION) return;
  const u=user(SESSION.id);
  if(!u || u.retired || u.archived){ SkiSync._authLost(); return; }
  SESSION=u;
  const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(!$("#modal").classList.contains("hidden") || typing){ staleView=true; return; }  // don't wipe what the user is doing
  render();
}
document.addEventListener("focusout",()=>{ setTimeout(()=>{
  if(staleView && $("#modal").classList.contains("hidden") && !(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))){ staleView=false; render(); }
},0); });
SkiSync.init({
  get: () => DB,
  set: d => { DB = normaliseDB(d); },
  onRemote: onRemoteChange,
  canWriteUsers: () => !!(SESSION && SESSION.role==="admin"),
  onConflict: msg => { toast(msg,"info"); if(SESSION){ const u=user(SESSION.id); if(u) SESSION=u; closeSheet(); render(); } },
  onAuthLost: () => { const was=!!SESSION; SESSION=null; pinOk=false; pin=""; nav=[]; DB=normaliseDB(null); closeSheet();
    if(was) toast("Signed out — please sign in again","info"); API("/api/me").then(a=>{ AUTH=a; render(); }).catch(()=>render()); }
});
(async function boot(){
  DB = normaliseDB(null);
  nav=[{view:"dash",params:{}}];
  const handed = consumeUrlCard();
  try{ AUTH = await API("/api/me"); }catch(e){ toast(e.message,"err"); }
  if(AUTH && AUTH.user){
    try{ await SkiSync.start(); SESSION = user(AUTH.user.id) || null; }catch(e){ toast(e.message,"err"); }
  }
  render();
  if(handed) receiveCard(handed);
})();
</script>
