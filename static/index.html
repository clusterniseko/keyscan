<style>
/* ============================================================
   SKI VALET — design tokens
   night/slab: glacier navy hall   signal: piste marker orange
   glacier: ice blue information   status: trail-sign colours
   ============================================================ */
:root{
  --night:#0E1621; --slab:#16222F; --slab2:#1D2C3B; --line:#27394B;
  --frost:#E7EEF5; --mist:#90A4B8; --dim:#63798F;
  --signal:#FF6A2B; --signal-d:#E2551A; --glacier:#5EC8F2;

  --st-available:#64748B; --st-preparing:#F0A93B; --st-occupied:#5EC8F2;
  --st-ready:#35C36A; --st-guest:#A98BF5; --st-attention:#FF4D4D; --st-closed:#3C4A5A;

  --r:14px; --r-s:10px;
  --sh:0 6px 24px rgba(0,0,0,.35);
  --tap:56px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --display:"Barlow Condensed", "Oswald", Impact, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--night);color:var(--frost);font-family:var(--body);
  font-size:16px;line-height:1.45;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none !important}
::selection{background:var(--signal);color:#fff}
:focus-visible{outline:3px solid var(--glacier);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
#shell{max-width:1100px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(14,22,33,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.topbar .tb-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:var(--slab);border:1px solid var(--line);font-size:22px;color:var(--frost);flex:none}
.topbar .tb-btn:active{background:var(--slab2)}
.tb-title{flex:1;min-width:0}
.tb-title b{display:block;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.4px;
  text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title span{display:block;font-size:11px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase}
.who{display:flex;align-items:center;gap:8px;background:var(--slab);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:600;flex:none}
.who i{width:28px;height:28px;border-radius:50%;background:var(--signal);color:#111;display:grid;
  place-items:center;font-style:normal;font-family:var(--display);font-size:16px;font-weight:700}
main{flex:1;padding:16px 14px calc(28px + var(--safe-b))}

/* ---------- type ---------- */
h2.sec{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:1.6px;
  font-size:14px;color:var(--mist);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec:first-child{margin-top:4px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.5px}

/* ---------- ski-check tag (signature) ---------- */
.tag{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,#F3F7FB,#D6E2EC);
  color:#0E1621;border-radius:8px;padding:8px 14px 8px 10px;font-family:var(--display);font-weight:700;
  font-size:26px;letter-spacing:1px;line-height:1;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.tag::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--night);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.8);flex:none}
.tag.sm{font-size:18px;padding:5px 10px 5px 7px;border-radius:6px}
.tag.sm::before{width:8px;height:8px}
.tag.ghost{background:none;border:1px dashed var(--line);color:var(--dim);box-shadow:none}
.tag.ghost::before{background:none;box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- cards / panels ---------- */
.panel{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel + .panel{margin-top:10px}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.muted{color:var(--mist)}
.tiny{font-size:12px;letter-spacing:.4px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:1.6px;font-size:12px;color:var(--dim)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}

/* ---------- status ---------- */
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;
  font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:1.2px;font-size:13px;
  background:var(--slab2);border:1px solid var(--line);white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.s-available{color:var(--st-available)} .s-preparing{color:var(--st-preparing)}
.s-occupied{color:var(--st-occupied)} .s-ready{color:var(--st-ready)}
.s-guest_using{color:var(--st-guest)} .s-attention{color:var(--st-attention)} .s-closed{color:var(--st-closed)}
.chip.solid{color:#0E1621;border:0}
.chip.solid.s-ready{background:var(--st-ready)} .chip.solid.s-occupied{background:var(--st-occupied)}
.chip.solid.s-preparing{background:var(--st-preparing)} .chip.solid.s-guest_using{background:var(--st-guest)}
.chip.solid.s-attention{background:var(--st-attention);color:#fff} .chip.solid.s-available{background:var(--st-available);color:#fff}
.chip.solid.s-closed{background:var(--st-closed);color:#fff}
.chip.solid .dot{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:var(--tap);
  padding:0 18px;border-radius:var(--r-s);background:var(--slab2);border:1px solid var(--line);
  font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--frost);width:100%;transition:transform .06s ease,background .15s ease}
.btn:active{transform:scale(.985);background:#243549}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#160B04}
.btn.primary:active{background:var(--signal-d)}
.btn.go{background:var(--st-ready);border-color:var(--st-ready);color:#06210F}
.btn.danger{background:transparent;border-color:#5A2530;color:#FF8080}
.btn.ghost{background:transparent}
.btn.sm{min-height:42px;font-size:15px;padding:0 12px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.btn-grid.one{grid-template-columns:1fr}
@media(max-width:360px){.btn{font-size:17px}}

/* ---------- dashboard hero ---------- */
.hero{position:relative;border-radius:18px;padding:22px 18px;overflow:hidden;
  background:linear-gradient(145deg,#1B2C3D 0%,#12202D 55%,#0E1621 100%);border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:auto -40px -70px auto;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,106,43,.20),transparent 65%)}
.hero .eyebrow{color:var(--signal)}
.hero h1{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:1px;
  font-size:clamp(30px,8vw,44px);line-height:.95;margin:6px 0 14px}
.scan-cta{position:relative;z-index:2;display:flex;align-items:center;gap:16px;width:100%;
  background:var(--signal);color:#160B04;border-radius:14px;padding:16px 18px;text-align:left}
.scan-cta:active{background:var(--signal-d)}
.scan-cta .rd{width:52px;height:52px;border-radius:14px;background:rgba(0,0,0,.18);display:grid;place-items:center;flex:none}
.scan-cta .rd::before{content:"";width:20px;height:20px;border-radius:50%;border:3px solid #160B04;
  border-right-color:transparent;border-bottom-color:transparent;animation:rot 2.6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.scan-cta b{display:block;font-family:var(--display);font-size:27px;letter-spacing:1.2px;text-transform:uppercase;line-height:1}
.scan-cta span{font-size:13px;font-weight:600;opacity:.72}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
  border-left:4px solid var(--c,var(--glacier));text-align:left;width:100%}
.stat b{display:block;font-family:var(--display);font-size:38px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--c,var(--frost))}
.stat span{display:block;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--mist);margin-top:6px}

/* ---------- action grid ---------- */
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.actions{grid-template-columns:repeat(4,1fr)}}
.action{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:96px;padding:14px;
  background:var(--slab);border:1px solid var(--line);border-radius:var(--r);text-align:left}
.action:active{background:var(--slab2)}
.action .ico{font-size:24px;line-height:1}
.action b{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:1px;text-transform:uppercase;line-height:1}
.action small{color:var(--dim);font-size:11px;letter-spacing:.6px}

/* ---------- alerts ---------- */
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--slab);border:1px solid var(--line);
  border-left:4px solid var(--st-preparing);border-radius:var(--r-s);padding:12px 14px;width:100%;text-align:left}
.alert.hot{border-left-color:var(--st-attention)}
.alert + .alert{margin-top:8px}
.alert b{font-family:var(--display);letter-spacing:1px;text-transform:uppercase;font-size:15px;display:block}
.alert p{margin:2px 0 0;font-size:13px;color:var(--mist)}

/* ---------- list rows ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--slab);border:1px solid var(--line);
  border-radius:var(--r-s);padding:11px 12px;width:100%;text-align:left;min-height:64px}
.item:active{background:var(--slab2)}
.item .body{flex:1;min-width:0}
.item .body b{font-family:var(--display);font-size:19px;letter-spacing:.6px;display:block;line-height:1.1}
.item .body small{color:var(--mist);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .arr{color:var(--dim);font-size:20px}

/* ---------- map ---------- */
.map-area{margin-bottom:20px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.cell{aspect-ratio:1;border-radius:12px;background:var(--slab);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:4px;
  position:relative;overflow:hidden}
.cell:active{transform:scale(.96)}
.cell .n{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.5px}
.cell .k{font-size:10px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase}
.cell::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c,var(--st-available))}
.cell.on{border-color:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:14px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mist);letter-spacing:.6px;text-transform:uppercase}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:1.4px;
  font-size:12px;color:var(--mist);margin-bottom:6px}
.input{width:100%;min-height:var(--tap);background:var(--night);border:1px solid var(--line);
  border-radius:var(--r-s);padding:0 14px;color:var(--frost);font-size:18px;font-weight:600}
.input:focus{border-color:var(--glacier);outline:none}
textarea.input{padding:12px 14px;min-height:90px;font-weight:400;font-size:15px}
.input.big{font-family:var(--display);font-size:30px;letter-spacing:2px;text-align:center;min-height:66px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mist) 50%),linear-gradient(135deg,var(--mist) 50%,transparent 50%);
  background-position:calc(100% - 20px) 26px,calc(100% - 14px) 26px;background-size:6px 6px;background-repeat:no-repeat}
.hint{font-size:12px;color:var(--dim);margin-top:6px}

/* ---------- scan pad ---------- */
.pad{position:relative;border-radius:20px;border:1px solid var(--line);background:
  radial-gradient(120% 80% at 50% 0%,#1E3245,#101B26);padding:30px 18px;text-align:center;overflow:hidden}
.pad .ring{width:132px;height:132px;margin:0 auto 16px;border-radius:50%;border:2px solid rgba(94,200,242,.35);
  display:grid;place-items:center;position:relative}
.pad .ring::before,.pad .ring::after{content:"";position:absolute;inset:-2px;border-radius:50%;
  border:2px solid var(--glacier);opacity:0;animation:ping 2.4s ease-out infinite}
.pad .ring::after{animation-delay:1.2s}
@keyframes ping{0%{transform:scale(.72);opacity:.75}80%{transform:scale(1.28);opacity:0}100%{opacity:0}}
.pad .card3d{width:78px;height:50px;border-radius:8px;background:linear-gradient(150deg,#F3F7FB,#B9CBD9);
  position:relative;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.pad .card3d::after{content:"";position:absolute;left:9px;top:16px;width:16px;height:13px;border-radius:3px;
  background:linear-gradient(180deg,#D8A83E,#B9862A)}
.pad h3{font-family:var(--display);font-size:26px;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 4px}
.pad p{margin:0;color:var(--mist);font-size:14px}
.pad.ok{border-color:var(--st-ready)}
.nfc-state{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;letter-spacing:1px;
  text-transform:uppercase;color:var(--mist);font-family:var(--display)}
.nfc-state i{width:9px;height:9px;border-radius:50%;background:var(--st-preparing)}
.nfc-state.live i{background:var(--st-ready)} .nfc-state.off i{background:var(--st-closed)}

/* ---------- equipment ---------- */
.eq{display:flex;align-items:center;gap:12px;background:var(--slab);border:1px solid var(--line);
  border-radius:var(--r-s);padding:10px 12px}
.eq + .eq{margin-top:8px}
.eq .ic{width:40px;height:40px;border-radius:10px;background:var(--slab2);display:grid;place-items:center;font-size:20px;flex:none}
.eq .body{flex:1;min-width:0}
.eq .body b{font-family:var(--display);font-size:18px;letter-spacing:.6px;display:block;line-height:1.15}
.eq .body small{color:var(--mist);font-size:12px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--night);border:1px solid var(--line);border-radius:10px;flex:none}
.stepper button{width:40px;height:44px;font-size:22px;font-family:var(--display);color:var(--frost);display:grid;place-items:center}
.stepper button:active{background:var(--slab2)}
.stepper .q{min-width:34px;text-align:center;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:520px){.quick{grid-template-columns:repeat(4,1fr)}}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:12px;
  background:var(--slab);border:1px solid var(--line);min-height:80px;justify-content:center}
.qbtn .ic{font-size:22px}
.qbtn b{font-family:var(--display);font-size:14px;letter-spacing:.8px;text-transform:uppercase;text-align:center;line-height:1.05}
.qbtn.on{border-color:var(--signal);background:rgba(255,106,43,.14)}
.qbtn .cnt{font-family:var(--display);font-size:13px;color:var(--signal)}

/* ---------- history ---------- */
.hist{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;position:relative}
.hev{position:relative;padding:0 0 16px}
.hev::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--glacier);box-shadow:0 0 0 3px var(--night)}
.hev .t{font-family:var(--display);letter-spacing:1px;font-size:13px;color:var(--dim);text-transform:uppercase}
.hev b{font-family:var(--display);font-size:17px;letter-spacing:.6px;display:block;line-height:1.2}
.hev p{margin:2px 0 0;font-size:13px;color:var(--mist)}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(6,10,15,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:0}
@media(min-width:640px){.modal{align-items:center;padding:20px}}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--slab);
  border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + var(--safe-b));
  animation:up .18s ease-out}
@media(min-width:640px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--display);font-size:24px;letter-spacing:1.2px;text-transform:uppercase;margin:0 0 4px}
.sheet .sub{color:var(--mist);font-size:14px;margin:0 0 16px}
#toast{position:fixed;left:0;right:0;bottom:calc(18px + var(--safe-b));z-index:120;display:flex;
  flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{background:var(--st-ready);color:#06210F;border-radius:12px;padding:13px 18px;font-weight:700;
  font-family:var(--display);font-size:19px;letter-spacing:.8px;text-transform:uppercase;box-shadow:var(--sh);
  animation:up .16s ease-out;max-width:520px;text-align:center}
.toast.err{background:var(--st-attention);color:#fff}
.toast.info{background:var(--glacier);color:#052637}

/* ---------- login ---------- */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:26px 18px calc(26px + var(--safe-b));max-width:460px;margin:0 auto}
.brand{font-family:var(--display);text-transform:uppercase;line-height:.92;margin-bottom:26px}
.brand .a{font-size:13px;letter-spacing:5px;color:var(--signal)}
.brand .b{font-size:clamp(42px,13vw,60px);font-weight:700;letter-spacing:1px}
.brand .c{font-size:15px;letter-spacing:3.4px;color:var(--mist)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.keypad button{min-height:60px;border-radius:12px;background:var(--slab);border:1px solid var(--line);
  font-family:var(--display);font-size:26px}
.keypad button:active{background:var(--slab2)}
.pins{display:flex;gap:10px;justify-content:center;margin:16px 0 4px}
.pins i{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);display:block}
.pins i.f{background:var(--signal);border-color:var(--signal)}
.rolebar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.rolebar button{flex:none;padding:10px 14px;border-radius:999px;background:var(--slab);border:1px solid var(--line);
  font-family:var(--display);letter-spacing:1px;text-transform:uppercase;font-size:15px}
.rolebar button.on{background:var(--frost);color:var(--night);border-color:var(--frost)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:40px 16px;color:var(--dim)}
.empty .ic{font-size:34px;display:block;margin-bottom:10px;opacity:.6}
.searchbar{display:flex;gap:8px;align-items:center;background:var(--slab);border:1px solid var(--line);
  border-radius:14px;padding:0 14px;min-height:var(--tap)}
.searchbar input{flex:1;background:none;border:0;outline:none;font-size:17px;font-weight:600;min-width:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mist)}
.kv b{font-family:var(--display);font-size:17px;letter-spacing:.6px}
.pill-list{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--night);border:1px solid var(--line);border-radius:8px;padding:8px 11px;
  font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.pill .x{color:var(--dim);font-size:16px}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- tablet / landscape ---------- */
@media(min-width:760px){
  main{padding:22px 22px calc(40px + var(--safe-b))}
  .hero{padding:30px 26px}
  .map-grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .cell .n{font-size:20px}
  .item{min-height:72px}
  .two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start}
  .two-col > *{min-width:0}
}
/* phone in landscape — keep the scan pad from eating the screen */
@media(max-height:480px) and (orientation:landscape){
  .pad{padding:16px 14px}
  .pad .ring{width:88px;height:88px;margin-bottom:10px}
  .pad .card3d{width:58px;height:38px}
  .hero h1{font-size:26px}
}
/* installed as a home-screen app: no browser chrome, so pad the top */
@media(display-mode:standalone){ .topbar{padding-top:calc(10px + env(safe-area-inset-top,0px))} }

/* ---------- visual refinement ---------- */
:root{--night:#09131f;--slab:#132333;--slab2:#1a3042;--line:#2b4357;--frost:#f1f7fc;--mist:#a8bdcf;--dim:#71899e;--r:16px;--r-s:11px;--sh:0 14px 34px rgba(0,0,0,.28)}
html,body{background:radial-gradient(1100px 600px at 10% -10%,#1c3b50 0%,transparent 58%),var(--night)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(120deg,rgba(94,200,242,.035),transparent 34%,rgba(255,106,43,.045));}
.topbar{box-shadow:0 8px 24px rgba(3,10,17,.2);border-color:rgba(112,151,178,.28)}
.topbar .tb-btn,.who,.panel,.stat,.action,.item,.eq,.qbtn,.cell,.searchbar,.pad{box-shadow:0 8px 20px rgba(2,10,17,.14)}
.panel,.stat,.action,.item,.eq,.qbtn,.cell{border-color:rgba(112,151,178,.3)}
.panel{background:linear-gradient(145deg,rgba(27,48,66,.98),rgba(17,34,48,.98))}
.hero{border-color:rgba(118,175,204,.35);box-shadow:var(--sh);background:linear-gradient(135deg,#23465d 0%,#152c3d 54%,#0d1b29 100%)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.07),transparent 35%)}
.scan-cta{box-shadow:0 12px 24px rgba(221,78,24,.26);transition:transform .18s ease,box-shadow .18s ease}
.scan-cta:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(221,78,24,.34)}
.btn,.action,.item,.qbtn,.cell,.stat{transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease}
@media(hover:hover){.btn:hover{transform:translateY(-1px);border-color:#49677e;box-shadow:0 8px 18px rgba(0,0,0,.2)}.btn.primary:hover{border-color:#ff8b5c;background:#ff7a42}.action:hover,.item:hover,.qbtn:hover,.cell:hover,.stat:hover{transform:translateY(-2px);border-color:#49677e;background:#1b3143;box-shadow:0 12px 22px rgba(0,0,0,.18)}.cell.on:hover{border-color:var(--c)}}
.stat{overflow:hidden;position:relative}.stat::after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-38px;top:-38px;background:var(--c,var(--glacier));opacity:.07}
.tag{box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 5px 12px rgba(0,0,0,.18)}
.input,.searchbar{border-color:rgba(112,151,178,.34)}.input{background:rgba(5,15,24,.55);transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}.input:focus{background:#0b1926;box-shadow:0 0 0 4px rgba(94,200,242,.12)}
.chip{box-shadow:inset 0 1px rgba(255,255,255,.04)}
.modal{background:rgba(3,10,16,.78)}.sheet{box-shadow:0 -8px 36px rgba(0,0,0,.4);border-color:rgba(112,151,178,.42)}
@media(min-width:760px){#shell{max-width:1180px}.topbar{margin:10px 12px 0;border:1px solid rgba(112,151,178,.3);border-radius:16px}.hero{border-radius:22px}.panel{padding:18px}.stats{gap:12px}.actions{gap:12px}}
</style>
</head>
<body>
<div id="shell"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>

<script src="sync.js"></script>
<script>
"use strict";
/* ==========================================================================
   1. PERSISTENCE — PostgreSQL on the server (Flask on Railway) is the single
      source of truth, shared with admin.html. save() pushes only the records
      that changed (see sync.js); nothing is stored in the browser.
   ========================================================================== */
function save(){ SkiSync.save(); }
const COLLECTIONS = ["rooms","storages","cards","equipment","users","history"];
function normaliseDB(db){
  if(!db || typeof db!=="object" || Array.isArray(db)) db = {};
  COLLECTIONS.forEach(k=>{ if(!Array.isArray(db[k])) db[k]=[]; });
  return db;
}
/* Access model: ONE shared staff PIN for every valet (then each valet taps their
   name) and ONE admin login (username + password). Both are checked by the
   server and stored there only as hashes. */
const validPin = p => /^\d{4}$/.test(String(p??""));
const adminAcc = () => DB.users.find(u=>u.shared==="admin");
const staffAcc = () => DB.users.find(u=>u.shared==="staff");
const members  = () => DB.users.filter(u=>!u.shared&&!u.retired&&!u.archived).sort((a,b)=>String(a.name).localeCompare(b.name));
const archived = () => DB.users.filter(u=>!u.shared&&u.archived);
const nameTaken = (name,except) => members().some(u=>u!==except&&String(u.name).trim().toLowerCase()===name.trim().toLowerCase());
function credError(user,pw,pw2){
  if(!/^[A-Za-z0-9._-]{3,32}$/.test(user)) return "Username: 3–32 letters, numbers, . _ -";
  if(pw.length<8) return "Password must be at least 8 characters";
  if(pw!==pw2) return "The passwords do not match";
  return null;
}


/* ==========================================================================
   2. DOMAIN
   ========================================================================== */
const STATUS = {
  available:{label:"Available", c:"var(--st-available)"},
  preparing:{label:"Preparing", c:"var(--st-preparing)"},
  occupied :{label:"Stored",    c:"var(--st-occupied)"},
  ready    :{label:"Ready",     c:"var(--st-ready)"},
  guest_using:{label:"Guest using", c:"var(--st-guest)"},
  attention:{label:"Needs attention", c:"var(--st-attention)"},
  closed   :{label:"Closed",    c:"var(--st-closed)"}
};
const CATS = {
  skis:{label:"Skis", ic:"🎿", size:"Length (cm)", type:["Alpine","Touring","Race","Freeride","Kids"]},
  boots:{label:"Ski boots", ic:"👢", size:"Mondo size"},
  poles:{label:"Poles", ic:"🥢", size:"Length (cm)"},
  snowboard:{label:"Snowboard", ic:"🏂", size:"Length (cm)"},
  sbboots:{label:"Snowboard boots", ic:"🥾", size:"Size"},
  helmet:{label:"Helmet", ic:"⛑️", size:"Size"},
  goggles:{label:"Goggles", ic:"🥽"},
  other:{label:"Other", ic:"📦", size:"Detail"}
};
let DB = null, SESSION = null, nav = [], scanCtx = null, draft = null;

/* ids are unique across devices (clock + random, see sync.js) */
const uid = () => newId();
const now = () => Date.now();

/* Empty hall (used by "Erase everything"; accounts are kept). */
function emptyDB(users){
  return {rooms:[],storages:[],cards:[],equipment:[],users:users||[],
    history:[{id:uid(),user_id:null,action:"Hall created",room_id:null,storage_id:null,key_card_id:null,
      equipment_id:null,timestamp:now(),notes:"Empty database",prev:null,next:null}]};
}

/* --- lookups --- */
const room   = id => DB.rooms.find(r=>r.id===id);
const stor   = id => DB.storages.find(s=>s.id===id);
const card   = id => DB.cards.find(c=>c.id===id);
const user   = id => DB.users.find(u=>u.id===id);
const roomByNumber = n => DB.rooms.find(r=>String(r.room_number??"").trim().toLowerCase()===String(n).trim().toLowerCase());
/* "S-127", "s127" and "S 127" are the same location */
const storByNumber = n => { const k=normCode(n); return k ? DB.storages.find(s=>normCode(s.storage_number)===k) : undefined; };
const cardByCode   = c => { const k=normCode(c); return k ? DB.cards.find(x=>normCode(x.card_code)===k) : undefined; };
const cardsOfStorage = id => DB.cards.filter(c=>c.storage_id===id);
const cardsOfRoom    = id => DB.cards.filter(c=>c.room_id===id);
const eqOf   = id => DB.equipment.filter(e=>e.storage_id===id);
const eqCount= id => eqOf(id).reduce((a,e)=>a+(+e.quantity||0),0);
const storagesOfRoom = id => DB.storages.filter(s=>s.room_id===id);

/* a checked-out room has no guest — the name only lives on in the history */
const guestOf = r => r && r.status!=="checked_out" ? (r.guest_name||"") : "";
function normCode(s){ return String(s??"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
const stInfo = k => STATUS[k] || {label:String(k||"Unknown"), c:"var(--st-attention)"};
const catInfo = k => CATS[k] || CATS.other;
function log(action, o={}){
  DB.history.unshift({id:uid(),user_id:SESSION?SESSION.id:null,action,
    room_id:o.room_id??null,storage_id:o.storage_id??null,key_card_id:o.key_card_id??null,
    equipment_id:o.equipment_id??null,timestamp:now(),notes:o.notes||"",prev:o.prev||null,next:o.next||null});
  if(DB.history.length>5000) DB.history.length=5000;     // display cap only; the server keeps everything
}
function setStorageStatus(s,next,note){
  if(!s || s.status===next) return;
  const prev=s.status; s.status=next; s.updated_at=now();
  log("Status changed",{storage_id:s.id,room_id:s.room_id,prev:stInfo(prev).label,next:stInfo(next).label,notes:note||""});
}

/* ==========================================================================
   3. UTIL
   ========================================================================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
function fmtDay(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${+d} ${MON[+m-1]}`; }
function daysTo(iso){ if(!iso) return null;
  const t=todayISO(); if(iso===t) return 0;
  return Math.round((new Date(iso+"T12:00")-new Date(t+"T12:00"))/864e5); }
function fmtDT(ts){ if(!ts) return "—"; const d=new Date(ts); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()} — ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function ago(ts){ if(!ts) return "—"; const m=Math.round((now()-ts)/6e4); if(m<1)return"just now"; if(m<60)return m+" min ago";
  const h=Math.floor(m/60); if(h<24) return h+"h "+(m%60)+"m ago"; return Math.floor(h/24)+"d ago"; }
function toast(msg,kind){ const t=document.createElement("div"); t.className="toast"+(kind?" "+kind:"");
  t.textContent=msg; $("#toast").appendChild(t); setTimeout(()=>t.remove(),2600);
  if(navigator.vibrate) try{navigator.vibrate(kind==="err"?[40,60,40]:25)}catch(e){} }
function statusChip(st,solid){ const s=stInfo(st);
  return `<span class="chip ${solid?"solid ":""}s-${esc(st)}"><i class="dot"></i>${esc(s.label)}</span>`; }
const firstName = u => String(u&&u.name||"").trim().split(/\s+/)[0] || "—";

/* ==========================================================================
   4. ROUTER
   ========================================================================== */
function go(view,params={}){ nav.push({view,params}); render(); }
function replaceView(view,params={}){ nav[nav.length-1]={view,params}; render(); }
function back(){ if(nav.length>1){ nav.pop(); render(); } }
function home(){ nav=[{view:"dash",params:{}}]; render(); }
const current = ()=>nav[nav.length-1]||{view:"dash",params:{}};

const VIEWS = {};
function render(){
  staleView=false;
  const {view,params} = current();
  if(!SESSION){ $("#shell").innerHTML = adminLogin ? viewAdminLogin() : pinOk ? viewPickName() : viewLogin(); return; }
  const v = VIEWS[view] || VIEWS.dash;
  const out = v(params||{});
  $("#shell").innerHTML = `
    <header class="topbar">
      <button class="tb-btn" data-act="${nav.length>1?"back":"home"}" aria-label="${nav.length>1?"Back":"Home"}">${nav.length>1?"‹":"⌂"}</button>
      <div class="tb-title"><b>${esc(out.title)}</b><span>${out.sub||""}</span></div>
      ${nav.length>1?`<button class="tb-btn" data-act="home" aria-label="Dashboard">⌂</button>`:
        `<button class="who" data-act="account"><i>${esc(firstName(SESSION)[0])}</i>${esc(firstName(SESSION))}</button>`}
    </header>
    <main>${out.body}</main>`;
  window.scrollTo(0,0);
  if(out.after) out.after();
}

/* ==========================================================================
   5. LOGIN
   ========================================================================== */
let pin="", pendingHandOff=null, adminLogin=false, pinOk=false, busy=false;
let AUTH = {staff_pin_set:false};          // from /api/me — shown on the PIN screen
let PICK = [];                             // staff names returned after a correct PIN
/* After the shared PIN: each valet taps their own name (added by the admin). */
function viewPickName(){
  return `<div class="login">
    <div class="brand"><div class="a">Staff PIN accepted</div><div class="b">Who are you?</div><div class="c">Tap your name</div></div>
    <div class="list">${PICK.map(u=>`<button class="item" data-act="pick-name" data-id="${u.id}"><span class="body"><b>${esc(u.name)}</b></span><span class="arr">›</span></button>`).join("")}</div>
    <button class="btn ghost" data-act="pin-cancel" style="width:100%;margin-top:14px">Cancel</button>
  </div>`;
}
/* The server has accepted the login: load the hall and open the dashboard. */
async function afterSignIn(u){
  try{ await SkiSync.start(); }
  catch(e){ toast(e.message,"err"); SESSION=null; render(); return; }
  SESSION = user(u.id) || u;
  pinOk=false; pin=""; adminLogin=false; PICK=[];
  log("Signed in",{}); save();
  toast(SESSION.role==="admin" ? "Signed in as admin" : "Welcome, "+firstName(SESSION));
  home(); flushHandOff();
}
async function signInAs(id){
  if(busy) return; busy=true;
  try{ const r=await API("/api/login/member",{id}); await afterSignIn(r.user); }
  catch(e){ toast(e.message,"err"); pinOk=false; pin=""; render(); }
  finally{ busy=false; }
}
function viewLogin(){
  const noStaff=!AUTH.staff_pin_set;
  return `<div class="login">
    <div class="brand"><div class="a">Hotel operations</div><div class="b">Ski Valet</div><div class="c">Storage management</div></div>
    <div class="pins">${[0,1,2,3].map(i=>`<i class="${pin.length>i?"f":""}"></i>`).join("")}</div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pin" data-n="${n}">${n}</button>`).join("")}
      <button data-act="pin-clear">✕</button>
      <button data-act="pin" data-n="0">0</button>
      <button data-act="pin-del">⌫</button>
    </div>
    <p class="hint" style="text-align:center;margin-top:16px">${noStaff
      ?"The staff PIN is not set yet. An admin has to sign in and set it under Access."
      :"Enter the staff PIN."}</p>
    <button class="btn ghost" data-act="admin-login" style="width:100%;margin-top:10px">Admin sign in</button>
  </div>`;
}
function viewAdminLogin(){
  return `<div class="login">
    <div class="brand"><div class="a">Hotel operations</div><div class="b">Ski Valet</div><div class="c">Admin sign in</div></div>
    <label class="f"><span>Username</span><input class="input" id="alUser" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label class="f"><span>Password</span><input class="input" id="alPass" type="password" autocomplete="current-password"></label>
    <button class="btn primary" data-act="admin-signin" style="width:100%">Sign in</button>
    <button class="btn ghost" data-act="staff-login" style="width:100%;margin-top:10px">Back to staff PIN</button>
  </div>`;
}
async function adminSignIn(){
  if(busy) return; busy=true;
  const u=$("#alUser").value, p=$("#alPass").value;
  try{ const r=await API("/api/login/admin",{username:u,password:p}); await afterSignIn(r.user); }
  catch(e){ toast(e.message,"err"); const f=$("#alPass"); if(f) f.value=""; }
  finally{ busy=false; }
}
function flushHandOff(){
  if(!pendingHandOff || !SESSION) return;
  const c=pendingHandOff; pendingHandOff=null; receiveCard(c);
}
async function tryLogin(){
  if(busy) return; busy=true;
  const entered=pin; pin="";
  try{
    const r=await API("/api/login/pin",{pin:entered});
    if(r.user){ await afterSignIn(r.user); return; }           // no names added yet → generic "Staff"
    PICK=r.members||[]; pinOk=true; render();
  }catch(e){
    toast(e.message,"err");
    if(e.status===400 && /not set/.test(e.message)) AUTH.staff_pin_set=false;
    if(!SESSION) $("#shell").innerHTML=viewLogin();
  }finally{ busy=false; }
}
async function signOut(){
  closeSheet(); SESSION=null; pin=""; adminLogin=false; pinOk=false; nav=[];
  if(SkiSync.pending()){ try{ await SkiSync.save(); }catch(_){} }
  SkiSync.stop(); DB=normaliseDB(null);
  try{ await API("/api/logout",{}); }catch(_){}
  try{ AUTH=await API("/api/me"); }catch(_){}
  render();
}

/* ==========================================================================
   6. DASHBOARD
   ========================================================================== */
function alerts(){
  const out=[];
  DB.storages.forEach(s=>{
    if(!s.room_id && eqCount(s.id)>0)
      out.push({hot:false,t:"Storage without room",p:`${s.storage_number} holds ${eqCount(s.id)} items but no room is assigned.`,act:{view:"storage",id:s.id}});
    if(s.status==="attention")
      out.push({hot:true,t:"Storage needs attention",p:`${s.storage_number} is flagged for inspection.`,act:{view:"storage",id:s.id}});
  });
  DB.cards.forEach(c=>{
    if(c.room_id && !c.storage_id)
      out.push({hot:false,t:"Card without storage",p:`Card ${c.card_code} belongs to room ${room(c.room_id)?.room_number} but no storage is assigned.`,act:{view:"room",id:c.room_id}});
  });
  departingRooms().forEach(({r,d,sts})=>{
    const items=sts.reduce((a,x)=>a+eqCount(x.id),0);
    if(d<0) out.push({hot:true,t:"Departure not closed",p:`Room ${r.room_number} left on ${fmtDay(r.departure)} — ${sts.map(x=>x.storage_number).join(", ")} is still assigned${items?` with ${items} items`:""}.`,act:{view:"storage",id:sts[0].id}});
    else if(d===0) out.push({hot:false,t:"Leaving today",p:`Room ${r.room_number} checks out today — ${items} items in ${sts.map(x=>x.storage_number).join(", ")}.`,act:{view:"storage",id:sts[0].id}});
  });
  DB.storages.filter(s=>s.status==="guest_using").forEach(s=>{
    const h=DB.history.find(x=>x.storage_id===s.id&&x.action==="Equipment checked out");
    const hrs=h?(now()-h.timestamp)/36e5:0;
    if(hrs>=3) out.push({hot:true,t:"Equipment not returned",p:`Room ${room(s.room_id)?.room_number||"—"} checked out from ${s.storage_number} ${ago(h.timestamp)}.`,act:{view:"storage",id:s.id}});
  });
  return out;
}
VIEWS.dash = () => {
  const total=DB.storages.length;
  const avail=DB.storages.filter(s=>s.status==="available").length;
  const occ=DB.storages.filter(s=>!["available","closed"].includes(s.status)).length;
  const stored=DB.storages.filter(s=>["occupied","preparing","ready","attention"].includes(s.status)).reduce((a,s)=>a+eqCount(s.id),0);
  const ready=DB.storages.filter(s=>s.status==="ready").reduce((a,s)=>a+eqCount(s.id),0);
  const out=DB.storages.filter(s=>s.status==="guest_using").reduce((a,s)=>a+eqCount(s.id),0);
  const guests=DB.rooms.filter(r=>storagesOfRoom(r.id).some(s=>s.status!=="available")).length;
  const al=alerts(), recent=DB.history.slice(0,5);
  const A=(act,ic,label,small)=>`<button class="action" data-act="nav" data-view="${act}"><span class="ico">${ic}</span><b>${label}</b><small>${small}</small></button>`;
  return {title:"Ski Valet", sub:new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"}),
  body:`
    <section class="hero">
      <div class="eyebrow">Start here</div>
      <h1>Where is this<br>guest's equipment?</h1>
      <button class="scan-cta" data-act="scan" data-ctx="identify"><span class="rd"></span>
        <span><b>Scan key card</b><span>Tap the card on the reader — or type the code</span></span></button>
    </section>

function histEvent(h){

  if(h.prev&&h.next) bits.push(h.prev+" → "+h.next);
  if(h.notes) bits.push(h.notes);
  return `<div class="hev"><div class="t">${fmtDT(h.timestamp)} · ${esc(h.user_id!=null&&user(h.user_id)?firstName(user(h.user_id)):"System")}</div>

}

/* ==========================================================================
   7. SCAN
   --------------------------------------------------------------------------
   NATIVE BRIDGE — for the iOS wrapper app.
   iPhones cannot read NFC from the browser (WebKit has no Web NFC), but Core
   NFC can read the card UID from a native shell. A WKWebView / Capacitor
   wrapper only has to do two things:

     1) When the user taps "Scan with iPhone", we call:
            window.webkit.messageHandlers.skivalet.postMessage({action:"scan"})
        (or window.SkiValetNative.scan() for a Capacitor plugin)
        The native side opens NFCTagReaderSession and reads the tag identifier.

     2) When the UID comes back, the native side injects it:
            window.SkiValet.scan("04A2B7C19E3F80")
        That single call drives the exact same flow as an Android NFC tap.

   Nothing else in the app needs to change.
   ========================================================================== */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.userAgent.includes("Mac") && "ontouchend" in document);
const hasNativeBridge = () => !!(window.SkiValetNative ||
  (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.skivalet));
function askNativeScan(){
  try{
    if(window.SkiValetNative && window.SkiValetNative.scan) window.SkiValetNative.scan();
    else window.webkit.messageHandlers.skivalet.postMessage({action:"scan"});
    setNfc("live","Hold the card against the top of the iPhone");
  }catch(err){ toast("The native reader did not respond","err"); }
}
window.SkiValet = {
  scan(code){ receiveCard(code); },                // native side calls this
  version:"1.0",
  get ready(){ return !!SESSION; }
};
/* Capacitor bridge — active only inside the iOS wrapper, ignored in a browser. */
(function(){
  const plugin = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SkiValetNFC;
  if(!plugin()) return;
  window.SkiValetNative = {
    scan(){
      plugin().scan()
        .then(res => { if(res && res.uid) window.SkiValet.scan(res.uid);
                       else if(res && res.cancelled) setNfc("off","Scan cancelled — tap to try again"); })
        .catch(err => { setNfc("off","Reader error: "+(err && err.message ? err.message : "unknown")); });
    }
  };
})();


let nfcReader=null, nfcState="idle", wedge="", wedgeT=null;
const CTX_LABEL={identify:"Identify card",add_card:"Add key card",checkin:"Check in equipment",checkout:"Check out equipment",move:"Scan card"};
VIEWS.scan = (p) => {
  scanCtx = p;
  const target = p.ctx==="add_card" ? `<div class="panel" style="margin-bottom:12px"><div class="eyebrow">Will be linked to</div>
      <div class="row between" style="margin-top:8px"><b class="num" style="font-size:24px">Room ${esc(room(p.room_id)?.room_number||"—")}</b>
      ${stor(p.storage_id)?`<span class="tag sm">${esc(stor(p.storage_id).storage_number)}</span>`:`<span class="tag sm ghost">No storage</span>`}</div></div>` : "";
  return {title:CTX_LABEL[p.ctx]||"Scan key card", sub:"Step 1 of "+(p.ctx==="identify"?"1":"2"),
  body:`
    ${target}
    <div class="pad" id="pad">
      <div class="ring"><div class="card3d"></div></div>
      <h3>Tap the card</h3>
      <p>Hold the key card against the reader</p>
      <div class="nfc-state" id="nfcState"><i></i><span>Checking reader…</span></div>
    </div>
    <div class="btn-grid one" style="margin-top:14px">
      ${hasNativeBridge()
        ? `<button class="btn primary" data-act="native-scan">Scan with iPhone NFC</button>`
        : IS_IOS
          ? `<div class="alert"><span></span><span><b>iPhone: no NFC in the browser</b>
             <p>Apple does not allow web pages to read cards. Pair a Bluetooth card reader — it types the code straight into the field below — or install the wrapper app.</p></span></div>`
          : `<button class="btn primary" data-act="nfc-start">Enable NFC reader</button>`}
    </div>
    ${p.ctx==="identify"?`<button class="btn ghost" style="margin-top:10px" data-act="nav" data-view="rooms">No reader? Find by room number</button>`:""}
    <h2 class="sec">Or enter the code</h2>
    <div class="panel">
      <input class="input big" id="codeIn" placeholder="Card UID, e.g. 04A2B7C19E3F80" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <div class="hint">USB / Bluetooth readers that type the code work here automatically — the field stays focused.</div>
      <div class="btn-grid" style="margin-top:12px">
        <button class="btn" data-act="paste-code">Paste from clipboard</button>
        <button class="btn go" data-act="submit-code">Read card</button>
      </div>
    </div>
    <h2 class="sec">How cards are read</h2>
    <div class="panel tiny muted">Android reads cards directly. iPhone needs either a paired Bluetooth reader in keyboard mode or the wrapper app.
      Either way the app uses only the card's public UID / serial number, exactly as the device exposes it.
      Encrypted or proprietary data on hotel cards is never read, decrypted or copied. If your lock system offers an
      authorised API, the card code can be mapped to it later.</div>
  `,
  after(){
    const inp=$("#codeIn"); if(inp){ inp.focus(); inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); submitCode(); }}); }
    setNfc(nfcState==="live"?"live":"idle", nfcState==="live"?"Reader active — waiting for a card":( "NDEFReader" in window ? "Reader ready — tap Enable" : "NFC not available on this device"));
    if(hasNativeBridge()) setNfc("live","Native iPhone reader connected");
    else if(IS_IOS) setNfc("off","iPhone — pair a Bluetooth reader or type the code");
    else if(!("NDEFReader" in window)) setNfc("off","No NFC on this device — use a reader or the code field");
  }};
};
function setNfc(state,msg){ nfcState=state; const el=$("#nfcState"); if(!el)return;
  el.className="nfc-state "+(state==="live"?"live":state==="off"?"off":""); el.querySelector("span").textContent=msg; }
async function startNFC(){
  if(!("NDEFReader" in window)){ setNfc("off","No NFC here — Web NFC needs Chrome on Android. Use a reader or the code field"); return; }
  if(!window.isSecureContext){ setNfc("off","NFC needs the app to be opened over https://"); return; }
  if(nfcReader && nfcState==="live"){ setNfc("live","Reader active — waiting for a card"); return; }  // one reader only
  try{
    nfcReader = new NDEFReader();
    await nfcReader.scan();
    setNfc("live","Reader active — waiting for a card");
    let lastCode="", lastAt=0;
    nfcReader.onreading = ev => {
      // only the tag UID is used; NDEF record contents are never treated as a card code
      const code = normCode(ev.serialNumber);
      if(!code){ toast("This card has no readable UID in the browser","err"); return; }
      if(code===lastCode && now()-lastAt<1500) return;   // the same tap fires more than once
      lastCode=code; lastAt=now();
      receiveCard(code);
    };
    nfcReader.onreadingerror = () => {
      // Chrome only exposes the serial number for NDEF-readable tags. Hotel cards
      // are often not NDEF-formatted, in which case this fires every time and the
      // browser cannot give us the UID at all — the Android wrapper app can.
      toast("This card is not readable from the browser","err");
      setNfc("off","Card not NDEF — needs the Android wrapper app or a reader");
    };
  }catch(err){ nfcReader=null; setNfc("off","Reader blocked — allow NFC in the browser, or type the code"); }
}
/* Every card that arrives from outside the scan screen (NFC tap, iOS bridge,
   URL hand-off) goes through here, so it never lands in a stale context such
   as "add a card to room X" from a screen the user already left. */
function receiveCard(raw){
  const code=normCode(raw); if(!code) return;
  if(!SESSION){ pendingHandOff=code; toast("Sign in to open card "+code,"info"); return; }
  if(current().view!=="scan"){ closeSheet(); scanCtx={ctx:"identify"}; go("scan",{ctx:"identify"}); }
  else if(!$("#modal").classList.contains("hidden")) closeSheet();
  handleCard(code);
}
/* Free fallback for iPhones without the wrapper app: read the UID in any
   App Store NFC utility, copy it, and paste it here. */
async function pasteCode(){
  try{
    const txt = await navigator.clipboard.readText();
    const code = normCode(txt);
    if(!code){ toast("Clipboard is empty","err"); return; }
    handleCard(code);
  }catch(err){
    toast("Allow clipboard access, or type the code","err");
    $("#codeIn")?.focus();
  }
}
/* External hand-off: any app or Shortcut that can open a URL may pass a card
   as  ...index.html?card=04A2B7C19E3F80  and the app picks it up on load. */
function consumeUrlCard(){
  try{
    const q = new URLSearchParams(location.search);
    const raw = q.get("card") || q.get("uid");
    if(!raw) return null;
    history.replaceState(null,"",location.pathname);   // don't re-scan on refresh
    return normCode(raw) || null;
  }catch(e){ return null; }
}
function submitCode(){ const v=normCode($("#codeIn")?.value); if(!v){ toast("Enter a card code","err"); return; } handleCard(v); }
/* Enter submits the admin / first-run forms */
document.addEventListener("keydown", e=>{
  if(SESSION || e.key!=="Enter") return;
  if(e.target.closest && e.target.closest(".login")){ const b=$('.login [data-act="admin-signin"], .login [data-act="first-admin"]'); if(b){ e.preventDefault(); b.click(); } }
});
/* keyboard-wedge readers */
document.addEventListener("keydown", e=>{
  if(!SESSION || current().view!=="scan") return;
  if(document.activeElement && document.activeElement.id==="codeIn") return;
  if(!$("#modal").classList.contains("hidden")) return;   // a sheet is open
  if(e.key==="Enter"){ if(wedge.length>=4) handleCard(wedge); wedge=""; return; }
  if(e.key.length===1) { wedge+=e.key; clearTimeout(wedgeT); wedgeT=setTimeout(()=>wedge="",400); }
});

function handleCard(rawCode){
  const code = normCode(rawCode);
  if(!code) return;
  if(navigator.vibrate) try{navigator.vibrate(30)}catch(e){}
  const c = cardByCode(code);
  const ctx = scanCtx || {ctx:"identify"};

  if(ctx.ctx==="add_card"){
    const roomId=ctx.room_id??null, storageId=stor(ctx.storage_id)?ctx.storage_id:null;
    if(!room(roomId)){ toast("That room no longer exists","err"); home(); return; }
    const inUse = c && c.status!=="released" && (c.room_id!=null || c.storage_id!=null);
    if(inUse && c.room_id!==roomId){ askReassign(c, roomId, storageId); return; }
    if(c){                                   // same room, or a released card being reused
      const reused=c.status==="released";
      Object.assign(c,{room_id:roomId,storage_id:storageId,status:"active",released_at:null,updated_at:now(),last_scanned_at:now()});
      log(reused?"Key card reused":"Key card linked",{key_card_id:c.id,room_id:roomId,storage_id:storageId});
      save(); addedCardSheet(c); return;
    }
    const nc={id:uid(),card_code:code,room_id:roomId,storage_id:storageId,status:"active",created_at:now(),updated_at:now(),last_scanned_at:now()};
    DB.cards.push(nc);
    log("Key card added",{key_card_id:nc.id,room_id:roomId,storage_id:storageId});
    save(); addedCardSheet(nc);
    return;
  }
  if(!c || c.status==="released"){ replaceView("register",{code, next:ctx.ctx}); return; }
  c.last_scanned_at=now();
  log("Key card scanned",{key_card_id:c.id,room_id:c.room_id,storage_id:c.storage_id});
  save();
  if(stor(c.storage_id)) replaceView("storage",{id:c.storage_id, card_id:c.id, intent:ctx.ctx});
  else if(room(c.room_id)) replaceView("room",{id:c.room_id, card_id:c.id, notice:"This card has no storage yet."});
  else replaceView("register",{code, next:ctx.ctx});
}
function addedCardSheet(nc){
  openSheet(`<h3>Key card added</h3>
    <p class="sub">Card <b class="mono">${esc(nc.card_code)}</b> ${nc.storage_id?"now opens the same storage.":"is linked to the room."}</p>
    <div class="panel"><div class="row between"><b class="num" style="font-size:22px">Room ${esc(room(nc.room_id)?.room_number||"—")}</b>
      ${stor(nc.storage_id)?`<span class="tag sm">${esc(stor(nc.storage_id).storage_number)}</span>`:`<span class="tag sm ghost">No storage</span>`}</div></div>
    <div class="btn-grid" style="margin-top:14px">
      <button class="btn" data-act="close-sheet">Scan another card</button>
      <button class="btn primary" data-act="done-adding" data-id="${nc.room_id}">Done</button></div>`);
}
function askReassign(c,newRoomId,newStorageId){
  const oldR=room(c.room_id), oldS=stor(c.storage_id);
  openSheet(`<h3 style="color:var(--st-attention)">Card already in use</h3>
    <p class="sub">Card <b class="mono">${esc(c.card_code)}</b> is currently linked to:</p>
    <div class="panel"><div class="row between"><b class="num" style="font-size:22px">Room ${esc(oldR?.room_number||"—")}</b>
      ${oldS?`<span class="tag sm">${esc(oldS.storage_number)}</span>`:`<span class="tag sm ghost">No storage</span>`}</div></div>
    <p class="hint">Reassigning keeps the old room's other cards untouched and writes the change to the history.</p>
    <div class="btn-grid" style="margin-top:14px">
      <button class="btn" data-act="close-sheet">Cancel</button>
      <button class="btn primary" data-act="do-reassign" data-card="${c.id}" data-room="${newRoomId}" data-storage="${newStorageId||""}">Reassign card</button></div>`);
}
function doReassign(cardId,roomId,storageId){
  const c=card(cardId); if(!c) return;
  const from=`Room ${room(c.room_id)?.room_number||"—"} / ${stor(c.storage_id)?.storage_number||"—"}`;
  c.room_id=roomId; c.storage_id=storageId||null; c.status="active"; c.released_at=null; c.updated_at=now(); c.last_scanned_at=now();
  const to=`Room ${room(roomId)?.room_number||"—"} / ${stor(storageId)?.storage_number||"—"}`;
  log("Key card reassigned",{key_card_id:c.id,room_id:roomId,storage_id:storageId||null,prev:from,next:to});
  save(); closeSheet(); toast("Card reassigned"); render();
}

    <div class="btn-grid one" style="margin-top:20px">

      <button class="btn ghost" data-act="back">Cancel</button>
    </div>`,
  after(){ setTimeout(()=>$("#fRoom")?.focus(),80); }};
};
function saveNewCard(code,next){
  const rNum=$("#fRoom").value.trim(), guest=$("#fGuest").value.trim();
  const sNum=$("#fStorage").value.trim().toUpperCase().replace(/\s+/g," ");
  const dep=$("#fOut")?$("#fOut").value:"";
  if(!rNum && !normCode(sNum)){ toast("Enter a room or a storage","err"); return; }
  // validate everything BEFORE changing data, so an error never leaves half a registration behind
  let r = rNum ? roomByNumber(rNum) : null;
  let s = normCode(sNum) ? storByNumber(sNum) : null;
  if(s && s.room_id!=null && room(s.room_id)){
    const owner=room(s.room_id);
    if(!rNum){ toast(`${s.storage_number} belongs to room ${owner.room_number} — enter that room`,"err"); return; }
    if(!r || owner.id!==r.id){ toast(`${s.storage_number} belongs to room ${owner.room_number}`,"err"); return; }
  }
  if(rNum){
    if(!r){ r={id:uid(),room_number:rNum,guest_name:guest,departure:dep,status:"staying",created_at:now(),updated_at:now()}; DB.rooms.push(r); }
    else { if(r.status==="checked_out"){ r.guest_name=guest; r.departure=dep; } else { if(guest) r.guest_name=guest; if(dep) r.departure=dep; }
      r.status="staying"; r.updated_at=now(); } }
  if(normCode(sNum)){
    if(!s){ s={id:uid(),storage_number:sNum,section:"Unassigned area",status:"available",room_id:null,created_at:now(),updated_at:now()}; DB.storages.push(s); }
    if(r){ s.room_id=r.id; s.updated_at=now(); if(s.status==="available") setStorageStatus(s,"preparing","Assigned at card registration"); }
  }
  // every card of a room opens the same storage: reuse the room's storage if none was typed
  if(!s && r){ const own=storagesOfRoom(r.id); if(own.length) s=own[0]; }
  let c = cardByCode(code), reused = false;
  if(c){ reused = c.status==="released";
    Object.assign(c,{room_id:r?r.id:null,storage_id:s?s.id:null,status:"active",released_at:null,updated_at:now(),last_scanned_at:now()});
  }else{
    c={id:uid(),card_code:normCode(code),room_id:r?r.id:null,storage_id:s?s.id:null,status:"active",
      created_at:now(),updated_at:now(),last_scanned_at:now()};
    DB.cards.push(c);
  }
  log(reused?"Key card reused":"Key card registered",
    {key_card_id:c.id,room_id:c.room_id,storage_id:c.storage_id,notes:guest?"Guest: "+guest:""});
  save(); toast("Key card registered");
  if(s) replaceView("storage",{id:s.id,card_id:c.id,intent:next==="checkin"?"checkin":"new"});
  else  replaceView("room",{id:r.id,card_id:c.id,notice:"No storage assigned yet."});
}

function qToggle(k,d){

function doCheckin(storageId){
  const s=stor(+storageId); if(!s||!draft){ closeSheet(); return; }
  const n=Object.values(draft).reduce((a,q)=>a+(q||0),0);
  if(!n){ toast("Select at least one item","err"); return; }
  Object.entries(draft).forEach(([k,q])=>{ if(!q) return;
    const ex=DB.equipment.find(e=>e.storage_id===s.id&&e.category===k&&!e.size&&!e.type&&!e.description);
    if(ex){ ex.quantity=(+ex.quantity||0)+q; ex.updated_at=now(); }
    else DB.equipment.push({id:uid(),storage_id:s.id,category:k,description:"",quantity:q,size:"",type:"",status:"stored",created_at:now(),updated_at:now()});
  });
  setStorageStatus(s,"occupied","Check-in");
  log("Equipment checked in",{storage_id:s.id,room_id:s.room_id,notes:Object.entries(draft).filter(([,q])=>q).map(([k,q])=>`${catInfo(k).label} ×${q}`).join(", ")});
  save(); closeSheet(); toast(`${n} item${n===1?"":"s"} stored`); render();
}

/* Final check-out: guest takes everything home. Frees the storage and unlinks
   every key card from the room and the storage, so the same card can be used
   again from scratch on the next visit. */
function confirmFinalOut(storageId){
  const s=stor(+storageId), r=room(s.room_id), eq=eqOf(s.id), cards=cardsOfStorage(s.id);
  openSheet(`<h3>Check out &amp; release</h3>
    <p class="sub">Room ${esc(r?.room_number||"—")} · Storage ${esc(s.storage_number)}</p>
    ${eq.length?eq.map(e=>`<div class="eq"><div class="ic">${catInfo(e.category).ic}</div>
      <div class="body"><b>${esc(catInfo(e.category).label)} × ${esc(e.quantity)}</b>
      <small>${esc([e.type,e.size].filter(Boolean).join(" · ")||"—")}</small></div></div>`).join("")
      :`<div class="muted tiny">No equipment recorded.</div>`}
    <div class="panel" style="margin-top:12px">
      <div class="eyebrow">This will release</div>
      <div class="kv"><span>Storage</span><b>${esc(s.storage_number)} → free</b></div>
      <div class="kv"><span>Key cards</span><b>${cards.length} unlinked</b></div>
      <div class="kv"><span>Equipment</span><b>${eqCount(s.id)} items handed over</b></div>
    </div>
    <p class="hint">Everything stays in the history. Scanning the card again starts a fresh check-in.</p>
    <div class="btn-grid" style="margin-top:14px">
      <button class="btn" data-act="do-final-out" data-id="${s.id}" data-next="preparing">Release · needs cleaning</button>
      <button class="btn go" data-act="do-final-out" data-id="${s.id}" data-next="available">Release · free now</button>
    </div>
    <button class="btn ghost" style="margin-top:10px" data-act="close-sheet">Cancel</button>`);
}
/* Frees a storage: equipment records removed, every card of the storage (and
   the room's cards, if this was its last storage) released for reuse. */
/* A room with no storage and no cards is free: wipe the guest so the next stay
   starts clean (the guest name stays in the history notes). */
function freeRoom(r){
  if(!r || storagesOfRoom(r.id).length || cardsOfRoom(r.id).length) return false;
  r.status="checked_out"; r.guest_name=""; r.departure=""; r.updated_at=now();
  return true;
}
function releaseAll(s,next){
  const r=room(s.room_id);
  const cards=new Set(cardsOfStorage(s.id));
  s.room_id=null; s.status=next; s.updated_at=now();
  if(r && !storagesOfRoom(r.id).length) cardsOfRoom(r.id).forEach(c=>cards.add(c));
  cards.forEach(c=>{
    c.last_room_id=c.room_id??(r?r.id:null); c.last_storage_id=c.storage_id??s.id;
    c.room_id=null; c.storage_id=null; c.status="released"; c.released_at=now(); c.updated_at=now();
  });
  DB.equipment=DB.equipment.filter(e=>e.storage_id!==s.id);
  freeRoom(r);
  return cards.size;
}
function doFinalOut(id,next){
  const s=stor(+id); if(!s){ closeSheet(); home(); return; }
  const r=room(s.room_id), eq=eqOf(s.id), guest=r?.guest_name||"";
  const manifest=eq.map(e=>`${catInfo(e.category).label} ×${e.quantity}`).join(", ")||"no items";
  const prev=stInfo(s.status).label, roomId=s.room_id;
  const n=releaseAll(s,next);
  log("Checked out & released",{storage_id:s.id,room_id:roomId,prev,next:stInfo(next).label,
    notes:`${manifest} · ${n} card${n===1?"":"s"} released${r?" · room "+r.room_number:""}${guest?" · "+guest:""}`});
  save(); closeSheet(); toast("Checked out · "+s.storage_number+" released");
  home();
}

function openMoveSheet(id){
  const s=stor(+id); if(!s) return;
  if(SESSION.role!=="admin"){ toast("Only an admin can move a storage","err"); return; }
  const free=DB.storages.filter(x=>x.status==="available"&&x.id!==s.id);
  openSheet(`<h3>Move storage</h3><p class="sub">The room and its key cards follow the equipment.</p>
    <div class="row between panel" style="margin-bottom:12px"><span class="tag sm">${esc(s.storage_number)}</span><span class="num" style="font-size:22px">→</span><span class="tag sm ghost">Choose</span></div>

      <select class="input" id="mTo">${free.map(x=>`<option value="${x.id}">${esc(x.storage_number)} — ${esc(x.section||"")}</option>`).join("")||`<option value="">No free storage</option>`}</select></label>

function doMove(id){
  const from=stor(+id), toId=+$("#mTo").value, to=stor(toId);
  if(!from||!to){ toast("No target storage","err"); return; }
  if(to.status!=="available"||to.room_id!=null){ toast(`${to.storage_number} is no longer free`,"err"); closeSheet(); render(); return; }
  eqOf(from.id).forEach(e=>{ e.storage_id=to.id; e.updated_at=now(); });
  cardsOfStorage(from.id).forEach(c=>{ c.storage_id=to.id; c.updated_at=now(); });
  to.room_id=from.room_id; to.status=from.status; to.updated_at=now();
  from.room_id=null; from.status="available"; from.updated_at=now();
  log("Storage moved",{storage_id:to.id,room_id:to.room_id,prev:from.storage_number,next:to.storage_number});
  save(); closeSheet(); toast(`Moved to ${to.storage_number}`); replaceView("storage",{id:to.id});
}

  const s=stor(+id); if(!s) return; const cr=room(s.room_id);

    <label class="f"><span>Room number</span><input class="input big" id="arRoom" value="${cr?esc(cr.room_number):""}"></label>

function doAssignRoom(id){
  const s=stor(+id); if(!s){ closeSheet(); return; }
  const num=$("#arRoom").value.trim(), guest=$("#arGuest").value.trim(), dep=$("#arOut").value;
  if(!num){ toast("Enter a room number","err"); return; }
  let r=roomByNumber(num);
  if(!r){ r={id:uid(),room_number:num,guest_name:guest,departure:dep,status:"staying",created_at:now(),updated_at:now()}; DB.rooms.push(r); }
  else { if(r.status==="checked_out"){ r.guest_name=guest; r.departure=dep; } else { if(guest) r.guest_name=guest; if(dep) r.departure=dep; }
    r.status="staying"; r.updated_at=now(); }
  const prev=room(s.room_id)?.room_number||"—";
  s.room_id=r.id; s.updated_at=now();
  if(s.status==="available") setStorageStatus(s,"preparing");
  cardsOfStorage(s.id).forEach(c=>{ c.room_id=r.id; c.updated_at=now(); });
  cardsOfRoom(r.id).forEach(c=>{ if(c.storage_id==null){ c.storage_id=s.id; c.updated_at=now(); } });
  log("Room assigned",{storage_id:s.id,room_id:r.id,prev:"Room "+prev,next:"Room "+r.room_number});
  save(); closeSheet(); toast("Room "+r.room_number+" assigned"); render();
}
function releaseStorage(id){

  openSheet(`<h3 style="color:var(--st-attention)">Close and clear ${esc(s.storage_number)}</h3>

function doRelease(id){

  const prev=stInfo(s.status).label, roomId=s.room_id, guest=room(s.room_id)?.guest_name||"";
  const n=releaseAll(s,"available");

}

      <p class="muted tiny" style="margin:6px 0 14px">${SkiSync.missingLayout(DB).length} standard locations are missing (Main Hall S-101–112, Ski Wall S-120–131, Boot Room S-201–208). They are created empty and available.</p>

        ${admin?`<button class="btn sm danger" data-act="drop-area" data-sec="${esc(sec)}">Delete</button>`:""}</div>`;

  after(){ if(SESSION.role==="admin") setTimeout(()=>$("#hArea")?.focus(),80); }};
};
function makeRange(){
  const area=$("#hArea").value.trim()||"Unassigned area";
  const pfx=$("#hPfx").value.trim().toUpperCase();
  const from=parseInt($("#hFrom").value,10), to=parseInt($("#hTo").value,10);
  if(SESSION.role!=="admin"){ toast("Admins only","err"); return; }
  if(isNaN(from)||isNaN(to)||to<from||from<0){ toast("Check the From / To numbers","err"); return; }
  if(to-from>199){ toast("Maximum 200 locations at a time","err"); return; }
  let made=0;
  for(let i=from;i<=to;i++){
    const num=pfx+i; if(storByNumber(num)) continue;
    DB.storages.push({id:uid(),storage_number:num,section:area,status:"available",room_id:null,created_at:now(),updated_at:now()});
    made++;
  }
  if(!made){ toast("Those locations already exist","info"); return; }
  log("Locations created",{notes:`${made} × ${pfx}${from}–${pfx}${to} in ${area}`});
  save(); toast(made+" locations created"); render();
}
function dropArea(sec){
  const rows=DB.storages.filter(s=>(s.section||"Unassigned area")===sec), busy=rows.filter(s=>s.status!=="available"||s.room_id!=null||eqCount(s.id)>0);
  if(busy.length){ toast(`${busy.length} locations are in use — clear them first`,"err"); return; }
  openSheet(`<h3 style="color:var(--st-attention)">Delete ${esc(sec)}</h3>
    <p class="sub">Removes ${rows.length} empty locations. Nothing else is affected.</p>
    <div class="btn-grid"><button class="btn" data-act="close-sheet">Cancel</button>
      <button class="btn danger" data-act="do-drop-area" data-sec="${esc(sec)}">Delete area</button></div>`);
}

VIEWS.search = (p) => ({title:"Quick search", sub:"Card · room · storage · item",
  body:`<div class="searchbar">🔎<input id="qAll" placeholder="Room, storage, card code, guest, item…" autocomplete="off" value="${esc(p.q||"")}"></div>
    <div id="results" style="margin-top:14px"></div>`,
  after(){ const i=$("#qAll"); i.focus();
    const run=()=>{ $("#results").innerHTML=searchHTML(i.value.trim()); };
    i.addEventListener("input",run); run(); }});
function searchHTML(q){
  if(!q) return `<div class="empty"><span class="ic">🔎</span>Type a room, storage, card code, guest name, item or status.</div>`;
  const L=q.toLowerCase(), N=normCode(q), out=[];
  const cards=N.length>2?DB.cards.filter(c=>normCode(c.card_code).includes(N)):[];
  const rooms=DB.rooms.filter(r=>String(r.room_number??"").toLowerCase().includes(L)||guestOf(r).toLowerCase().includes(L));
  const sts=DB.storages.filter(s=>String(s.storage_number??"").toLowerCase().includes(L)||(N&&normCode(s.storage_number).includes(N))||stInfo(s.status).label.toLowerCase().includes(L)
    ||eqOf(s.id).some(e=>catInfo(e.category).label.toLowerCase().includes(L)||(e.type||"").toLowerCase().includes(L)));
  if(cards.length) out.push(`<h2 class="sec">Key cards · ${cards.length}</h2><div class="list">${cards.map(c=>`
    <button class="item" data-act="nav" data-view="${stor(c.storage_id)?"storage":room(c.room_id)?"room":"search"}" data-id="${stor(c.storage_id)?c.storage_id:room(c.room_id)?c.room_id:""}">
      <span class="body"><b class="mono" style="font-size:15px">${esc(c.card_code)}</b>
      <small>Room ${esc(room(c.room_id)?.room_number||"—")} → ${esc(stor(c.storage_id)?.storage_number||"no storage")}</small></span><span class="arr">›</span></button>`).join("")}</div>`);
  if(rooms.length) out.push(`<h2 class="sec">Rooms · ${rooms.length}</h2><div class="list">${rooms.map(roomRow).join("")}</div>`);
  if(sts.length) out.push(`<h2 class="sec">Storages · ${sts.length}</h2><div class="list">${sts.map(storageRow).join("")}</div>`);
  return out.join("")||`<div class="empty"><span class="ic">🤷</span>No match for “${esc(q)}”.<br>Try a room number or the card code.</div>`;
}
